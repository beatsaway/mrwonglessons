<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind Map: Pakistan — Simple & readable</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: linear-gradient(165deg, #e8eef7 0%, #dbeafe 45%, #f0fdf4 100%);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      color: #0f172a;
    }

    .mindmap-container {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
      padding: 1rem;
      width: 100%;
      max-width: 1400px;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #fffbeb;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      cursor: grab;
      width: 100%;
      height: auto;
      max-width: 1200px;
      touch-action: none;
    }

    canvas:active {
      cursor: grabbing;
    }

    canvas.cursor-move {
      cursor: move;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding: 0.7rem 1rem;
      border-radius: 12px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }

    .toolbar button {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }

    .toolbar button:hover {
      background: #eff6ff;
      border-color: #93c5fd;
    }

    .zoom-indicator {
      background: #ffffff;
      color: #0f172a;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      align-self: center;
    }

    .legend {
      text-align: center;
      font-size: 0.95rem;
      margin-top: 0.85rem;
      color: #475569;
      max-width: 44rem;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .toolbar button { font-size: 0.95rem; padding: 0.45rem 0.9rem; }
    }
  </style>
</head>
<body>

<div class="mindmap-container">
  <div class="toolbar">
    <button type="button" id="zoomInBtn">Zoom in</button>
    <button type="button" id="zoomOutBtn">Zoom out</button>
    <button type="button" id="resetViewBtn">Reset view</button>
    <span class="zoom-indicator" id="zoomLevel">100%</span>
  </div>
  <canvas id="mindmapCanvas" width="1200" height="900" style="width:100%; height:auto; max-width:1200px; aspect-ratio:1200/900"></canvas>
  <p class="legend">
    Drag a <strong>coloured cell</strong> to move it. Drag empty canvas to pan. Scroll or buttons to zoom. Large text on light coloured cells for easy reading.
  </p>
</div>

<script>
  (function () {
    const categories = [
      { name: "Geography & Nature", fill: "#bbf7d0", textColor: "#14532d", sub: ["Provinces", "Major cities", "Rivers", "Mountains", "Deserts", "Coastline"] },
      { name: "History & Independence", fill: "#fde68a", textColor: "#78350f", sub: ["Indus Valley", "Mughal era", "British Raj", "Lahore Resolution 1940", "1947 Independence", "1998 tests"] },
      { name: "Politics & Government", fill: "#fed7aa", textColor: "#9a3412", sub: ["1973 Constitution", "Parliament", "Parties", "Leaders", "Army", "Foreign relations"] },
      { name: "Culture & Traditions", fill: "#ffedd5", textColor: "#9a3412", sub: ["Languages", "Dress", "Food", "Festivals", "Music", "Handicrafts"] },
      { name: "Religion & Society", fill: "#d1fae5", textColor: "#065f46", sub: ["Islam", "Minorities", "Mosques", "Education", "Literacy", "Community"] },
      { name: "Economy & Industries", fill: "#ecfccb", textColor: "#3f6212", sub: ["Agriculture", "Textiles", "Remittances", "Resources", "CPEC", "Banks"] },
      { name: "Education & Science", fill: "#dbeafe", textColor: "#1e3a8a", sub: ["Universities", "Abdus Salam", "Nuclear program", "SUPARCO", "Science", "Literacy"] },
      { name: "Sports & Recreation", fill: "#fee2e2", textColor: "#991b1b", sub: ["Cricket", "Hockey", "Squash", "Other sports", "Stadiums", "Festivals"] },
      { name: "Media & Arts", fill: "#fce7f3", textColor: "#9d174d", sub: ["TV", "Film", "Dramas", "Music", "Literature", "Digital art"] },
      { name: "Landmarks & Tourism", fill: "#ccfbf1", textColor: "#134e4a", sub: ["UNESCO sites", "Modern icons", "Hill stations", "Valleys", "Beaches", "North"] },
      { name: "National Symbols", fill: "#dcfce7", textColor: "#14532d", sub: ["Flag", "Anthem", "Iqbal", "Markhor", "Bird", "Flower & tree"] }
    ];

    const CENTER_TEXT = "PAKISTAN";
    const canvas = document.getElementById("mindmapCanvas");
    const ctx = canvas.getContext("2d");

    const CANVAS_W = 1200;
    const CANVAS_H = 900;
    const centerX = CANVAS_W / 2;
    const centerY = CANVAS_H / 2;

    let offsetX = 0;
    let offsetY = 0;
    let scale = 1;
    const MIN_SCALE = 0.5;
    const MAX_SCALE = 2;

    let branchNodes = [];
    let subItemsNodes = [];
    const centerDrag = { x: 0, y: 0 };

    const BRANCH_RADIUS = 300;
    const SUB_RADIUS_START = 430;
    const SUB_STEP = 52;

    let isPanningCanvas = false;
    let panStartX = 0;
    let panStartY = 0;

    let draggingNode = null;
    let dragLastLogicalX = 0;
    let dragLastLogicalY = 0;

    let hoveredNode = null;
    let tooltipDiv = null;

    function saveDragState() {
      const b = {};
      branchNodes.forEach(function (n) {
        b[n.index] = { dx: n.dragX || 0, dy: n.dragY || 0 };
      });
      const s = {};
      subItemsNodes.forEach(function (n) {
        s[n.categoryIdx + "-" + n.itemIdx] = { dx: n.dragX || 0, dy: n.dragY || 0 };
      });
      return { b: b, s: s, cx: centerDrag.x, cy: centerDrag.y };
    }

    function computePositions() {
      const saved = branchNodes.length ? saveDragState() : { b: {}, s: {}, cx: 0, cy: 0 };
      const total = categories.length;
      const angleStep = (Math.PI * 2) / total;
      branchNodes = [];
      subItemsNodes = [];

      for (let i = 0; i < total; i++) {
        const angle = i * angleStep - Math.PI / 2;
        const cat = categories[i];
        const mainX = centerX + Math.cos(angle) * BRANCH_RADIUS;
        const mainY = centerY + Math.sin(angle) * BRANCH_RADIUS;

        ctx.font = "bold 18px system-ui, Segoe UI, sans-serif";
        const tw = ctx.measureText(cat.name).width;
        const boxW = Math.max(tw + 36, 188);
        const boxH = 56;
        const d = saved.b[i] || { dx: 0, dy: 0 };
        branchNodes.push({
          index: i,
          x: mainX - boxW / 2,
          y: mainY - boxH / 2,
          w: boxW,
          h: boxH,
          name: cat.name,
          fill: cat.fill,
          textColor: cat.textColor,
          dragX: d.dx,
          dragY: d.dy
        });

        const subCount = cat.sub.length;
        for (let j = 0; j < subCount; j++) {
          const angleOffset = (j - (subCount - 1) / 2) * 0.34;
          const finalAngle = angle + angleOffset * 0.62;
          const radialDistance = SUB_RADIUS_START + j * SUB_STEP;
          let subX = centerX + Math.cos(finalAngle) * radialDistance;
          let subY = centerY + Math.sin(finalAngle) * radialDistance;
          if (subCount > 4) {
            subX += Math.sin(angle) * (j % 2 === 0 ? 18 : -14);
            subY += Math.cos(angle) * (j % 2 === 0 ? 12 : -10);
          }
          const subText = cat.sub[j];
          ctx.font = "15px system-ui, Segoe UI, sans-serif";
          const tws = ctx.measureText(subText).width;
          const subBoxW = Math.min(Math.max(tws + 28, 132), 260);
          const subBoxH = 48;
          const key = i + "-" + j;
          const sd = saved.s[key] || { dx: 0, dy: 0 };
          subItemsNodes.push({
            categoryIdx: i,
            itemIdx: j,
            x: subX - subBoxW / 2,
            y: subY - subBoxH / 2,
            w: subBoxW,
            h: subBoxH,
            text: subText,
            fill: cat.fill,
            textColor: cat.textColor,
            dragX: sd.dx,
            dragY: sd.dy
          });
        }
      }
      centerDrag.x = saved.cx;
      centerDrag.y = saved.cy;
    }

    function nodeLeft(n) {
      return n.x + n.dragX;
    }
    function nodeTop(n) {
      return n.y + n.dragY;
    }
    function nodeCX(n) {
      return nodeLeft(n) + n.w / 2;
    }
    function nodeCY(n) {
      return nodeTop(n) + n.h / 2;
    }
    function centerCX() {
      return centerX + centerDrag.x;
    }
    function centerCY() {
      return centerY + centerDrag.y;
    }

    function wrapLines(text, maxW, font) {
      ctx.font = font;
      const words = text.split(/(\s+)/);
      const lines = [];
      let line = "";
      for (let w = 0; w < words.length; w++) {
        const test = line + words[w];
        if (ctx.measureText(test).width <= maxW || line === "") {
          line = test;
        } else {
          if (line.trim()) lines.push(line.trim());
          line = words[w].trim() ? words[w] : "";
        }
      }
      if (line.trim()) lines.push(line.trim());
      return lines.length ? lines : [text];
    }

    function draw() {
      if (!ctx) return;
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      ctx.fillStyle = "#fffbeb";
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.strokeStyle = "rgba(148, 163, 184, 0.35)";
      ctx.lineWidth = 0.6 / scale;
      for (let g = 0; g < CANVAS_W; g += 48) {
        ctx.beginPath();
        ctx.moveTo(g, 0);
        ctx.lineTo(g, CANVAS_H);
        ctx.stroke();
      }
      for (let g = 0; g < CANVAS_H; g += 48) {
        ctx.beginPath();
        ctx.moveTo(0, g);
        ctx.lineTo(CANVAS_W, g);
        ctx.stroke();
      }

      const cx = centerCX();
      const cy = centerCY();

      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 2.2 / scale;
      for (let node of branchNodes) {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(nodeCX(node), nodeCY(node));
        ctx.stroke();
      }

      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 1.2 / scale;
      ctx.strokeStyle = "#cbd5e1";
      for (let sub of subItemsNodes) {
        const mainNode = branchNodes[sub.categoryIdx];
        if (mainNode) {
          ctx.beginPath();
          ctx.moveTo(nodeCX(mainNode), nodeCY(mainNode));
          ctx.lineTo(nodeCX(sub), nodeCY(sub));
          ctx.stroke();
        }
      }
      ctx.setLineDash([]);

      for (let node of branchNodes) {
        const lx = nodeLeft(node);
        const ty = nodeTop(node);
        ctx.fillStyle = node.fill;
        ctx.beginPath();
        ctx.roundRect(lx, ty, node.w, node.h, 12);
        ctx.fill();
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 1.25 / scale;
        ctx.stroke();
        ctx.fillStyle = node.textColor;
        ctx.font = "bold 18px system-ui, Segoe UI, sans-serif";
        const tw = ctx.measureText(node.name).width;
        ctx.fillText(node.name, lx + node.w / 2 - tw / 2, ty + node.h / 2 + 6);
      }

      for (let sub of subItemsNodes) {
        const lx = nodeLeft(sub);
        const ty = nodeTop(sub);
        ctx.fillStyle = sub.fill;
        ctx.beginPath();
        ctx.roundRect(lx, ty, sub.w, sub.h, 10);
        ctx.fill();
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 1.1 / scale;
        ctx.stroke();
        ctx.fillStyle = sub.textColor;
        ctx.font = "15px system-ui, Segoe UI, sans-serif";
        const wrapFont = "15px system-ui, Segoe UI, sans-serif";
        const lines = wrapLines(sub.text, sub.w - 18, wrapFont);
        const lh = 18;
        let startY = ty + sub.h / 2 - ((lines.length - 1) * lh) / 2 + 5;
        lines.forEach(function (ln, idx) {
          ctx.font = wrapFont;
          const tw = ctx.measureText(ln).width;
          ctx.fillText(ln, lx + sub.w / 2 - tw / 2, startY + idx * lh);
        });
      }

      const r = 64;
      ctx.fillStyle = "#fecaca";
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#b91c1c";
      ctx.lineWidth = 2.5 / scale;
      ctx.stroke();
      ctx.fillStyle = "#7f1d1d";
      ctx.font = "bold 28px system-ui, Segoe UI, sans-serif";
      const twc = ctx.measureText(CENTER_TEXT).width;
      ctx.fillText(CENTER_TEXT, cx - twc / 2, cy + 9);

      ctx.restore();

      if (hoveredNode) {
        drawFloatingTooltip();
      } else {
        hideTooltipElement();
      }
    }

    function ensureTooltip() {
      if (!tooltipDiv) {
        tooltipDiv = document.createElement("div");
        tooltipDiv.id = "mindmapTooltip";
        tooltipDiv.style.cssText =
          "position:fixed;background:#ffffff;color:#0f172a;padding:10px 16px;border-radius:10px;font-size:15px;font-weight:600;pointer-events:none;z-index:10000;border:1px solid #cbd5e1;box-shadow:0 8px 24px rgba(15,23,42,0.12);max-width:300px;line-height:1.45;";
        document.body.appendChild(tooltipDiv);
      }
      return tooltipDiv;
    }

    function drawFloatingTooltip() {
      if (!hoveredNode) return;
      const tip = ensureTooltip();
      tip.textContent = hoveredNode.type === "branch" ? hoveredNode.name : hoveredNode.text;
      const rect = canvas.getBoundingClientRect();
      const screenX = rect.left + (hoveredNode.logicalX * scale + offsetX) * (rect.width / CANVAS_W);
      const screenY = rect.top + (hoveredNode.logicalY * scale + offsetY) * (rect.height / CANVAS_H);
      tip.style.left = Math.min(window.innerWidth - 300, screenX + 12) + "px";
      tip.style.top = Math.max(8, screenY - 36) + "px";
      tip.style.display = "block";
    }

    function hideTooltipElement() {
      if (tooltipDiv) tooltipDiv.style.display = "none";
    }

    function getMouseLogicalCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
      const mouseX = (clientX - rect.left) * (CANVAS_W / rect.width);
      const mouseY = (clientY - rect.top) * (CANVAS_H / rect.height);
      return {
        x: (mouseX - offsetX) / scale,
        y: (mouseY - offsetY) / scale
      };
    }

    function hitTest(x, y) {
      for (let i = subItemsNodes.length - 1; i >= 0; i--) {
        const sub = subItemsNodes[i];
        if (x >= nodeLeft(sub) && x <= nodeLeft(sub) + sub.w && y >= nodeTop(sub) && y <= nodeTop(sub) + sub.h) {
          return { kind: "sub", ref: sub };
        }
      }
      for (let node of branchNodes) {
        if (x >= nodeLeft(node) && x <= nodeLeft(node) + node.w && y >= nodeTop(node) && y <= nodeTop(node) + node.h) {
          return { kind: "branch", ref: node };
        }
      }
      const dx = x - centerCX();
      const dy = y - centerCY();
      if (dx * dx + dy * dy <= 68 * 68) {
        return { kind: "center", ref: centerDrag };
      }
      return null;
    }

    function updateHover(e) {
      const p = getMouseLogicalCoords(e);
      let found = null;
      for (let i = subItemsNodes.length - 1; i >= 0; i--) {
        const sub = subItemsNodes[i];
        if (p.x >= nodeLeft(sub) && p.x <= nodeLeft(sub) + sub.w && p.y >= nodeTop(sub) && p.y <= nodeTop(sub) + sub.h) {
          found = { type: "sub", text: sub.text, logicalX: nodeCX(sub), logicalY: nodeCY(sub) };
          break;
        }
      }
      if (!found) {
        for (let branch of branchNodes) {
          if (p.x >= nodeLeft(branch) && p.x <= nodeLeft(branch) + branch.w && p.y >= nodeTop(branch) && p.y <= nodeTop(branch) + branch.h) {
            found = { type: "branch", name: branch.name, logicalX: nodeCX(branch), logicalY: nodeCY(branch) };
            break;
          }
        }
      }
      if (found) {
        if (!hoveredNode || (hoveredNode.text !== found.text && hoveredNode.name !== found.name)) {
          hoveredNode = found;
          draw();
        }
      } else if (hoveredNode) {
        hoveredNode = null;
        hideTooltipElement();
        draw();
      }
    }

    function onPointerDown(e) {
      if (e.button != null && e.button !== 0) return;
      const p = getMouseLogicalCoords(e);
      const hit = hitTest(p.x, p.y);
      if (hit) {
        draggingNode = hit;
        dragLastLogicalX = p.x;
        dragLastLogicalY = p.y;
        isPanningCanvas = false;
        canvas.classList.add("cursor-move");
        hoveredNode = null;
        hideTooltipElement();
      } else {
        isPanningCanvas = true;
        draggingNode = null;
        panStartX = e.clientX !== undefined ? e.clientX : e.touches[0].clientX;
        panStartY = e.clientY !== undefined ? e.clientY : e.touches[0].clientY;
        canvas.classList.remove("cursor-move");
      }
      e.preventDefault();
    }

    function onPointerMove(e) {
      if (draggingNode) {
        const p = getMouseLogicalCoords(e);
        const ddx = p.x - dragLastLogicalX;
        const ddy = p.y - dragLastLogicalY;
        dragLastLogicalX = p.x;
        dragLastLogicalY = p.y;
        if (draggingNode.kind === "center") {
          centerDrag.x += ddx;
          centerDrag.y += ddy;
        } else {
          draggingNode.ref.dragX += ddx;
          draggingNode.ref.dragY += ddy;
        }
        draw();
        return;
      }
      if (isPanningCanvas) {
        const cx = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : panStartX);
        const cy = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : panStartY);
        offsetX += cx - panStartX;
        offsetY += cy - panStartY;
        panStartX = cx;
        panStartY = cy;
        draw();
        return;
      }
      updateHover(e);
    }

    function onPointerUp() {
      isPanningCanvas = false;
      draggingNode = null;
      canvas.classList.remove("cursor-move");
      canvas.style.cursor = "grab";
      draw();
    }

    function onWheel(e) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.08 : 0.08;
      const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + delta));
      if (newScale !== scale) {
        scale = newScale;
        document.getElementById("zoomLevel").textContent = Math.round(scale * 100) + "%";
        draw();
      }
    }

    function zoomIn() {
      scale = Math.min(MAX_SCALE, scale + 0.12);
      document.getElementById("zoomLevel").textContent = Math.round(scale * 100) + "%";
      draw();
    }
    function zoomOut() {
      scale = Math.max(MIN_SCALE, scale - 0.12);
      document.getElementById("zoomLevel").textContent = Math.round(scale * 100) + "%";
      draw();
    }
    function resetView() {
      scale = 1;
      offsetX = 0;
      offsetY = 0;
      document.getElementById("zoomLevel").textContent = "100%";
      draw();
    }

    function initEvents() {
      canvas.addEventListener("mousedown", onPointerDown);
      window.addEventListener("mousemove", onPointerMove);
      window.addEventListener("mouseup", onPointerUp);
      canvas.addEventListener("touchstart", onPointerDown, { passive: false });
      window.addEventListener("touchmove", onPointerMove, { passive: false });
      window.addEventListener("touchend", onPointerUp);
      canvas.addEventListener("wheel", onWheel, { passive: false });
      canvas.addEventListener("mouseleave", function () {
        isPanningCanvas = false;
        draggingNode = null;
        canvas.classList.remove("cursor-move");
        hoveredNode = null;
        hideTooltipElement();
        draw();
      });
      document.getElementById("zoomInBtn").addEventListener("click", zoomIn);
      document.getElementById("zoomOutBtn").addEventListener("click", zoomOut);
      document.getElementById("resetViewBtn").addEventListener("click", resetView);
    }

    computePositions();
    initEvents();
    draw();
    window.addEventListener("resize", function () {
      draw();
    });
  })();
</script>
</body>
</html>
