<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wall Colour Design</title>
  <style>
    :root {
      --bar: #25262b;
      --bar-border: #373a40;
      --main: #1e1f23;
      --ink: #e9ecef;
      --muted: #868e96;
      --accent: #4dabf7;
      --btn: #1a1b1e;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--main);
      line-height: 1.35;
    }
    body.tool-text .text-anno {
      cursor: text;
    }
    .tool-cluster {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid var(--bar-border);
      border-radius: 6px;
      overflow: hidden;
      vertical-align: middle;
    }
    .tool-cluster .ico-btn {
      border: none;
      border-radius: 0;
      min-width: 2.1rem;
    }
    .tool-cluster select {
      margin: 0;
      border: none;
      border-left: 1px solid var(--bar-border);
      border-radius: 0;
      min-width: 2.85rem;
      font: inherit;
      font-size: 0.78rem;
      padding: 0.22rem 0.35rem;
      background: var(--btn);
      color: var(--ink);
      align-self: stretch;
    }
    .bar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem 0.45rem;
      padding: 0.28rem 0.45rem;
      background: var(--bar);
      border-bottom: 1px solid var(--bar-border);
    }
    .bar-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-right: 0.25rem;
    }
    .ico-btn {
      font: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.1rem;
      min-height: 2.1rem;
      padding: 0.2rem 0.35rem;
      border-radius: 6px;
      border: 1px solid var(--bar-border);
      background: var(--btn);
      color: var(--ink);
      cursor: pointer;
      line-height: 1;
    }
    .ico-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .ico-btn[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 1px rgba(77, 171, 247, 0.35);
    }
    .ico-btn .e {
      font-size: 1.2rem;
      pointer-events: none;
    }
    .ico-btn .t-glyph {
      font-size: 1.05rem;
      font-weight: 900;
      font-family: system-ui, "Segoe UI", sans-serif;
      letter-spacing: -0.02em;
    }
    .ico-btn .sub {
      font-size: 0.65rem;
      opacity: 0.85;
      margin-left: 0.1rem;
    }
    .bar label {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
    .colour-universal {
      display: inline-flex;
      align-items: center;
    }
    .colour-universal input[type="color"] {
      width: 2rem;
      height: 1.75rem;
      padding: 0;
      border: 1px solid var(--bar-border);
      border-radius: 5px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .bar select {
      font: inherit;
      font-size: 0.78rem;
      padding: 0.22rem 0.35rem;
      border-radius: 5px;
      border: 1px solid var(--bar-border);
      background: var(--btn);
      color: var(--ink);
    }
    .seg {
      display: inline-flex;
      border-radius: 6px;
      border: 1px solid var(--bar-border);
      overflow: hidden;
    }
    .seg .ico-btn {
      border: none;
      border-radius: 0;
      min-width: 2.25rem;
    }
    .seg .ico-btn + .ico-btn {
      border-left: 1px solid var(--bar-border);
    }
    #main {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0.4rem;
      -webkit-overflow-scrolling: touch;
    }
    #stage {
      position: relative;
      display: inline-block;
      line-height: 0;
      vertical-align: top;
      max-width: 100%;
      max-height: calc(100dvh - 5.5rem);
      box-shadow: 0 4px 28px rgba(0, 0, 0, 0.45);
    }
    #stage canvas {
      display: block;
      max-width: 100%;
      max-height: calc(100dvh - 5.5rem);
      width: auto;
      height: auto;
      cursor: crosshair;
      touch-action: none;
    }
    #stage canvas.tool-fill {
      cursor: cell;
    }
    .text-layer {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }
    .text-layer.interactive {
      pointer-events: auto;
      touch-action: none;
    }
    .text-anno-wrap {
      position: absolute;
      box-sizing: border-box;
      min-width: 3rem;
      min-height: 1.5em;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      display: flex;
      flex-direction: column;
    }
    .text-anno-wrap:focus-within,
    .text-anno-wrap.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(77, 171, 247, 0.4);
    }
    .text-anno {
      flex: 1;
      min-height: 1.2em;
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
      border: none;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.4);
      outline: none;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 2px 4px;
      font-weight: 600;
      line-height: 1.35;
      color: #111;
      font-family: system-ui, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }
    .text-anno:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.65);
    }
    .text-handle {
      display: none;
      position: absolute;
      width: 11px;
      height: 11px;
      background: var(--accent);
      border: 1px solid #fff;
      border-radius: 2px;
      z-index: 5;
      box-sizing: border-box;
    }
    body.tool-text .text-anno-wrap:focus-within .text-handle {
      display: block;
    }
    .text-handle-tl {
      left: -6px;
      top: -6px;
      cursor: move;
    }
    .text-handle-br {
      right: -6px;
      bottom: -6px;
      cursor: nwse-resize;
    }
    .foot {
      flex-shrink: 0;
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.35rem 0.5rem;
      border-top: 1px solid var(--bar-border);
      background: var(--bar);
    }
    .foot a {
      color: var(--accent);
    }
    .warn {
      font-size: 0.75rem;
      color: #fcd34d;
      padding: 0.25rem 0.5rem;
      display: none;
      background: #422006;
    }
    .warn.show {
      display: block;
    }
  </style>
</head>
<body>
  <script>
    if (location.protocol === "file:")
      document.write('<script src="colouring-sheets-embed.js"><\/script>');
  </script>
  <header class="bar">
    <span class="bar-title">Wall Colour Design</span>
    <div class="seg" role="group" aria-label="Sheets">
      <button type="button" class="ico-btn is-on" id="pick-1" aria-pressed="true" aria-label="Sheet 1">
        <span class="e" aria-hidden="true">🖼️</span><span class="sub" aria-hidden="true">1</span>
      </button>
      <button type="button" class="ico-btn" id="pick-2" aria-pressed="false" aria-label="Sheet 2">
        <span class="e" aria-hidden="true">🖼️</span><span class="sub" aria-hidden="true">2</span>
      </button>
    </div>
    <label class="colour-universal" title="One colour for pencil, basket, and text">
      <input type="color" id="colour" value="#ff6b6b" aria-label="Colour for pencil, basket, and text" />
    </label>
    <button type="button" class="ico-btn" id="tool-fill" aria-pressed="false" aria-label="Fill in blanks">
      <span class="e" aria-hidden="true">🧺</span>
    </button>
    <div class="tool-cluster" role="group" aria-label="Draw">
      <button type="button" class="ico-btn" id="tool-pen" aria-pressed="true" aria-label="Draw">
        <span class="e" aria-hidden="true">✏️</span>
      </button>
      <select id="brush" aria-label="Line width">
        <option value="2">2</option>
        <option value="4" selected>4</option>
        <option value="8">8</option>
        <option value="16">16</option>
        <option value="28">28</option>
      </select>
    </div>
    <div class="tool-cluster" role="group" aria-label="Type on sheet">
      <button type="button" class="ico-btn" id="tool-text" aria-pressed="false" aria-label="Type on sheet">
        <span class="e t-glyph" aria-hidden="true">T</span>
      </button>
      <select id="text-size" aria-label="Type size">
        <option value="14">14</option>
        <option value="18" selected>18</option>
        <option value="24">24</option>
        <option value="32">32</option>
        <option value="40">40</option>
      </select>
    </div>
    <button type="button" class="ico-btn" id="undo" aria-label="Undo">
      <span class="e" aria-hidden="true">↩️</span>
    </button>
    <button type="button" class="ico-btn" id="save" aria-label="Save as JPG">
      <span class="e" aria-hidden="true">💾</span>
    </button>
  </header>

  <p id="cors-warn" class="warn" role="alert"></p>

  <main id="main">
    <div id="stage">
      <canvas id="c" width="800" height="600"></canvas>
      <div id="textLayer" class="text-layer" aria-hidden="true"></div>
    </div>
  </main>

  <footer class="foot">
    Email JPG to <a href="mailto:bhslsk@bethel.edu.hk">bhslsk@bethel.edu.hk</a> — subject:
    <strong>[name] + [class] + [Wall Colour Design]</strong>
  </footer>

  <script>
    (function () {
      var IMAGES = { 1: "c01.jpg", 2: "c02.jpg" };

      function getSheetSrc(key) {
        if (location.protocol === "file:") {
          if (window.COLOURING_SHEETS && window.COLOURING_SHEETS[key]) {
            return window.COLOURING_SHEETS[key];
          }
          return "";
        }
        return IMAGES[key];
      }
      var MAX_UNDO = 200;

      var canvas = document.getElementById("c");
      var textLayer = document.getElementById("textLayer");
      var ctx = canvas.getContext("2d", { willReadFrequently: true });
      var colourInput = document.getElementById("colour");
      var brushSelect = document.getElementById("brush");
      var btnPen = document.getElementById("tool-pen");
      var btnFill = document.getElementById("tool-fill");
      var btnText = document.getElementById("tool-text");
      var textSizeSelect = document.getElementById("text-size");
      var btnSave = document.getElementById("save");
      var btnUndo = document.getElementById("undo");
      var pick1 = document.getElementById("pick-1");
      var pick2 = document.getElementById("pick-2");
      var corsWarn = document.getElementById("cors-warn");

      var tool = "pen";
      var drawing = false;
      var last = null;
      var penStroked = false;
      var currentKey = 1;
      var baseImg = new Image();
      var fillTolerance = 56;
      var restoring = false;
      var penPointerId = null;

      /** @type {{ id: string, nx: number, ny: number, nw: number, nh?: number | null, content: string, fontSize: number, color: string }[]} */
      var textAnnos = [];
      /** @type {{ dataUrl: string | null, texts: object[] }[]} */
      var history = [];

      var MAX_EDGE = 1600;

      function hex6(hex) {
        return typeof hex === "string" && /^#[0-9a-fA-F]{6}$/i.test(hex) ? hex : "#111111";
      }

      function hexToRgb(hex) {
        var h = hex6(hex).slice(1);
        return {
          r: parseInt(h.slice(0, 2), 16),
          g: parseInt(h.slice(2, 4), 16),
          b: parseInt(h.slice(4, 6), 16)
        };
      }

      function plainTextFromEditable(el) {
        return (el.innerText || "").replace(/\r\n/g, "\n");
      }

      function cloneTexts() {
        return textAnnos.map(function (t) {
          return {
            id: t.id,
            nx: t.nx,
            ny: t.ny,
            nw: t.nw,
            nh: t.nh != null && Number.isFinite(t.nh) ? t.nh : null,
            content: t.content,
            fontSize: t.fontSize,
            color: t.color
          };
        });
      }

      function captureState() {
        var dataUrl = null;
        try {
          dataUrl = canvas.toDataURL("image/png");
        } catch (err) {
          /* tainted canvas (e.g. file:// + raw jpg without embed) */
        }
        return { dataUrl: dataUrl, texts: cloneTexts() };
      }

      function restoreState(s) {
        if (!s) return;
        restoring = true;
        if (s.dataUrl) {
          var img = new Image();
          img.onload = function () {
            if (img.naturalWidth && img.naturalHeight) {
              canvas.width = img.naturalWidth;
              canvas.height = img.naturalHeight;
            }
            ctx.drawImage(img, 0, 0);
            textAnnos = (s.texts || []).map(function (t) {
              return Object.assign({}, t);
            });
            renderTextAnnos();
            restoring = false;
          };
          img.onerror = function () {
            restoring = false;
          };
          img.src = s.dataUrl;
        } else {
          textAnnos = (s.texts || []).map(function (t) {
            return Object.assign({}, t);
          });
          renderTextAnnos();
          restoring = false;
        }
      }

      function resetHistory() {
        history.length = 0;
        var st = captureState();
        history.push(st);
        if (!st.dataUrl) {
          corsWarn.textContent =
            "Canvas is locked by the browser (opened from disk without embed). Keep colouring-sheets-embed.js next to this page, or open the folder with a local server.";
          corsWarn.classList.add("show");
        } else {
          corsWarn.classList.remove("show");
          corsWarn.textContent = "";
        }
      }

      function pushHistory() {
        if (restoring) return;
        var st = captureState();
        history.push(st);
        while (history.length > MAX_UNDO) {
          history.shift();
        }
      }

      function undoOnce() {
        if (restoring || history.length <= 1) return;
        history.pop();
        restoreState(history[history.length - 1]);
      }

      function deselectAllText() {
        textLayer.querySelectorAll(".text-anno-wrap.selected").forEach(function (w) {
          w.classList.remove("selected");
        });
      }

      /** Pencil, basket, and T all read from `#colour`; this keeps every text box in sync. */
      function syncUniversalColourToAllText() {
        var col = hex6(colourInput.value);
        textAnnos.forEach(function (te) {
          te.color = col;
        });
        textLayer.querySelectorAll(".text-anno").forEach(function (el) {
          el.style.color = col;
        });
      }

      function applyFontSizeToSelected() {
        var fs = parseInt(textSizeSelect.value, 10) || 18;
        textLayer.querySelectorAll(".text-anno-wrap.selected .text-anno").forEach(function (el) {
          el.style.fontSize = fs + "px";
          var wrap = el.closest(".text-anno-wrap");
          var id = wrap && wrap.dataset.id;
          var te = id && textAnnos.find(function (x) { return x.id === id; });
          if (te) te.fontSize = fs;
        });
      }

      colourInput.addEventListener("input", syncUniversalColourToAllText);
      colourInput.addEventListener("change", syncUniversalColourToAllText);
      textSizeSelect.addEventListener("change", applyFontSizeToSelected);

      function refreshTextEditability() {
        textLayer.querySelectorAll(".text-anno").forEach(function (el) {
          el.contentEditable = tool === "text" ? "true" : "false";
        });
      }

      function setTool(t) {
        tool = t;
        document.body.classList.toggle("tool-text", t === "text");
        btnPen.setAttribute("aria-pressed", t === "pen" ? "true" : "false");
        btnFill.setAttribute("aria-pressed", t === "fill" ? "true" : "false");
        btnText.setAttribute("aria-pressed", t === "text" ? "true" : "false");
        canvas.classList.toggle("tool-fill", t === "fill");
        textLayer.classList.toggle("interactive", t === "text");
        textLayer.setAttribute("aria-hidden", t === "text" ? "false" : "true");
        refreshTextEditability();
      }

      btnPen.addEventListener("click", function () { setTool("pen"); });
      btnFill.addEventListener("click", function () { setTool("fill"); });
      btnText.addEventListener("click", function () { setTool("text"); });
      btnUndo.addEventListener("click", undoOnce);

      document.addEventListener("keydown", function (e) {
        var ae = document.activeElement;
        if (ae && (ae.closest && ae.closest(".text-anno")) && ae.isContentEditable) return;
        if (ae && (ae.tagName === "INPUT" || ae.tagName === "SELECT" || ae.tagName === "TEXTAREA")) return;
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === "z" || e.key === "Z")) {
          e.preventDefault();
          undoOnce();
        }
      });

      function clearTextLayerDom() {
        textLayer.innerHTML = "";
      }

      function renderTextAnnos() {
        clearTextLayerDom();
        var lw =
          textLayer.clientWidth ||
          parseFloat(textLayer.style.width) ||
          canvas.getBoundingClientRect().width ||
          1;
        var lh =
          textLayer.clientHeight ||
          parseFloat(textLayer.style.height) ||
          canvas.getBoundingClientRect().height ||
          1;
        textAnnos.forEach(function (t) {
          var wrap = document.createElement("div");
          wrap.className = "text-anno-wrap";
          wrap.dataset.id = t.id;
          wrap.style.left = t.nx * 100 + "%";
          wrap.style.top = t.ny * 100 + "%";
          wrap.style.width = t.nw * 100 + "%";
          if (t.nh != null && Number.isFinite(t.nh)) wrap.style.height = t.nh * 100 + "%";

          var hTL = document.createElement("div");
          hTL.className = "text-handle text-handle-tl";
          hTL.title = "Move (text mode)";
          var hBR = document.createElement("div");
          hBR.className = "text-handle text-handle-br";
          hBR.title = "Resize (text mode)";

          var el = document.createElement("div");
          el.className = "text-anno";
          el.contentEditable = tool === "text" ? "true" : "false";
          el.textContent = t.content || "";
          el.style.fontSize = (t.fontSize || 18) + "px";
          el.style.color = hex6(t.color || "#111111");
          el.style.lineHeight = "1.35";

          el.addEventListener("input", function () {
            var te = textAnnos.find(function (x) { return x.id === t.id; });
            if (te) te.content = plainTextFromEditable(el);
          });
          el.addEventListener("blur", function () {
            setTimeout(function () {
              if (!wrap.isConnected) return;
              var teBlur = textAnnos.find(function (x) { return x.id === t.id; });
              if (plainTextFromEditable(el).trim() === "") {
                var i = textAnnos.findIndex(function (x) { return x.id === t.id; });
                if (i >= 0) textAnnos.splice(i, 1);
                wrap.remove();
                pushHistory();
                return;
              }
              if (!teBlur) return;
              teBlur.content = plainTextFromEditable(el);
              if (teBlur.nw) wrap.style.width = teBlur.nw * 100 + "%";
              else wrap.style.removeProperty("width");
              if (teBlur.nh != null && Number.isFinite(teBlur.nh))
                wrap.style.height = teBlur.nh * 100 + "%";
              else wrap.style.removeProperty("height");
              pushHistory();
            }, 0);
          });
          el.addEventListener("focusin", function () {
            deselectAllText();
            wrap.classList.add("selected");
          });
          el.addEventListener("focus", function () {
            if (tool !== "text") return;
            var te = textAnnos.find(function (x) { return x.id === t.id; });
            if (te) {
              textSizeSelect.value = String(te.fontSize || 18);
              var col = hex6(colourInput.value);
              te.color = col;
              el.style.color = col;
            }
          });

          wrap.addEventListener("dblclick", function (e) {
            if (e.target.closest(".text-handle")) return;
            e.stopPropagation();
            e.preventDefault();
            deselectAllText();
            wrap.classList.add("selected");
            setTool("text");
            requestAnimationFrame(function () {
              el.focus();
            });
          });

          hTL.addEventListener("pointerdown", function (e) {
            if (tool !== "text") return;
            e.stopPropagation();
            e.preventDefault();
            var te = textAnnos.find(function (x) { return x.id === t.id; });
            var pid = e.pointerId;
            try {
              hTL.setPointerCapture(pid);
            } catch (err) {}
            var startX = e.clientX;
            var startY = e.clientY;
            var startLeft = wrap.offsetLeft;
            var startTop = wrap.offsetTop;
            function move(ev) {
              if (ev.pointerId !== pid) return;
              wrap.style.left = startLeft + (ev.clientX - startX) + "px";
              wrap.style.top = startTop + (ev.clientY - startY) + "px";
            }
            function up(ev) {
              if (ev.pointerId !== pid) return;
              try {
                hTL.releasePointerCapture(pid);
              } catch (err2) {}
              hTL.removeEventListener("pointermove", move);
              hTL.removeEventListener("pointerup", up);
              hTL.removeEventListener("pointercancel", up);
              if (!te) return;
              te.nx = wrap.offsetLeft / lw;
              te.ny = wrap.offsetTop / lh;
              wrap.style.left = te.nx * 100 + "%";
              wrap.style.top = te.ny * 100 + "%";
              pushHistory();
            }
            hTL.addEventListener("pointermove", move);
            hTL.addEventListener("pointerup", up);
            hTL.addEventListener("pointercancel", up);
          });

          hBR.addEventListener("pointerdown", function (e) {
            if (tool !== "text") return;
            e.stopPropagation();
            e.preventDefault();
            var te = textAnnos.find(function (x) { return x.id === t.id; });
            var pid = e.pointerId;
            try {
              hBR.setPointerCapture(pid);
            } catch (err) {}
            var startX = e.clientX;
            var startY = e.clientY;
            var startW = wrap.offsetWidth;
            var startH = wrap.offsetHeight;
            function move(ev) {
              if (ev.pointerId !== pid) return;
              wrap.style.width = Math.max(48, startW + ev.clientX - startX) + "px";
              wrap.style.height = Math.max(36, startH + ev.clientY - startY) + "px";
            }
            function up(ev) {
              if (ev.pointerId !== pid) return;
              try {
                hBR.releasePointerCapture(pid);
              } catch (err2) {}
              hBR.removeEventListener("pointermove", move);
              hBR.removeEventListener("pointerup", up);
              hBR.removeEventListener("pointercancel", up);
              if (!te) return;
              te.nw = wrap.offsetWidth / lw;
              te.nh = wrap.offsetHeight / lh;
              wrap.style.width = te.nw * 100 + "%";
              wrap.style.height = te.nh * 100 + "%";
              pushHistory();
            }
            hBR.addEventListener("pointermove", move);
            hBR.addEventListener("pointerup", up);
            hBR.addEventListener("pointercancel", up);
          });

          wrap.appendChild(hTL);
          wrap.appendChild(hBR);
          wrap.appendChild(el);
          textLayer.appendChild(wrap);
        });
        refreshTextEditability();
      }

      function normFromTextLayer(clientX, clientY) {
        var r = textLayer.getBoundingClientRect();
        if (r.width < 1 || r.height < 1) return { nx: 0, ny: 0 };
        return {
          nx: (clientX - r.left) / r.width,
          ny: (clientY - r.top) / r.height
        };
      }

      function addTextAnnoAt(clientX, clientY) {
        var p = normFromTextLayer(clientX, clientY);
        if (p.nx < 0 || p.ny < 0 || p.nx > 1 || p.ny > 1) return;
        var id = "t" + Date.now();
        var fs = parseInt(textSizeSelect.value, 10) || 18;
        textAnnos.push({
          id: id,
          nx: p.nx,
          ny: p.ny,
          nw: 0.28,
          content: "",
          fontSize: fs,
          color: hex6(colourInput.value)
        });
        renderTextAnnos();
        pushHistory();
        var wrap = textLayer.querySelector('.text-anno-wrap[data-id="' + id + '"]');
        var added = wrap && wrap.querySelector(".text-anno");
        if (added) {
          deselectAllText();
          wrap.classList.add("selected");
          added.focus();
          var sel = window.getSelection();
          var range = document.createRange();
          range.selectNodeContents(added);
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }

      textLayer.addEventListener("mousedown", function (e) {
        if (e.target === textLayer) deselectAllText();
      });

      textLayer.addEventListener("pointerup", function (e) {
        if (tool !== "text") return;
        if (e.target.closest(".text-anno-wrap")) return;
        if (e.pointerType === "mouse" && e.button !== 0) return;
        e.preventDefault();
        addTextAnnoAt(e.clientX, e.clientY);
      });

      function drawBase() {
        if (!baseImg.complete || !baseImg.naturalWidth) return;
        var nw = baseImg.naturalWidth;
        var nh = baseImg.naturalHeight;
        var scale = Math.min(1, MAX_EDGE / nw, MAX_EDGE / nh);
        var w = Math.round(nw * scale);
        var h = Math.round(nh * scale);
        canvas.width = w;
        canvas.height = h;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(baseImg, 0, 0, w, h);
        requestAnimationFrame(function () {
          renderTextAnnos();
          resetHistory();
        });
      }

      function loadImage(key) {
        corsWarn.classList.remove("show");
        corsWarn.textContent = "";
        currentKey = key;
        textAnnos = [];
        clearTextLayerDom();
        pick1.classList.toggle("is-on", key === 1);
        pick2.classList.toggle("is-on", key === 2);
        pick1.setAttribute("aria-pressed", key === 1 ? "true" : "false");
        pick2.setAttribute("aria-pressed", key === 2 ? "true" : "false");
        try {
          baseImg.removeAttribute("crossorigin");
        } catch (e) {}
        var src = getSheetSrc(key);
        if (!src) {
          corsWarn.textContent =
            "Missing colouring-sheets-embed.js next to this page (needed when opening from disk). In the temp folder run: node build-colouring-embed.mjs";
          corsWarn.classList.add("show");
          return;
        }
        baseImg.onload = function () {
          drawBase();
        };
        baseImg.onerror = function () {
          corsWarn.textContent =
            "Could not load sheet " +
            key +
            (location.protocol === "file:" ? " (embed)." : " (c0" + key + ".jpg).");
          corsWarn.classList.add("show");
        };
        baseImg.src = src;
      }

      pick1.addEventListener("click", function () { loadImage(1); });
      pick2.addEventListener("click", function () { loadImage(2); });

      function canvasCoords(clientX, clientY) {
        var rect = canvas.getBoundingClientRect();
        var sx = canvas.width / rect.width;
        var sy = canvas.height / rect.height;
        return {
          x: Math.floor((clientX - rect.left) * sx),
          y: Math.floor((clientY - rect.top) * sy)
        };
      }

      function line(a, b) {
        var c = hexToRgb(colourInput.value);
        ctx.strokeStyle = "rgb(" + c.r + "," + c.g + "," + c.b + ")";
        ctx.lineWidth = parseInt(brushSelect.value, 10) || 4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function stampDot(pt) {
        var c = hexToRgb(colourInput.value);
        var lw = parseInt(brushSelect.value, 10) || 4;
        var r = Math.max(1.5, lw / 2);
        ctx.fillStyle = "rgb(" + c.r + "," + c.g + "," + c.b + ")";
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      function penPointerDown(ev) {
        if (tool !== "pen") return;
        if (ev.button !== 0 && ev.pointerType === "mouse") return;
        try {
          canvas.setPointerCapture(ev.pointerId);
        } catch (err) {}
        penPointerId = ev.pointerId;
        drawing = true;
        penStroked = false;
        last = canvasCoords(ev.clientX, ev.clientY);
      }

      function penPointerMove(ev) {
        if (!drawing || penPointerId !== ev.pointerId) return;
        var p = canvasCoords(ev.clientX, ev.clientY);
        line(last, p);
        last = p;
        penStroked = true;
      }

      function penPointerUp(ev) {
        if (penPointerId !== ev.pointerId) return;
        try {
          canvas.releasePointerCapture(ev.pointerId);
        } catch (err) {}
        penPointerId = null;
        if (drawing && !penStroked && last) {
          stampDot(last);
          penStroked = true;
        }
        if (drawing && penStroked) {
          pushHistory();
        }
        drawing = false;
        penStroked = false;
        last = null;
      }

      canvas.addEventListener("pointerdown", penPointerDown);
      canvas.addEventListener("pointermove", penPointerMove);
      function canvasPointerUp(ev) {
        if (tool === "fill") {
          if (ev.pointerType === "mouse" && ev.button !== 0) return;
          var p = canvasCoords(ev.clientX, ev.clientY);
          floodFill(p.x, p.y);
          pushHistory();
          return;
        }
        penPointerUp(ev);
      }

      canvas.addEventListener("pointerup", canvasPointerUp);
      canvas.addEventListener("pointercancel", penPointerUp);

      function matchTolerance(r1, g1, b1, a1, r2, g2, b2, a2, tol) {
        return (
          Math.abs(r1 - r2) <= tol &&
          Math.abs(g1 - g2) <= tol &&
          Math.abs(b1 - b2) <= tol &&
          Math.abs(a1 - a2) <= tol
        );
      }

      function floodFill(sx, sy) {
        var w = canvas.width;
        var h = canvas.height;
        if (sx < 0 || sy < 0 || sx >= w || sy >= h) return;
        var img;
        try {
          img = ctx.getImageData(0, 0, w, h);
        } catch (err) {
          corsWarn.textContent =
            "Fill needs a clean canvas (browser blocked reading pixels). Use colouring-sheets-embed.js with file://, or open this folder over http://.";
          corsWarn.classList.add("show");
          return;
        }
        var d = img.data;
        var tol = fillTolerance;
        var i0 = (sy * w + sx) * 4;
        var sr = d[i0],
          sg = d[i0 + 1],
          sb = d[i0 + 2],
          sa = d[i0 + 3];
        var fill = hexToRgb(colourInput.value);
        var fr = fill.r,
          fg = fill.g,
          fb = fill.b,
          fa = 255;
        if (matchTolerance(sr, sg, sb, sa, fr, fg, fb, fa, 0)) return;

        var stack = [[sx, sy]];
        var seen = new Uint8Array(w * h);
        function key(x, y) {
          return y * w + x;
        }

        while (stack.length) {
          var cur = stack.pop();
          var x = cur[0],
            y = cur[1];
          var k = key(x, y);
          if (x < 0 || y < 0 || x >= w || y >= h || seen[k]) continue;
          seen[k] = 1;
          var i = k * 4;
          if (!matchTolerance(d[i], d[i + 1], d[i + 2], d[i + 3], sr, sg, sb, sa, tol)) continue;
          d[i] = fr;
          d[i + 1] = fg;
          d[i + 2] = fb;
          d[i + 3] = fa;
          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
        ctx.putImageData(img, 0, 0);
      }

      function flattenTextOntoContext(destCtx, cw, ch) {
        var cr = canvas.getBoundingClientRect();
        if (cr.width < 1 || cr.height < 1) return;
        var scaleX = cw / cr.width;
        var scaleY = ch / cr.height;
        textAnnos.forEach(function (te) {
          var raw = (te.content || "").replace(/\r\n/g, "\n").trim();
          if (!raw) return;
          var lines = raw.split("\n");
          var fs = (te.fontSize || 18) * scaleX;
          var rgb = hexToRgb(te.color || "#111111");
          destCtx.fillStyle = "rgb(" + rgb.r + "," + rgb.g + "," + rgb.b + ")";
          destCtx.font =
            "600 " +
            fs +
            'px system-ui, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif';
          destCtx.textBaseline = "top";
          destCtx.textAlign = "left";
          var padX = 5 * scaleX;
          var padY = 3 * scaleY;
          var x = te.nx * cw + padX;
          var y = te.ny * ch + padY;
          var lh = Math.round((te.fontSize || 18) * 1.35 * scaleY);
          lines.forEach(function (line, i) {
            destCtx.fillText(line, x, y + i * lh);
          });
        });
      }

      btnSave.addEventListener("click", function () {
        corsWarn.classList.remove("show");
        try {
          var out = document.createElement("canvas");
          out.width = canvas.width;
          out.height = canvas.height;
          var octx = out.getContext("2d");
          octx.drawImage(canvas, 0, 0);
          flattenTextOntoContext(octx, out.width, out.height);
          out.toBlob(
            function (blob) {
              if (!blob) {
                corsWarn.textContent =
                  "Could not create the JPG. Check that c01.jpg and c02.jpg are next to this file.";
                corsWarn.classList.add("show");
                return;
              }
              var a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = "colouring-sheet-" + String(currentKey) + ".jpg";
              a.click();
              URL.revokeObjectURL(a.href);
            },
            "image/jpeg",
            0.92
          );
        } catch (err) {
          corsWarn.textContent =
            "Export failed in this browser. Try another browser or keep the HTML and JPGs in the same folder.";
          corsWarn.classList.add("show");
        }
      });

      loadImage(1);
    })();
  </script>
</body>
</html>
