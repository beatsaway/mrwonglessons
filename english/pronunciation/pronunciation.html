<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connected speech — pronunciation tips</title>
  <link rel="stylesheet" href="pronunciation.css" />
</head>
<body data-ui-lang="en">
  <header class="lesson-top">
    <div class="lesson-top-inner">
      <a class="lesson-home" href="index.html" aria-label="Back to pronunciation hub"><span class="lesson-home-emoji" aria-hidden="true">🏠</span></a>
      <label class="ui-en" for="tip-select" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Choose tip</label>
      <select class="tip-select" id="tip-select" aria-label="Choose pronunciation tip"></select>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" id="lang-en" aria-pressed="true">Eng</button>
        <button type="button" id="lang-zh" aria-pressed="false">中</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="tabs" role="tablist" aria-label="Read or practice">
      <button type="button" role="tab" id="tab-read" aria-controls="panel-read" aria-selected="true"><span class="ui-en">Read</span><span class="ui-zh">課文</span></button>
      <button type="button" role="tab" id="tab-fill" aria-controls="panel-fill" aria-selected="false"><span class="ui-en">Practice</span><span class="ui-zh">練習</span></button>
    </div>
    <div class="tab-panel" id="panel-fill" role="tabpanel" aria-labelledby="tab-fill" hidden>
      <div class="fill-examples" id="fill-examples"></div>
      <h3 class="match-heading"><span class="ui-en">Keywords</span><span class="ui-zh">關鍵字</span></h3>
      <ol class="match-list" id="kw-list"></ol>
      <h3 class="match-heading"><span class="ui-en">Match what you hear</span><span class="ui-zh">連讀</span></h3>
      <ol class="match-list" id="phrase-list"></ol>
      <div class="fill-bottom-spacer" aria-hidden="true"><br /><br /><br /><br /><br /></div>
    </div>
    <div class="tab-panel" id="panel-read" role="tabpanel" aria-labelledby="tab-read"></div>
  </main>
  <dialog class="discuss-dialog" id="discuss-success-dialog" aria-labelledby="discuss-dlg-banner">
    <p class="dlg-banner" id="discuss-dlg-banner"><span class="ui-en">All 7 correct on this page. Try one discussion question.</span><span class="ui-zh">本頁 7 格全數正確。歡迎完成討論一題。</span></p>
    <section class="discuss" aria-labelledby="discuss-title">
      <h2 class="section" id="discuss-title"><span class="ui-en">Discussion</span><span class="ui-zh">討論</span></h2>
      <p id="discussion-text"></p>
      <p class="form-p" id="discussion-form-line">
        <a id="discussion-google-form" href="#" target="_blank" rel="noopener noreferrer"><span class="ui-en">Open Google Form</span><span class="ui-zh">開啟 Google 表單</span></a>
      </p>
    </section>
    <div class="dlg-footer">
      <button type="button" id="discuss-dialog-close"><span class="ui-en">Close</span><span class="ui-zh">關閉</span></button>
    </div>
  </dialog>
  <script src="lang-toggle.js"></script>
  <script src="tips/tip0.js"></script>
  <script src="tips/tip1.js"></script>
  <script src="tips/tip2.js"></script>
  <script src="tips/tip3.js"></script>
  <script src="tips/tip4.js"></script>
  <script src="tips/tip5.js"></script>
  <script src="tips/tip6.js"></script>
  <script src="tips/tip7.js"></script>
  <script src="pronunciation-app.js"></script>
</body>
</html>
