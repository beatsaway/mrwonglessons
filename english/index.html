<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, "Segoe UI", sans-serif;
      font-size: 1rem;
      line-height: 1.55;
      color: #111;
      background: #fff;
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.4rem 1rem;
      border-bottom: 1px solid #e8e8e8;
    }
    header a.home {
      display: grid;
      place-items: center;
      width: 1.75rem;
      height: 1.75rem;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      text-decoration: none;
      font-size: 1.05rem;
      line-height: 1;
    }
    header a.home:hover { background: #f5f5f5; }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    main {
      max-width: 28rem;
      margin: 0 auto;
      padding: 1.25rem 1rem 2rem;
    }
    p.intro {
      margin: 0 0 1rem;
      color: #666;
      font-size: 0.95rem;
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      overflow: hidden;
    }
    li { border-top: 1px solid #e8e8e8; }
    li:first-child { border-top: none; }
    li a {
      display: block;
      padding: 0.75rem 1rem;
      color: #111;
      text-decoration: none;
      font-weight: 600;
    }
    li a:hover { background: #f8f8f8; }
    li a span {
      display: block;
      margin-top: 0.15rem;
      font-weight: 400;
      font-size: 0.88rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <a class="home" href="../index.html" aria-label="Back to lessons">🏠</a>
    <h1>English</h1>
  </header>
  <main>
    <p class="intro">Choose a section.</p>
    <ul>
      <li>
        <a href="pronunciation/index.html">
          Pronunciation
          <span>Connected speech and pronunciation lessons</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
