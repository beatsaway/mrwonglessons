<!DOCTYPE html>
<html lang="en" data-lesson-locale="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Arts Foundations | Lessons</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #4a4a4a;
      --accent: #2c5282;
      --border: #e8e8e8;
      --card: #ffffff;
      --core: #1a365d;
      --section: #ffffff;
      --bar-h: 3.35rem;
      --lesson-tab-font: 1.02rem;
      --lesson-tabstrip-font: 0.78rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 1.02rem;
      line-height: 1.5;
    }
    .app-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem 0.75rem;
      min-height: var(--bar-h);
      padding: 0.4rem 1rem;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .app-brand {
      flex: 0 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
      line-height: 1.2;
      padding-right: 0.25rem;
    }
    .app-brand-title {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--core);
      white-space: nowrap;
    }
    .app-brand-tag {
      font-size: 0.72rem;
      color: var(--muted);
      max-width: 14rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 40rem) {
      .app-brand-tag { display: none; }
    }
    .app-bar select {
      width: min(20rem, 100%);
      max-width: 22rem;
      padding: 0.35rem 0.5rem;
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card);
      color: var(--text);
    }
    .lesson-header {
      flex: 1 1 12rem;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
      line-height: 1.25;
    }
    .lesson-header-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--core);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lesson-header-meta {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Full-width lesson: no max-width + no auto margins (those caused huge side gutters on wide screens). */
    .wrap {
      max-width: none;
      width: 100%;
      margin: 0;
      padding: 0.12rem max(0.35rem, env(safe-area-inset-left)) 0.5rem
        max(0.35rem, env(safe-area-inset-right));
      box-sizing: border-box;
    }
    .lesson-split {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .lesson-work {
      min-width: 0;
      margin: 0;
      padding: 0;
    }
    .lesson-work p {
      margin: 0 0 0.28rem;
    }
    .lesson-work p:last-child {
      margin-bottom: 0;
    }
    .lesson-split .lesson-hero {
      margin-bottom: 0;
    }
    @media (min-width: 52rem) {
      .wrap {
        padding-left: max(0.4rem, env(safe-area-inset-left));
        padding-right: max(0.4rem, env(safe-area-inset-right));
      }
      .lesson-split {
        display: grid;
        grid-template-columns: minmax(0, 70%) minmax(0, 30%);
        gap: 0.65rem 0.85rem;
        align-items: start;
      }
      .lesson-split .lesson-hero {
        position: sticky;
        top: var(--bar-h);
        align-self: start;
      }
    }
    .tab-intro {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .lesson-tabstrip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem;
      margin: 0;
      padding: 0.1rem 0;
      position: sticky;
      top: var(--bar-h);
      z-index: 15;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    @media (min-width: 52rem) {
      .lesson-split .lesson-tabstrip {
        margin-top: 0;
      }
    }
    .subtab {
      font: inherit;
      font-size: var(--lesson-tabstrip-font);
      font-weight: 600;
      padding: 0.2rem 0.35rem;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      line-height: 1.3;
    }
    .subtab:hover {
      color: var(--text);
    }
    .subtab.is-active,
    .subtab[aria-selected="true"] {
      background: transparent;
      border-bottom-color: var(--accent);
      color: var(--accent);
    }
    .lesson-tab-panels {
      min-height: 10rem;
      line-height: 1.42;
      font-size: var(--lesson-tab-font);
    }
    .lesson-work .lesson-tab-panels {
      margin-top: 0.4rem;
      margin-bottom: 0.25rem;
      padding-left: 0;
      padding-right: 0;
    }
    .lesson-work .lesson-tab-panels .vocab-chip,
    .lesson-work .lesson-tab-panels .vocab-zh,
    .lesson-work .lesson-tab-panels .observe-simple li,
    .lesson-work .lesson-tab-panels .observe-reveal,
    .lesson-work .lesson-tab-panels .observe-ans,
    .lesson-work .lesson-tab-panels .word-chip,
    .lesson-work .lesson-tab-panels .drop-slot,
    .lesson-work .lesson-tab-panels .studio-compact,
    .lesson-work .lesson-tab-panels .studio-advice-line,
    .lesson-work .lesson-tab-panels .studio-sub li,
    .lesson-work .lesson-tab-panels .match-select,
    .lesson-work .lesson-tab-panels .match-result,
    .lesson-work .lesson-tab-panels .tight-discuss li {
      font-size: inherit;
    }
    .tab-panel {
      padding-bottom: 0.12rem;
    }
    .tab-panel[hidden] {
      display: none !important;
    }
    .tab-panel:not([hidden]) {
      display: block;
    }
    .tab-panel .tab-inner-h {
      margin-top: 0;
    }
    h2.lesson-num {
      margin: 0 0 0.75rem;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.35rem 0.75rem;
    }
    .lesson-head { margin-bottom: 0.5rem; }
    .badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }
    .map {
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 500;
      width: 100%;
      margin-top: 0.15rem;
    }
    h3.block {
      margin: 1.15rem 0 0.5rem;
      padding: 0.35rem 0;
      background: transparent;
      border-radius: 0;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--core);
    }
    h3.interactive-label {
      border-left: none;
      padding-left: 0;
    }
    /* Trim: % inset — top, right, bottom, left on .ref-img img. */
    .ref-img {
      margin: 0 0 0.15rem;
      text-align: left;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--card);
      overflow: hidden;
    }
    .ref-img img {
      --ref-img-crop-top: 7%;
      --ref-img-crop-right: 3.5%;
      --ref-img-crop-bottom: 11%;
      --ref-img-crop-left: 3.5%;
      display: block;
      max-width: 100%;
      height: auto;
      clip-path: inset(
        var(--ref-img-crop-top) var(--ref-img-crop-right) var(--ref-img-crop-bottom) var(--ref-img-crop-left) round 6px
      );
      -webkit-clip-path: inset(
        var(--ref-img-crop-top) var(--ref-img-crop-right) var(--ref-img-crop-bottom) var(--ref-img-crop-left) round 6px
      );
    }
    @media (max-width: 28rem) {
      .ref-img img {
        --ref-img-crop-top: 5%;
        --ref-img-crop-right: 2.5%;
        --ref-img-crop-bottom: 11%;
        --ref-img-crop-left: 2.5%;
      }
    }
    .ref-img figcaption {
      margin-top: 0.15rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .vocab-bank {
      margin: 0.5rem 0 0.75rem;
      padding: 0.35rem 0;
      background: transparent;
      border: none;
      border-radius: 0;
      font-size: 0.95rem;
    }
    .vocab-bank strong { color: var(--core); }
    ul.tight { margin: 0.25rem 0 0.5rem; padding-left: 1.25rem; }
    ul.tight li { margin-bottom: 0.28rem; }
    .check-list {
      margin: 0.5rem 0 0.75rem;
      padding-left: 1.25rem;
    }
    .check-list li { margin-bottom: 0.5rem; }
    .hint {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0 0 0.65rem;
    }
    .match-wrap {
      margin: 0.35rem 0 0.5rem;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
    }
    .lesson-work .match-wrap {
      margin: 0.15rem 0 0.35rem;
      padding: 0;
    }
    .match-wrap--compact {
      padding: 0.25rem 0.3rem !important;
      margin: 0.1rem 0 0.25rem !important;
    }
    .match-wrap--compact .match-row {
      padding: 0.22rem 0 !important;
      gap: 0.22rem !important;
    }
    .match-wrap--compact .match-desc {
      font-size: 0.86rem !important;
      line-height: 1.38 !important;
    }
    .match-wrap--compact .match-select {
      padding: 0.22rem 0.35rem !important;
      font-size: inherit !important;
    }
    .match-row {
      display: grid;
      grid-template-columns: 1fr minmax(10rem, 12rem) 1.5rem;
      gap: 0.35rem 0.55rem;
      align-items: start;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
    }
    .match-row:last-child { border-bottom: none; }
    .lesson-work .match-row {
      grid-template-columns: 1fr;
      gap: 0.3rem;
      padding: 0.3rem 0;
    }
    .lesson-work .match-desc {
      font-size: 0.9rem;
      line-height: 1.45;
      max-width: 100%;
    }
    .lesson-work .match-select {
      width: 100%;
      max-width: 100%;
    }
    @media (max-width: 36rem) {
      .match-row {
        grid-template-columns: 1fr;
      }
    }
    .match-desc { font-size: 0.95rem; }
    .match-select {
      width: 100%;
      padding: 0.35rem 0.4rem;
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card);
    }
    .match-select.input-ok { border-color: #38a169; background: var(--card); }
    .match-select.input-wrong { border-color: #c53030; background: var(--card); }
    .match-result { font-weight: 700; }
    .match-result.ok { color: #276749; }
    .match-result.bad { color: #c53030; }
    .lesson-work .tab-panel .match-row {
      display: grid;
      grid-template-columns: 1fr minmax(7.5rem, 9rem) auto;
      gap: 0.35rem 0.5rem;
      align-items: start;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
    }
    .lesson-work .tab-panel .match-row:last-child {
      border-bottom: none;
    }
    @media (max-width: 36rem) {
      .lesson-work .tab-panel .match-row {
        grid-template-columns: 1fr;
      }
    }
    .fill-wrap {
      margin: 0.35rem 0 0.5rem;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
    }
    .fill-line {
      margin: 0 0 0.55rem;
      line-height: 1.75;
    }
    .fill-input {
      display: inline-block;
      vertical-align: baseline;
      min-width: 4.5em;
      max-width: 10em;
      margin: 0 0.15rem;
      padding: 0.15rem 0.35rem;
      font: inherit;
      border: none;
      border-bottom: 2px solid var(--accent);
      background: transparent;
      border-radius: 0;
    }
    .fill-input:focus {
      outline: none;
      border-bottom-color: var(--core);
      background: transparent;
    }
    .fill-input.input-ok { border-bottom-color: #38a169; }
    .fill-input.input-wrong { border-bottom-color: #c53030; }
    .fill-answerline { font-size: 0.9rem; margin: -0.4rem 0 0.75rem; }
    .fill-answerline .muted { color: var(--muted); }
    .fill-error { color: #c53030; font-size: 0.9rem; }
    .btn {
      padding: 0.4rem 0.85rem;
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 4px;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn-ghost {
      background: var(--card);
      color: var(--accent);
    }
    .btn-sm {
      padding: 0.28rem 0.55rem;
      font-size: 0.82rem;
    }
    p { margin: 0 0 0.45rem; }
    .lesson-hero {
      margin: 0;
    }
    .lesson-hero .ref-img {
      margin: 0;
      text-align: left;
      border: none;
      background: transparent;
    }
    .vocab-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 0.45rem;
      align-items: baseline;
      line-height: 1.35;
    }
    .vocab-chip {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0;
      max-width: 100%;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      padding: 0.1rem 0.32rem;
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card);
      color: var(--core);
      cursor: pointer;
    }
    .vocab-chip .vocab-en {
      display: inline;
    }
    .vocab-chip .vocab-zh {
      font-weight: 500;
      color: var(--muted);
    }
    /* Default: hide Cantonese until the chip is activated (HTML uses hidden; this beats any display:inline) */
    .vocab-chip .vocab-zh[hidden] {
      display: none !important;
    }
    .vocab-chip[aria-expanded="true"] .vocab-zh {
      display: inline !important;
    }
    .vocab-chip:hover,
    .vocab-chip:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .vocab-chip[aria-expanded="true"] {
      background: rgba(44, 82, 130, 0.06);
    }
    .vocab-wiki-footer {
      margin: 0.65rem 0 0;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.86rem;
      line-height: 1.45;
      color: var(--muted);
    }
    .vocab-wiki-link {
      color: var(--accent);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .vocab-wiki-link:hover {
      color: var(--core);
    }
    .vocab-chip--text {
      cursor: default;
      border-style: solid;
    }
    .vocab-zh {
      font-size: 0.86rem;
      color: var(--muted);
    }
    .observe-simple {
      margin: 0.15rem 0 0.35rem;
      padding-left: 1.2rem;
    }
    .observe-simple li {
      margin-bottom: 0.35rem;
      line-height: 1.45;
      font-size: 0.88rem;
    }
    .observe-qtext {
      display: inline;
    }
    .observe-reveal {
      font: inherit;
      font-size: 0.78rem;
      padding: 0.05rem 0.35rem;
      margin-left: 0.15rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card);
      color: var(--accent);
      cursor: pointer;
      vertical-align: baseline;
    }
    .observe-ans {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--core);
    }
    .vocab-grid {
      display: grid;
      gap: 0.35rem;
      grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr));
    }
    .vocab-card {
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      padding: 0.35rem 0;
    }
    .vocab-term {
      font: inherit;
      font-weight: 600;
      width: 100%;
      text-align: left;
      padding: 0.28rem 0.35rem;
      margin: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--core);
      cursor: pointer;
    }
    .vocab-term:hover,
    .vocab-term:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .vocab-term[aria-expanded="true"] {
      background: rgba(44, 82, 130, 0.06);
    }
    .vocab-tip {
      margin-top: 0.3rem;
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.4;
    }
    .observe-details {
      margin: 0 0 0.35rem;
      padding: 0.35rem 0;
      border: none;
      border-radius: 0;
      background: transparent;
    }
    .observe-details summary {
      font-weight: 600;
      cursor: pointer;
      color: var(--core);
    }
    .observe-q {
      margin: 0.3rem 0 0.25rem;
    }
    .observe-scaffold {
      margin: 0;
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .word-bank-label {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--core);
      margin: 0 0 0.3rem;
    }
    .fill-wrap-dd .word-bank-label {
      margin-top: 0.65rem;
      margin-bottom: 0.35rem;
    }
    .word-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      min-height: 2.35rem;
      padding: 0.35rem 0;
      margin: 0 0 0.55rem;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      align-content: flex-start;
    }
    .word-pool--bare {
      border: none;
      background: transparent;
      padding: 0.15rem 0;
      margin: 0 0 0.4rem;
      min-height: 0;
    }
    .blanks-panel {
      margin: 0;
      padding: 0;
    }
    .blanks-actions {
      margin: 0.35rem 0 0 !important;
    }
    .fill-dd-block--compact {
      margin-bottom: 0.35rem;
    }
    .word-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.45rem;
      font: inherit;
      font-size: 0.84rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      cursor: grab;
      user-select: none;
    }
    .word-chip:active {
      cursor: grabbing;
    }
    .word-chip--selected {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    .fill-line-dd {
      margin: 0 0 0.55rem;
      line-height: 1.75;
    }
    .drop-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      min-width: 4.9em;
      min-height: 1.95em;
      margin: 0 0.08rem;
      padding: 0.06rem 0.2rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card);
      color: var(--core);
      font-weight: 600;
    }
    .drop-slot--ok {
      border-color: #38a169;
      background: var(--card);
    }
    .drop-slot--bad {
      border-color: #c53030;
      background: var(--card);
    }
    .fill-wrap-dd {
      padding-top: 0.15rem;
    }
    .studio-task-heading {
      margin-bottom: 0.35rem !important;
    }
    .studio-sub {
      margin: 0 0 0.4rem;
      font-size: 0.92rem;
    }
    .studio-sub strong {
      color: var(--core);
    }
    .studio-sub ul {
      margin: 0.22rem 0 0;
      padding-left: 1.15rem;
    }
    .studio-task {
      margin: 0.45rem 0 0;
      padding: 0.35rem 0.4rem;
      border-left: 2px solid var(--accent);
      background: transparent;
      border-radius: 0;
    }
    .studio-compact {
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .studio-task-line {
      margin: 0 0 0.45rem !important;
    }
    .studio-task-goal {
      margin: 0 0 0.35rem !important;
    }
    .studio-task-concept {
      margin: 0.15rem 0 0.35rem !important;
      font-size: 0.95em;
      color: var(--muted);
      line-height: 1.45;
    }
    .studio-task-steps-label {
      margin: 0.35rem 0 0.2rem !important;
    }
    .studio-task-intro {
      margin: 0 0 0.25rem !important;
      font-size: 0.95em;
      color: var(--muted);
    }
    .studio-steps {
      margin: 0 0 0.45rem !important;
      padding-left: 1.15rem;
    }
    .studio-steps li {
      margin: 0.18rem 0;
    }
    .studio-advice-line {
      margin: 0 !important;
      padding: 0.35rem 0;
      background: transparent;
      border-radius: 0;
      font-size: 0.88rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
