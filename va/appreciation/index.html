<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKDSE VA Appreciation Guide</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #1d4ed8;
      --brand-soft: #e8efff;
      --nav-w: 270px;
      --langbar-h: 38px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.65;
    }

    .lang-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: var(--langbar-h);
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0 10px;
    }
    .lang-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .home-link {
      border: 1px solid var(--line);
      background: #fff;
      color: #374151;
      border-radius: 999px;
      font-size: 14px;
      padding: 3px 9px;
      text-decoration: none;
      line-height: 1.2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .home-link:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }
    .lang-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: #374151;
      border-radius: 999px;
      font-size: 12px;
      padding: 3px 10px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
      font-weight: 600;
    }

    .mobile-bar {
      display: none;
      position: sticky;
      top: var(--langbar-h);
      z-index: 35;
      background: #fff;
      border-bottom: 1px solid var(--line);
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
    }
    .menu-btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 14px;
    }

    aside {
      position: fixed;
      top: var(--langbar-h);
      left: 0;
      bottom: 0;
      width: var(--nav-w);
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 14px 10px;
      overflow: auto;
      z-index: 30;
    }
    aside h1 {
      margin: 4px 8px 8px;
      font-size: 16px;
      line-height: 1.3;
    }
    aside p {
      margin: 0 8px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    nav {
      display: grid;
      gap: 5px;
    }
    nav button {
      text-align: left;
      border: 0;
      background: transparent;
      color: #374151;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      cursor: pointer;
    }
    nav button:hover { background: #f3f4f6; }
    nav button.active {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 700;
    }
    /* Control panel category colors (match tag colors) */
    nav button[data-target="revision"] {
      background: #ccfbf1;
      color: #115e59;
      border-left: 3px solid #14b8a6;
    }
    nav button[data-target="elements"] {
      background: #dbeafe;
      color: #1e40af;
      border-left: 3px solid #3b82f6;
    }
    nav button[data-target="principles"] {
      background: #fef3c7;
      color: #92400e;
      border-left: 3px solid #f59e0b;
    }
    nav button[data-target="revision"]:hover,
    nav button[data-target="elements"]:hover,
    nav button[data-target="principles"]:hover {
      filter: brightness(0.98);
    }

    main {
      margin-left: var(--nav-w);
      padding: 18px;
      max-width: 980px;
    }
    .panel {
      display: none;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .panel.active { display: block; }
    h2 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.3;
    }
    h3 { margin: 14px 0 6px; font-size: 18px; }
    p { margin: 0 0 10px; }
    ul { margin: 8px 0 0 20px; padding: 0; }
    li { margin: 5px 0; }
    .hint { color: var(--muted); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .chips span {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f9fafb;
      font-size: 13px;
      padding: 3px 9px;
    }
    .example .chips span.tag-desc {
      background: #ccfbf1;
      color: #115e59;
      border-color: #99f6e4;
      font-weight: 600;
    }
    .example .chips span.tag-elements {
      background: #dbeafe;
      color: #1e40af;
      border-color: #bfdbfe;
      font-weight: 600;
    }
    .example .chips span.tag-principles {
      background: #fef3c7;
      color: #92400e;
      border-color: #fde68a;
      font-weight: 600;
    }
    .example .chips span.tag-other {
      background: #f3f4f6;
      color: #4b5563;
      border-color: #e5e7eb;
    }
    /* Past paper demo: smaller tags for denser reading */
    #past-paper-demo-root .example .chips {
      gap: 6px;
      margin-top: 6px;
    }
    #past-paper-demo-root .example .chips span {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
    }
    #past-paper-demo-root .pastpaper-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
      margin: 10px 0 12px;
    }
    #past-paper-demo-root .pastpaper-figure.is-wide {
      grid-column: span 2;
    }
    #past-paper-demo-root .example.pastpaper-answer {
      border: 0;
      background: transparent;
      border-radius: 0;
      padding: 0;
      margin: 0;
    }
    #past-paper-demo-root .pastpaper-figure {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }
    #past-paper-demo-root .pastpaper-figure img {
      width: 100%;
      height: auto;
      display: block;
      background: #f8fafc;
    }
    #past-paper-demo-root .pastpaper-figure figcaption {
      font-size: 12px;
      color: var(--muted);
      padding: 6px 8px;
    }
    #past-paper-demo-root .pp-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 6px 0 8px;
    }
    #past-paper-demo-root .pp-keyword {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      border-radius: 999px;
      font-size: 12px;
      padding: 3px 8px;
      cursor: pointer;
    }
    #past-paper-demo-root .pp-keyword.selected {
      border-color: #2563eb;
      background: #dbeafe;
      color: #1e3a8a;
    }
    #past-paper-demo-root .pp-keyword.used {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #past-paper-demo-root .pp-blank-wrap {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      gap: 3px;
      margin: 0 2px;
    }
    #past-paper-demo-root .pp-blank-icon {
      font-size: 0.9em;
      line-height: 1;
      opacity: 0.9;
    }
    #past-paper-demo-root .pp-blank {
      display: inline-flex;
      min-width: 82px;
      min-height: 30px;
      padding: 2px 6px;
      margin: 0;
      border: 2px solid #cbd5e1;
      border-radius: 5px;
      background: #ffffff;
      color: #111827;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1.25;
      position: relative;
      top: 1px;
    }
    #past-paper-demo-root .pp-blank.is-filled {
      background: #dcfce7;
      color: #14532d;
      border-color: #16a34a;
    }
    #past-paper-demo-root .pp-blank.is-wrong {
      background: #fee2e2;
      color: #991b1b;
      border-color: #ef4444;
    }
    #past-paper-demo-root .pp-blank.is-revealed {
      background: #fef9c3;
      color: #854d0e;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 11px;
      background: #fff;
    }
    .template {
      border: 1px solid #dbe5ff;
      background: #f8faff;
      border-radius: 10px;
      padding: 10px 12px;
      margin: 8px 0;
      white-space: pre-line;
    }
    .helper {
      border: 1px solid #dbe5ff;
      background: #f8faff;
      border-radius: 10px;
      padding: 10px 12px;
      margin: 8px 0 12px;
    }
    .helper .hint { margin-bottom: 6px; }
    .daj-grid {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }
    .daj-step {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fafafa;
    }
    .daj-step-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .daj-step-num {
      flex-shrink: 0;
      width: 1.35rem;
      height: 1.35rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
    }
    .daj-step-title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }
    .daj-step-tip {
      margin: 0 0 5px 1.55rem;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }
    .daj-qs {
      margin: 0 0 0 1.55rem;
      padding-left: 1rem;
      font-size: 12.5px;
      line-height: 1.42;
    }
    .daj-qs li { margin: 2px 0; }
    .daj-step .helper {
      margin: 6px 0 0;
      padding: 5px 7px;
      border-radius: 6px;
    }
    .daj-step .chips { gap: 4px; margin-top: 0; }
    .daj-step .chips .kw {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      border: 0;
    }
    .example {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 12px;
      margin: 10px 0;
    }
    .example h3 {
      margin: 0 0 6px;
      font-size: 17px;
    }
    .example p {
      margin: 6px 0;
      font-size: 14px;
    }
    .kw {
      padding: 0 4px;
      border-radius: 5px;
      font-weight: 600;
    }
    .kw-d { background: #e0f2fe; color: #075985; }
    .kw-a { background: #ede9fe; color: #5b21b6; }
    .kw-i { background: #ecfccb; color: #3f6212; }
    .kw-j { background: #ffe4e6; color: #9f1239; }
    .kw-sd { background: #ccfbf1; color: #115e59; }
    .kw-se { background: #dbeafe; color: #1e40af; }
    .kw-sp { background: #fef3c7; color: #92400e; }

    .overlay {
      display: none;
      position: fixed;
      inset: var(--langbar-h) 0 0 0;
      background: rgba(15, 23, 42, 0.35);
      z-index: 25;
    }

    @media (max-width: 860px) {
      .mobile-bar { display: flex; }
      aside {
        top: calc(var(--langbar-h) + 45px);
        transform: translateX(-102%);
        transition: transform 0.2s ease;
      }
      body.menu-open aside { transform: translateX(0); }
      body.menu-open .overlay { display: block; }
      main { margin-left: 0; padding: 12px; }
      h2 { font-size: 22px; }
      #past-paper-demo-root .pastpaper-figure.is-wide {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <header class="lang-bar">
    <a class="home-link" href="../../index.html" aria-label="Home"><span aria-hidden="true">🏠</span></a>
    <div class="lang-actions">
      <button class="lang-btn active" id="btnEn" type="button">English</button>
      <button class="lang-btn" id="btnZh" type="button">中文</button>
    </div>
  </header>

  <header class="mobile-bar">
    <button class="menu-btn" id="menuBtn" type="button">☰ <span id="menuText">Sections</span></button>
    <strong id="mobileTitle">HKDSE VA Appreciation Guide</strong>
  </header>

  <aside>
    <h1 id="sidebarTitle">HKDSE VA Appreciation Guide</h1>
    <p id="sidebarSub">Paper 1 / Paper 2A (10%)</p>
    <nav id="sectionNav" aria-label="Sections"></nav>
  </aside>

  <main id="content"></main>
  <div class="overlay" id="overlay"></div>

  <script src="./hkdse-va-wordlists.js"></script>
  <script src="./hkdse-va-pastpaper-demo.js"></script>
  <script>
    const WORDLISTS = window.HKDSE_VA_WORDLISTS || {};
    const PAST_PAPER_DEMO = window.HKDSE_VA_PAST_PAPER_DEMO || { en: { options: [] }, zh: { options: [] } };

    const sectionIds = ["steps", "template", "examples", "pastpaper", "revision", "elements", "principles"];
    let currentLang = "en";
    let currentSection = "steps";
    let currentPastPaperId = "2024A_Q1";

    const EXAMPLES_HTML_EN = `
      <h2>Mock DSE Format: Model Answers</h2>
      <p class="hint">These models follow DSE command words: <strong>analyze + compare + interpret + evaluate</strong>. Each step includes concept tags.</p>

      <article class="example">
        <h3>Q1: Compare style features of Figure 1 and Figure 2, then interpret and evaluate their meanings.</h3>
        <p><strong>Reference artworks:</strong> Vincent van Gogh, <em>The Starry Night</em> (1889) vs Claude Monet, <em>Impression, Sunrise</em> (1872).</p>
        <p><strong>Description:</strong> Both are <strong>2D paintings</strong> with landscape imagery, but Figure 1 shows a more ordered <strong>composition</strong>, while Figure 2 appears more spontaneous.</p>
        <p><span class="chips"><span>media</span><span>subject matter</span><span>composition</span><span>comparison</span></span></p>
        <p><strong>Analysis:</strong> Figure 1 uses controlled <strong>line</strong> and restrained <strong>color</strong>; Figure 2 uses visible <strong>texture</strong>, stronger <strong>contrast</strong>, and faster visual <strong>rhythm</strong>. Their different <strong>unity/variety</strong> balance defines style difference.</p>
        <p><span class="chips"><span>line</span><span>color</span><span>texture</span><span>contrast</span><span>rhythm</span><span>unity/variety</span></span></p>
        <p><strong>Interpretation:</strong> Figure 1 suggests <strong>reflection</strong> and <strong>order</strong>; Figure 2 suggests <strong>emotional immediacy</strong> and <strong>instability</strong>.</p>
        <p><span class="chips"><span>mood</span><span>symbolic reading</span><span>artist intention</span></span></p>
        <p><strong>Judgement:</strong> Both works are <strong>successful</strong>: Figure 1 is formally <strong>coherent</strong>, while Figure 2 is more emotionally <strong>direct</strong> and <strong>memorable</strong>.</p>
        <p><span class="chips"><span>effectiveness</span><span>coherence</span><span>comparative evaluation</span></span></p>
      </article>

      <article class="example">
        <h3>Q2: Compare space representation of Figure 3 and Figure 4, then interpret and evaluate their meanings.</h3>
        <p><strong>Reference artworks:</strong> Leonardo da Vinci, <em>The Last Supper</em> (1495-1498) vs Pablo Picasso, <em>Les Demoiselles d'Avignon</em> (1907).</p>
        <p><strong>Description:</strong> Figure 3 creates depth through <strong>one-point perspective</strong>; Figure 4 compresses depth and emphasizes the surface plane.</p>
        <p><span class="chips"><span>space</span><span>viewpoint</span><span>comparison</span></span></p>
        <p><strong>Analysis:</strong> Figure 3 uses <strong>overlap</strong>, <strong>value gradation</strong>, and directional perspective lines. Figure 4 uses fractured <strong>shape</strong>, compressed <strong>space</strong>, and repeated motifs to create planar tension.</p>
        <p><span class="chips"><span>space</span><span>value</span><span>shape</span><span>perspective</span><span>pattern</span></span></p>
        <p><strong>Interpretation:</strong> Figure 3 supports <strong>narrative order</strong>; Figure 4 challenges <strong>stable perception</strong> and emphasizes <strong>psychological space</strong>.</p>
        <p><span class="chips"><span>meaning</span><span>psychological reading</span><span>viewer impact</span></span></p>
        <p><strong>Judgement:</strong> Figure 3 is stronger in <strong>spatial realism</strong>; Figure 4 is stronger in <strong>conceptual innovation</strong> and <strong>modern expression</strong>.</p>
        <p><span class="chips"><span>criteria-based judgement</span><span>innovation</span><span>strength comparison</span></span></p>
      </article>

      <article class="example">
        <h3>Q3: Compare human figure representation in Figure 5 and Figure 6, then interpret and evaluate meanings.</h3>
        <p><strong>Reference artworks:</strong> Frida Kahlo, <em>Self-Portrait with Thorn Necklace and Hummingbird</em> (1940) vs Pablo Picasso, <em>Weeping Woman</em> (1937).</p>
        <p><strong>Description:</strong> Both works focus on <strong>human figure subject matter</strong>; Figure 5 keeps recognizable anatomy, while Figure 6 deliberately distorts it.</p>
        <p><span class="chips"><span>subject matter</span><span>form treatment</span><span>comparison</span></span></p>
        <p><strong>Analysis:</strong> Figure 5 models <strong>form</strong> with subtle <strong>value</strong> and detailed <strong>texture</strong>; Figure 6 intensifies emotion with angular <strong>line</strong>, exaggerated <strong>shape</strong>, and strong <strong>emphasis</strong>.</p>
        <p><span class="chips"><span>form</span><span>value</span><span>texture</span><span>line</span><span>shape</span><span>emphasis</span></span></p>
        <p><strong>Interpretation:</strong> Figure 5 suggests <strong>personal identity</strong> and <strong>resilience</strong>; Figure 6 externalizes <strong>grief</strong> and <strong>social trauma</strong>.</p>
        <p><span class="chips"><span>identity</span><span>emotion</span><span>social context</span></span></p>
        <p><strong>Judgement:</strong> Figure 5 is <strong>persuasive</strong> in psychological realism, while Figure 6 is stronger in <strong>expressive force</strong>; both communicate <strong>effectively</strong>.</p>
        <p><span class="chips"><span>persuasiveness</span><span>impact</span><span>comparative evaluation</span></span></p>
      </article>

      <article class="example">
        <h3>Q4: Compare artistic expression in Figure 7 and Figure 8, then interpret and evaluate meanings.</h3>
        <p><strong>Reference artworks:</strong> Henri Matisse, <em>The Dance</em> (1910) vs Wassily Kandinsky, <em>Composition VIII</em> (1923).</p>
        <p><strong>Description:</strong> Both are modernist works, but Figure 7 is simplified figurative expression, while Figure 8 is geometry-based abstraction.</p>
        <p><span class="chips"><span>style</span><span>subject handling</span><span>comparison</span></span></p>
        <p><strong>Analysis:</strong> Figure 7 uses limited <strong>color</strong>, circular <strong>movement</strong>, and clear <strong>balance</strong>; Figure 8 uses intersecting <strong>lines</strong>, repeated <strong>shapes</strong>, and strong <strong>contrast</strong> to build analytic rhythm.</p>
        <p><span class="chips"><span>color</span><span>movement</span><span>balance</span><span>line</span><span>shape</span><span>contrast</span></span></p>
        <p><strong>Interpretation:</strong> Figure 7 can be read as <strong>collective vitality</strong>; Figure 8 can be read as <strong>rational order</strong> and <strong>modern abstraction</strong> of thought.</p>
        <p><span class="chips"><span>symbolic meaning</span><span>abstraction</span><span>conceptual reading</span></span></p>
        <p><strong>Judgement:</strong> Figure 7 is emotionally <strong>accessible</strong>; Figure 8 is intellectually <strong>rigorous</strong>. Each is <strong>successful</strong> in a different expressive mode.</p>
        <p><span class="chips"><span>accessibility</span><span>rigor</span><span>mode-specific success</span></span></p>
      </article>

      <article class="example">
        <h3>Q5: Compare artistic expression in Figure 9 and Figure 10, then interpret and evaluate meanings.</h3>
        <p><strong>Reference artworks:</strong> Lui Shou-kwan, <em>Zen Painting series</em> vs Wucius Wong, <em>In Search of Mountains</em> series.</p>
        <p><strong>Description:</strong> Both works engage Chinese cultural language, but Figure 9 is meditative and ink-oriented, while Figure 10 is design-structured and layered.</p>
        <p><span class="chips"><span>media language</span><span>style orientation</span><span>comparison</span></span></p>
        <p><strong>Analysis:</strong> Figure 9 relies on restrained <strong>value</strong>, open <strong>space</strong>, and simplified <strong>form</strong>; Figure 10 emphasizes denser <strong>pattern</strong>, controlled <strong>proportion</strong>, and stronger compositional <strong>rhythm</strong>.</p>
        <p><span class="chips"><span>value</span><span>space</span><span>form</span><span>pattern</span><span>proportion</span><span>rhythm</span></span></p>
        <p><strong>Interpretation:</strong> Together they construct two dimensions of "Hong Kong feeling": <strong>spiritual inwardness</strong> and <strong>urban-visual complexity</strong>.</p>
        <p><span class="chips"><span>cultural identity</span><span>duality</span><span>meaning synthesis</span></span></p>
        <p><strong>Judgement:</strong> The stronger exam response links <strong>formal evidence</strong> to <strong>layered cultural meaning</strong> consistently across both works.</p>
        <p><span class="chips"><span>evidence-based judgement</span><span>consistency</span><span>exam relevance</span></span></p>
      </article>
    `;

    const EXAMPLES_HTML_ZH = `
      <h2>模擬 DSE 題型：示範答案</h2>
      <p class="hint">以下示範對應 DSE 指令語：<strong>分析＋比較＋詮釋＋評價</strong>。每一步附上概念標籤。</p>

      <article class="example">
        <h3>第1題：分析及比較圖1與圖2的風格特色，並詮釋及評價其意義。</h3>
        <p><strong>參考作品：</strong>Vincent van Gogh《The Starry Night》(1889) vs Claude Monet《Impression, Sunrise》(1872)。</p>

                  <li>兩幅 plate 有什麼<strong>相同</strong>之處？</li>
                  <li>plate (a) 和 plate (b) 有什麼<strong>明顯不同</strong>？</li>
                </ol>
                <div class="helper"><div class="chips" data-wordlist-step="description"></div></div>
              </section>
              <section class="daj-step">
                <div class="daj-step-head"><span class="daj-step-num">2</span><p class="daj-step-title">Analysis</p></div>
                <p class="daj-step-tip">用元素 + 原理解釋畫面如何組織，以及造成什麼視覺效果。</p>
                <ol class="daj-qs">
                  <li>指出一個<strong>元素</strong>（色彩、空間、形狀、形體、線條、質感、明暗）。</li>
                  <li>指出一個<strong>原理</strong>（動勢、對比、統一、變化、平衡、重點、比例、圖案、重複）。</li>
                  <li>造成什麼<strong>效果</strong>？（寧靜、緊張、擁擠、戲劇感、和諧等）</li>
                  <li>在 plate (a)，藝術家運用 ___ 去 ___ — 用畫面細節填寫。</li>
                  <li>在 plate (b)，這方面如何<strong>不同</strong>？</li>
                </ol>
                <div class="helper"><div class="chips" data-wordlist-step="analysis"></div></div>
              </section>
              <section class="daj-step">
                <div class="daj-step-head"><span class="daj-step-num">3</span><p class="daj-step-title">Interpretation</p></div>
                <p class="daj-step-tip">推測藝術家想傳達什麼 — 必須連回你看到的證據。</p>
                <ol class="daj-qs">
                  <li>每幅 plate 給你什麼<strong>情緒</strong>或感覺？</li>
                  <li>藝術家可能想<strong>表達</strong>什麼？</li>
                  <li>某個物件或意象可能<strong>象徵</strong>什麼？</li>
                  <li>連回證據：「這可從 ___ 看出。」</li>
                  <li>能否提到<strong>社會或文化</strong>角度（身份、傳統、改變、權力…）？</li>
                </ol>
                <div class="helper"><div class="chips" data-wordlist-step="interpretation"></div></div>
              </section>
              <section class="daj-step">
                <div class="daj-step-head"><span class="daj-step-num">4</span><p class="daj-step-title">Judgement</p></div>
                <p class="daj-step-tip">判斷是否成功、你較喜歡哪一幅 — 要寫理由，不只寫「我喜歡」。</p>
                <ol class="daj-qs">
                  <li>plate (a) 是否<strong>成功</strong>？寫一個理由。</li>
                  <li>plate (b) 是否成功？寫一個理由。</li>
                  <li>你較<strong>喜歡</strong>哪一幅？</li>
                  <li>哪一個<strong>視覺選擇</strong>最有說服力？</li>
                  <li>用一句話：哪一幅<strong>整體較強</strong>，為什麼？</li>
                </ol>
                <div class="helper"><div class="chips" data-wordlist-step="judgement"></div></div>
              </section>
            </div>
          `,
          template: `
            <h2>可直接套用的答題模板</h2>
            <p class="hint"><strong>建議篇幅比例：</strong>Description <strong>25-30%</strong>、Analysis <strong>35-40%</strong>、Interpretation <strong>20-25%</strong>、Judgement <strong>10-15%</strong>。</p>
            <div class="template"><strong>Description</strong>
The commonalities of plate (a) and plate (b) is that both are ______.
In plate (a), I can see ______.
In plate (b), there is / there are ______.
Both artworks present ______ in different ways.
A key visual feature in both works is ______.</div>
            <div class="template"><strong>Analysis</strong>
In plate (a), the artist uses ______ to show ______.
In plate (b), the artist uses ______, creating a ______ feeling.
The contrast between ______ and ______ strengthens ______.
This arrangement creates a sense of ______ through ______.</div>
            <div class="template"><strong>Interpretation</strong>
In plate (a), I think the artist wants to show ______.
In plate (b), I think the artist wants to show ______.
_____ may symbolize ______ in the social/cultural context.
The ______ mood suggests ideas of ______ and ______, hinted by ______.</div>
            <div class="template"><strong>Judgement</strong>
I think plate (a) is a success because ______.
I think plate (b) is / is not successful because ______.
I like plate (__) more because ______.
Overall, the stronger work is plate (__) because ______.
The most convincing visual decision is ______.</div>
          `,
          examples: EXAMPLES_HTML_ZH
          ,
          pastpaper: `<div id="past-paper-demo-root"></div>`
        }
      }
    };

    const navEl = document.getElementById("sectionNav");
    const contentEl = document.getElementById("content");
    const sidebarTitle = document.getElementById("sidebarTitle");
    const sidebarSub = document.getElementById("sidebarSub");
    const mobileTitle = document.getElementById("mobileTitle");
    const menuText = document.getElementById("menuText");
    const btnEn = document.getElementById("btnEn");
    const btnZh = document.getElementById("btnZh");
    const menuBtn = document.getElementById("menuBtn");
    const overlay = document.getElementById("overlay");

    function renderNav() {
      navEl.innerHTML = sectionIds.map((id) => {
        const active = id === currentSection ? "active" : "";
        return `<button class="${active}" data-target="${id}">${i18n[currentLang].nav[id]}</button>`;
      }).join("");
    }

    function renderContent() {
      contentEl.innerHTML = sectionIds.map((id) => {
        const active = id === currentSection ? "active" : "";
        return `<section id="${id}" class="panel ${active}">${i18n[currentLang].sections[id]}</section>`;
      }).join("");
    }

    function renderShellText() {
      document.title = i18n[currentLang].pageTitle;
      sidebarTitle.textContent = i18n[currentLang].pageTitle;
      sidebarSub.textContent = i18n[currentLang].subtitle;
      sidebarSub.style.display = i18n[currentLang].subtitle ? "block" : "none";
      mobileTitle.textContent = i18n[currentLang].pageTitle;
      menuText.textContent = i18n[currentLang].menuLabel;
      document.documentElement.lang = currentLang === "zh" ? "zh-Hant" : "en";
      btnEn.classList.toggle("active", currentLang === "en");
      btnZh.classList.toggle("active", currentLang === "zh");
    }

    function renderPastPaperDemo() {
      const slot = contentEl.querySelector("#past-paper-demo-root");
      if (!slot) return;
      const demoPack = currentLang === "zh" ? PAST_PAPER_DEMO.zh : PAST_PAPER_DEMO.en;
      const options = Array.isArray(demoPack?.options) ? demoPack.options : [];
      if (!options.length) {
        slot.innerHTML = `<p class="hint">No past paper demo loaded.</p>`;
        return;
      }

      if (!options.some((opt) => opt.id === currentPastPaperId)) {
        currentPastPaperId = options[0].id;
      }
      const selected = options.find((opt) => opt.id === currentPastPaperId) || options[0];

      slot.innerHTML = `
        <div class="helper">
          <select id="pastPaperSelect" aria-label="${demoPack.selectLabel || "Choose question"}" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;">
            ${options.map((opt) => `<option value="${opt.id}" ${opt.id === selected.id ? "selected" : ""}>${opt.label}</option>`).join("")}
          </select>
        </div>
        <div id="past-paper-demo-content">${selected.html || ""}</div>
      `;

      const selectEl = slot.querySelector("#pastPaperSelect");
      if (selectEl) {
        selectEl.addEventListener("change", (e) => {
          currentPastPaperId = e.target.value;
          renderPastPaperDemo();
          colorizeExampleTags();
        });
      }
      initPastPaperFillInBlanks(slot);
      syncPastPaperDetailHeights();
    }

    function normalizeDropWord(text) {
      return String(text || "").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function fillBlankFromWord(blank, keywordEl) {
      if (!blank || !keywordEl) return false;
      const expected = blank.getAttribute("data-answer-norm") || "";
      const got = keywordEl.getAttribute("data-word-norm") || normalizeDropWord(keywordEl.textContent);
      if (!expected || expected !== got) return false;

      blank.textContent = blank.getAttribute("data-answer") || keywordEl.textContent;
      blank.dataset.filled = "1";
      blank.classList.remove("is-wrong");
      blank.classList.add("is-filled");
      keywordEl.classList.add("used");
      keywordEl.setAttribute("draggable", "false");
      keywordEl.disabled = true;
      return true;
    }

    function initPastPaperFillInBlanks(slot) {
      const keywords = slot.querySelectorAll(".pp-keyword");
      const blanks = slot.querySelectorAll(".pp-blank");
      let selectedKeyword = null;

      function setSelectedKeyword(keyword) {
        keywords.forEach((k) => k.classList.remove("selected"));
        selectedKeyword = keyword || null;
        if (selectedKeyword) selectedKeyword.classList.add("selected");
      }

      keywords.forEach((kw) => {
        kw.addEventListener("click", () => {
          if (kw.classList.contains("used")) return;
          const already = kw.classList.contains("selected");
          setSelectedKeyword(already ? null : kw);
        });
      });

      function restoreKeywordByNorm(norm) {
        if (!norm) return;
        const kw = Array.from(keywords).find((k) => (k.getAttribute("data-word-norm") || "") === norm);
        if (!kw) return;
        kw.classList.remove("used");
        kw.disabled = false;
      }

      blanks.forEach((blank) => {
        blank.addEventListener("click", () => {
          const existingNorm = normalizeDropWord(blank.textContent || "");
          if (!selectedKeyword) {
            // No keyword selected: clicking a filled blank clears it.
            if (!existingNorm) return;
            if (blank.dataset.filled === "1") {
              const answerNorm = blank.getAttribute("data-answer-norm") || "";
              restoreKeywordByNorm(answerNorm);
            }
            blank.textContent = "";
            blank.dataset.filled = "0";
            blank.classList.remove("is-filled", "is-wrong", "is-revealed");
            return;
          }
          const selectedNorm = selectedKeyword.getAttribute("data-word-norm") || normalizeDropWord(selectedKeyword.textContent || "");

          // Replacement mode: if a different word is already in this blank, replace directly.
          if (existingNorm && existingNorm !== selectedNorm && blank.dataset.filled === "1") {
            const answerNorm = blank.getAttribute("data-answer-norm") || "";
            restoreKeywordByNorm(answerNorm);
          }

          const ok = fillBlankFromWord(blank, selectedKeyword);
          if (ok) {
            setSelectedKeyword(null);
          } else {
            blank.textContent = selectedKeyword.getAttribute("data-word") || selectedKeyword.textContent || "";
            blank.dataset.filled = "0";
            blank.classList.remove("is-filled", "is-revealed");
            blank.classList.add("is-wrong");
          }
        });
      });
    }

    function revealPastPaperAnswers() {
      const root = contentEl.querySelector("#past-paper-demo-root");
      if (!root) return;
      const blanks = root.querySelectorAll(".pp-blank");
      blanks.forEach((blank) => {
        if (blank.dataset.filled === "1") return;
        blank.textContent = blank.getAttribute("data-answer") || "";
        blank.dataset.filled = "1";
        blank.classList.add("is-filled", "is-revealed");
      });
      const keywords = root.querySelectorAll(".pp-keyword");
      keywords.forEach((kw) => {
        kw.classList.remove("selected");
        kw.classList.add("used");
        kw.setAttribute("draggable", "false");
        kw.disabled = true;
      });
    }

    function syncPastPaperDetailHeights() {
      const galleries = contentEl.querySelectorAll("#past-paper-demo-root .pastpaper-gallery");
      galleries.forEach((gallery) => {
        const mainHeightByBase = {};
        const figures = gallery.querySelectorAll(".pastpaper-figure");
        figures.forEach((fig) => {
          const base = (fig.getAttribute("data-plate-base") || "").toLowerCase();
          const isDetail = fig.getAttribute("data-plate-detail") === "1";
          const img = fig.querySelector("img");
          if (!base || !img) return;

          if (!isDetail && img.clientHeight > 0) {
            mainHeightByBase[base] = img.clientHeight;
          }
        });

        figures.forEach((fig) => {
          const base = (fig.getAttribute("data-plate-base") || "").toLowerCase();
          const isDetail = fig.getAttribute("data-plate-detail") === "1";
          const img = fig.querySelector("img");
          if (!base || !img || !isDetail) return;
          const cap = mainHeightByBase[base];
          img.style.maxHeight = cap ? `${cap}px` : "";
          img.style.objectFit = cap ? "contain" : "";
        });

        const imgs = gallery.querySelectorAll("img");
        imgs.forEach((img) => {
          img.addEventListener("load", () => {
            syncPastPaperDetailHeights();
          }, { once: true });
        });
      });
    }

    function renderAll() {
      renderShellText();
      renderNav();
      renderContent();
      renderPastPaperDemo();
      renderWordlists();
      colorizeExampleTags();
    }

    const ESSENTIAL_STEP_WORDS = {
      description: [
        "medium", "subject matter", "composition", "foreground", "background",
        "figure", "object", "both", "similarly", "in contrast", "whereas"
      ],
      analysis: [
        "colour", "space", "shape", "form", "line", "texture", "value",
        "movement", "rhythm", "contrast", "unity", "variety", "balance", "emphasis", "proportion",
        "pattern", "repetition"
      ],
      interpretation: [
        "identity", "memory", "power", "tradition", "change", "conflict",
        "isolation", "hope", "anxiety", "symbolizes", "implies", "suggests"
      ],
      judgement: [
        "effective", "convincing", "coherent", "original", "innovative",
        "memorable", "successful", "inconsistent", "because", "therefore"
      ]
    };

    function wordsForStep(step) {
      return [...(ESSENTIAL_STEP_WORDS[step] || [])];
    }

    function uniqueWords(list) {
      const seen = new Set();
      return list.filter((word) => {
        const key = String(word).trim().toLowerCase();
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function renderWordlists() {
      const stepClass = {
        description: "kw-d",
        analysis: "kw-a",
        interpretation: "kw-i",
        judgement: "kw-j"
      };
      const slots = contentEl.querySelectorAll("[data-wordlist-step]");
      slots.forEach((slot) => {
        const step = slot.getAttribute("data-wordlist-step");
        const words = uniqueWords(wordsForStep(step));
        const cls = stepClass[step] || "kw-d";
        slot.innerHTML = words.map((w) => `<span class="kw ${cls}">${w}</span>`).join("");
      });
    }

    function normalizeTagText(text) {
      return String(text || "").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function colorizeExampleTags() {
      const descSet = new Set([
        "media", "subject matter", "composition", "comparison", "viewpoint",
        "subject handling", "style orientation", "media language",
        "媒介", "題材", "構圖", "比較", "視角", "題材處理", "風格取向", "媒介語言"
      ].map(normalizeTagText));

      const elementSet = new Set([
        "line", "color", "space", "shape", "form", "texture", "value", "perspective",
        "線條", "色彩", "空間", "形狀", "形體", "質感", "明暗", "透視"
      ].map(normalizeTagText));

      const principleSet = new Set([
        "balance", "contrast", "emphasis", "proportion", "movement", "rhythm", "pattern", "repetition", "unity/variety",
        "平衡", "對比", "重點", "比例", "動勢", "節奏", "圖案", "統一/變化"
      ].map(normalizeTagText));

      const tags = contentEl.querySelectorAll(".example .chips span");
      tags.forEach((tag) => {
        const key = normalizeTagText(tag.textContent);
        tag.classList.remove("tag-desc", "tag-elements", "tag-principles", "tag-other");
        if (descSet.has(key)) {
          tag.classList.add("tag-desc");
        } else if (elementSet.has(key)) {
          tag.classList.add("tag-elements");
        } else if (principleSet.has(key)) {
          tag.classList.add("tag-principles");
        } else {
          tag.classList.add("tag-other");
        }
      });
    }

    navEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-target]");
      if (!btn) return;
      currentSection = btn.dataset.target;
      renderAll();
      document.body.classList.remove("menu-open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    btnEn.addEventListener("click", () => { currentLang = "en"; renderAll(); });
    btnZh.addEventListener("click", () => { currentLang = "zh"; renderAll(); });
    menuBtn.addEventListener("click", () => document.body.classList.toggle("menu-open"));
    overlay.addEventListener("click", () => document.body.classList.remove("menu-open"));
    window.addEventListener("resize", syncPastPaperDetailHeights);
    window.addEventListener("keydown", (e) => {
      const activeTag = document.activeElement ? document.activeElement.tagName : "";
      if (activeTag === "INPUT" || activeTag === "TEXTAREA" || activeTag === "SELECT") return;
      if (currentSection !== "pastpaper") return;
      if (e.code === "Space") {
        e.preventDefault();
        revealPastPaperAnswers();
      }
    });

    renderAll();
  </script>
</body>
</html>
