<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Looping Videos 9 - shorts</title>
    <style>
      body {
        margin: 0;
        background: #000;
        font-family: system-ui, sans-serif;
      }
      .section {
        padding: 24px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .wrap {
        width: min(1100px, 92vw);
        margin: 0 auto;
      }
      .video {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        background: #000;
        overflow: hidden;
        border-radius: 12px;
      }
      .video iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #countdown {
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 9999;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        line-height: 1.2;
        user-select: none;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      .timing-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      .timing-overlay[hidden] {
        display: none;
      }
      .timing-overlay__box {
        width: min(22rem, 100%);
        padding: 1rem 1.15rem 1.1rem;
        border-radius: 14px;
        background: rgba(22, 22, 26, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      }
      .timing-overlay__box label {
        display: block;
        color: rgba(255, 255, 255, 0.88);
        font-size: 13px;
        margin-bottom: 0.45rem;
      }
      .timing-overlay__box input[type="range"] {
        width: 100%;
        margin: 0 0 0.35rem;
      }
      #gap-readout {
        display: block;
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
      }
      .timing-overlay__hint {
        margin: 0.65rem 0 0;
        font-size: 11px;
        line-height: 1.35;
        color: rgba(255, 255, 255, 0.42);
      }
    </style>
  </head>
  <body>
    <div id="countdown">--</div>
    <div id="timing-panel" class="timing-overlay" hidden>
      <div class="timing-overlay__box">
        <label for="gap-slider">Time between clips (default)</label>
        <input id="gap-slider" type="range" min="15" max="90" step="5" value="45" />
        <span id="gap-readout">30-60 s</span>
        <p class="timing-overlay__hint">
          Any <code style="color: rgba(255, 255, 255, 0.55)">.section</code> with
          <code style="color: rgba(255, 255, 255, 0.55)">data-gap-min-sec</code> and
          <code style="color: rgba(255, 255, 255, 0.55)">data-gap-max-sec</code> uses its own
          random dwell time instead of this range.
        </p>
      </div>
    </div>
    <script>
      window.__BG_ROTATOR_EXTERNAL__ = true;
    </script>
    <script src="background-rotator.js"></script>
