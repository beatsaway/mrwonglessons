<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5C · SBA Artworks</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #fff;
      color: #1f2937;
      line-height: 1.5;
    }

    body.lightbox-open { overflow: hidden; }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 40px;
    }

    .back {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 0.84rem;
      color: #64748b;
      text-decoration: none;
    }

    .back:hover { color: #1e3a5f; }

    header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.35rem;
      font-weight: 650;
      color: #1e3a5f;
      letter-spacing: -0.02em;
    }

    .meta {
      margin: 0;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 600px) {
      .gallery { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 900px) {
      .gallery { grid-template-columns: repeat(4, 1fr); }
    }

    .item {
      margin: 0;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
    }

    .item button {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      cursor: zoom-in;
      font: inherit;
      color: inherit;
    }

    .thumb {
      aspect-ratio: 5 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #fff;
    }

    .item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .item figcaption {
      display: none;
      margin: 0;
      padding: 8px;
      font-size: 1rem;
      font-weight: 650;
      color: #1e3a5f;
      text-align: center;
      border-top: 1px solid #e5e7eb;
      background: #fafafa;
    }

    body.show-names .item figcaption { display: block; }

    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.88);
      z-index: 1000;
    }

    .lightbox.open {
      display: flex;
      flex-direction: column;
    }

    .lightbox-caption {
      display: none;
      margin: 0 0 10px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #fff;
      text-align: center;
    }

    body.show-names .lightbox-caption { display: block; }

    .lightbox img {
      max-width: min(100%, 1100px);
      max-height: calc(90vh - 2rem);
      border-radius: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      background: #fff;
    }

    .nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(255, 255, 255, 0.92);
      color: #1e3a5f;
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1001;
    }

    .nav.prev { left: 12px; }
    .nav.next { right: 12px; }
    .nav:disabled { opacity: 0.35; cursor: default; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← 5C</a>
    <header>
      <h1>5C · SBA Artworks</h1>
      <p class="meta">June 2026 · click thumbnail to enlarge</p>
    </header>
    <div class="gallery" id="gallery"></div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button type="button" class="nav prev" id="prevBtn" aria-label="Previous">‹</button>
    <p class="lightbox-caption" id="lightboxCaption"></p>
    <img id="lightboxImage" src="" alt="" />
    <button type="button" class="nav next" id="nextBtn" aria-label="Next">›</button>
  </div>

  <script>
    (function () {
      const PASSWORD = "1234567";
      while (true) {
        const input = window.prompt("Enter password to view SBA:");
        if (input === null) {
          location.href = "about:blank";
          return;
        }
        if (input === PASSWORD) break;
        window.alert("Incorrect password");
      }
    })();

    const FILES = [
      "aqsa1.webp", "aqsa2.webp",
      "biraz1.webp", "biraz2.webp",
      "ibrahim1.webp", "ibrahim2.webp",
      "junaid1.webp", "junaid2.webp", "junaid3.webp",
      "mandip1.webp", "mandip2.webp",
      "mhavish1.webp", "mhavish2.webp",
      "nikhil1.webp", "nikhil2.webp", "nikhil3.webp", "nikhil4.webp", "nikhil5.webp", "nikhil6.webp",
      "soyal1.webp",
    ];

    const IMAGES = FILES.map((file) => ({
      src: file,
      thumb: file.replace(/\.webp$/i, "_thumb.webp"),
      label: file.replace(/\.webp$/i, ""),
    }));

    const gallery = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentIndex = 0;

    IMAGES.forEach((item, index) => {
      const fig = document.createElement("figure");
      fig.className = "item";
      const btn = document.createElement("button");
      btn.type = "button";
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      const img = document.createElement("img");
      img.src = item.thumb;
      img.alt = item.label;
      img.loading = "lazy";
      img.decoding = "async";
      const cap = document.createElement("figcaption");
      cap.textContent = item.label;
      thumb.appendChild(img);
      btn.appendChild(thumb);
      fig.appendChild(btn);
      fig.appendChild(cap);
      btn.addEventListener("click", () => openAt(index));
      gallery.appendChild(fig);
    });

    function openAt(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.classList.add("lightbox-open");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.classList.remove("lightbox-open");
      lightboxImage.removeAttribute("src");
      lightboxCaption.textContent = "";
    }

    function updateLightbox() {
      const item = IMAGES[currentIndex];
      lightboxImage.src = item.src;
      lightboxImage.alt = item.label;
      lightboxCaption.textContent = item.label;
      prevBtn.disabled = currentIndex <= 0;
      nextBtn.disabled = currentIndex >= IMAGES.length - 1;
    }

    function step(delta) {
      const next = currentIndex + delta;
      if (next < 0 || next >= IMAGES.length) return;
      currentIndex = next;
      updateLightbox();
    }

    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "n" || e.key === "N") {
        if (e.target.matches("input, textarea")) return;
        document.body.classList.toggle("show-names");
        return;
      }
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });
  </script>
</body>
</html>
