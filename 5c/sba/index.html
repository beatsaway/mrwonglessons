<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5C · SBA Artworks</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #fff;
      color: #1f2937;
      line-height: 1.5;
    }

    body.lightbox-open { overflow: hidden; }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 40px;
    }

    .back {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 0.84rem;
      color: #64748b;
      text-decoration: none;
    }

    .back:hover { color: #1e3a5f; }

    header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.35rem;
      font-weight: 650;
      color: #1e3a5f;
      letter-spacing: -0.02em;
    }

    .meta {
      margin: 0;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .students {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 700px) {
      .students {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }

    .student-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fafafa;
      overflow: hidden;
    }

    .student-head {
      padding: 10px 12px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .student-name {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #1e3a5f;
    }

    .works {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: #e5e7eb;
    }

    .work {
      margin: 0;
      background: #fff;
    }

    .work button {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      cursor: zoom-in;
      font: inherit;
      color: inherit;
      text-align: center;
    }

    .thumb {
      aspect-ratio: 5 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #fff;
    }

    .work img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .work figcaption {
      margin: 0;
      padding: 6px 8px 8px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #6b7280;
      text-align: center;
      background: #fafafa;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.88);
      z-index: 1000;
    }

    .lightbox.open {
      display: flex;
      flex-direction: column;
    }

    .lightbox-caption {
      margin: 0 0 10px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #fff;
      text-align: center;
    }

    .lightbox img {
      max-width: min(100%, 1100px);
      max-height: calc(90vh - 2rem);
      border-radius: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      background: #fff;
    }

    .nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(255, 255, 255, 0.92);
      color: #1e3a5f;
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1001;
    }

    .nav.prev { left: 12px; }
    .nav.next { right: 12px; }
    .nav:disabled { opacity: 0.35; cursor: default; }

    @media (max-width: 400px) {
      .works { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← 5C</a>
    <header>
      <h1>5C · SBA Artworks</h1>
      <p class="meta">June 2026 · click thumbnail to enlarge</p>
    </header>
    <div class="students" id="gallery"></div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button type="button" class="nav prev" id="prevBtn" aria-label="Previous">‹</button>
    <p class="lightbox-caption" id="lightboxCaption"></p>
    <img id="lightboxImage" src="" alt="" />
    <button type="button" class="nav next" id="nextBtn" aria-label="Next">›</button>
  </div>

  <script>
    (function () {
      const PASSWORD = "1234567";
      while (true) {
        const input = window.prompt("Enter password to view SBA:");
        if (input === null) {
          location.href = "about:blank";
          return;
        }
        if (input === PASSWORD) break;
        window.alert("Incorrect password");
      }
    })();

    const ORDER = [
      "Aqsa",
      "Biraz",
      "Ibrahim",
      "Junaid",
      "Mandip",
      "Mhavish",
      "Nikhil",
      "Soyal",
    ];

    const STUDENTS = {
      Aqsa: ["aqsa1.webp", "aqsa2.webp"],
      Biraz: ["biraz1.webp", "biraz2.webp"],
      Ibrahim: ["ibrahim1.webp", "ibrahim2.webp"],
      Junaid: ["junaid1.webp", "junaid2.webp", "junaid3.webp"],
      Mandip: ["mandip1.webp", "mandip2.webp"],
      Mhavish: ["mhavish1.webp", "mhavish2.webp"],
      Nikhil: ["nikhil1.webp", "nikhil2.webp", "nikhil3.webp", "nikhil4.webp", "nikhil5.webp", "nikhil6.webp"],
      Soyal: ["soyal1.webp"],
    };

    const IMAGES = [];
    ORDER.forEach((name) => {
      const files = STUDENTS[name];
      if (!files) return;
      files.forEach((file, i) => {
        IMAGES.push({
          src: file,
          label: name + " · Artwork " + (i + 1),
        });
      });
    });

    const gallery = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentIndex = 0;

    ORDER.forEach((name) => {
      const files = STUDENTS[name];
      if (!files || !files.length) return;

      const card = document.createElement("article");
      card.className = "student-card";
      card.innerHTML =
        '<div class="student-head"><h2 class="student-name">' + name + "</h2></div>" +
        '<div class="works"></div>';
      const works = card.querySelector(".works");

      files.forEach((file, i) => {
        const idx = IMAGES.findIndex((img) => img.src === file);
        const fig = document.createElement("figure");
        fig.className = "work";
        const btn = document.createElement("button");
        btn.type = "button";
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        const img = document.createElement("img");
        img.src = file;
        img.alt = name + " artwork " + (i + 1);
        img.loading = "lazy";
        img.decoding = "async";
        const cap = document.createElement("figcaption");
        cap.textContent = "Artwork " + (i + 1);
        thumb.appendChild(img);
        btn.appendChild(thumb);
        fig.appendChild(btn);
        fig.appendChild(cap);
        btn.addEventListener("click", () => openAt(idx));
        works.appendChild(fig);
      });

      gallery.appendChild(card);
    });

    function openAt(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.classList.add("lightbox-open");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.classList.remove("lightbox-open");
      lightboxImage.removeAttribute("src");
      lightboxCaption.textContent = "";
    }

    function updateLightbox() {
      const item = IMAGES[currentIndex];
      lightboxImage.src = item.src;
      lightboxImage.alt = item.label;
      lightboxCaption.textContent = item.label;
      prevBtn.disabled = currentIndex <= 0;
      nextBtn.disabled = currentIndex >= IMAGES.length - 1;
    }

    function step(delta) {
      const next = currentIndex + delta;
      if (next < 0 || next >= IMAGES.length) return;
      currentIndex = next;
      updateLightbox();
    }

    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });
  </script>
</body>
</html>
