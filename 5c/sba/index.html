<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5C HKDSE VA Mock · SBA</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #fff;
      color: #1f2937;
      line-height: 1.5;
    }

    body.viewer-open { overflow: hidden; }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.35rem;
      font-weight: 650;
      color: #1e3a5f;
      letter-spacing: -0.02em;
    }

    .meta {
      margin: 0;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .back {
      display: inline-block;
      margin-bottom: 12px;
      font-size: 0.84rem;
      color: #64748b;
      text-decoration: none;
    }

    .back:hover { color: #1e3a5f; }

    .student-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .student-row { border-bottom: 1px solid #e5e7eb; }
    .student-row:last-child { border-bottom: none; }

    .student-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin: 0;
      padding: 14px 4px;
      border: none;
      background: none;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #1e3a5f;
      text-align: left;
      cursor: pointer;
    }

    .student-btn:hover { color: #2c5282; }

    .student-btn .pages {
      flex-shrink: 0;
      font-size: 0.82rem;
      font-weight: 500;
      color: #94a3b8;
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #f8fafc;
      z-index: 1000;
    }

    .viewer.open { display: flex; }

    .viewer-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 44px;
      padding: 0 8px 0 12px;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
      font-size: 0.9rem;
      color: #475569;
    }

    .viewer-bar-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-bar strong { font-weight: 650; color: #1e3a5f; }

    .viewer-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 1.35rem;
      line-height: 1;
      border-radius: 6px;
      cursor: pointer;
    }

    .viewer-close:hover { background: #f1f5f9; color: #1e3a5f; }

    .viewer-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      padding: 12px 52px;
      background: #eef2f7;
      overflow: hidden;
    }

    .viewer-stage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: 1px solid #e5e7eb;
      background: rgba(255, 255, 255, 0.95);
      color: #1e3a5f;
      font-size: 1.4rem;
      line-height: 1;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav.prev { left: 10px; }
    .nav.next { right: 10px; }
    .nav:disabled { opacity: 0.3; cursor: default; }

    @media (max-width: 600px) {
      .viewer-stage { padding: 12px 44px; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← 5C</a>
    <header>
      <h1>5C HKDSE VA Mock · SBA</h1>
      <p class="meta">June 2026 · workbook pages</p>
    </header>
    <ul class="student-list" id="studentList"></ul>
  </main>

  <div class="viewer" id="viewer" aria-hidden="true">
    <div class="viewer-bar">
      <span class="viewer-bar-title"><strong id="viewerName"></strong> · <span id="viewerPage"></span></span>
      <button type="button" class="viewer-close" id="viewerClose" aria-label="Close">×</button>
    </div>
    <div class="viewer-stage">
      <button type="button" class="nav prev" id="prevBtn" aria-label="Previous page">‹</button>
      <img id="viewerImage" src="" alt="" />
      <button type="button" class="nav next" id="nextBtn" aria-label="Next page">›</button>
    </div>
  </div>

  <script>
    (function () {
      const PASSWORD = "1234567";
      while (true) {
        const input = window.prompt("Enter password to view SBA:");
        if (input === null) {
          location.href = "about:blank";
          return;
        }
        if (input === PASSWORD) break;
        window.alert("Incorrect password");
      }
    })();

    const ORDER = [
      "Aqsa",
      "Biraz",
      "Ibrahim",
      "Junaid",
      "Mandip",
      "Mhavish",
      "Nikhil",
      "Soyal",
    ];

    const STUDENTS = {
      Aqsa: ["aqsa1.webp", "aqsa2.webp"],
      Biraz: ["biraz1.webp", "biraz2.webp"],
      Ibrahim: ["ibrahim1.webp", "ibrahim2.webp"],
      Junaid: ["junaid1.webp", "junaid2.webp", "junaid3.webp"],
      Mandip: ["mandip1.webp", "mandip2.webp"],
      Mhavish: ["mhavish1.webp", "mhavish2.webp"],
      Nikhil: ["nikhil1.webp", "nikhil2.webp", "nikhil3.webp", "nikhil4.webp", "nikhil5.webp", "nikhil6.webp"],
      Soyal: ["soyal1.webp"],
    };

    let viewName = "";
    let viewIndex = 0;

    const studentList = document.getElementById("studentList");
    const viewer = document.getElementById("viewer");
    const viewerName = document.getElementById("viewerName");
    const viewerPage = document.getElementById("viewerPage");
    const viewerImage = document.getElementById("viewerImage");
    const viewerClose = document.getElementById("viewerClose");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function pageLabel(count) {
      return count + (count === 1 ? " page" : " pages");
    }

    function openViewer(name, startIndex) {
      viewName = name;
      viewIndex = startIndex || 0;
      updateViewer();
      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");
      document.body.classList.add("viewer-open");
    }

    function closeViewer() {
      viewer.classList.remove("open");
      viewer.setAttribute("aria-hidden", "true");
      document.body.classList.remove("viewer-open");
      viewerImage.removeAttribute("src");
    }

    function updateViewer() {
      const pages = STUDENTS[viewName];
      const file = pages[viewIndex];
      viewerName.textContent = viewName;
      viewerPage.textContent = "Page " + (viewIndex + 1) + " of " + pages.length;
      viewerImage.src = file;
      viewerImage.alt = viewName + " SBA page " + (viewIndex + 1);
      prevBtn.disabled = viewIndex <= 0;
      nextBtn.disabled = viewIndex >= pages.length - 1;
    }

    function step(delta) {
      const pages = STUDENTS[viewName];
      const next = viewIndex + delta;
      if (next < 0 || next >= pages.length) return;
      viewIndex = next;
      updateViewer();
    }

    function renderList() {
      ORDER.forEach((name) => {
        const pages = STUDENTS[name];
        if (!pages || !pages.length) return;

        const li = document.createElement("li");
        li.className = "student-row";

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "student-btn";
        btn.innerHTML =
          "<span>" + name + "</span>" +
          '<span class="pages">' + pageLabel(pages.length) + "</span>";
        btn.addEventListener("click", () => openViewer(name, 0));

        li.appendChild(btn);
        studentList.appendChild(li);
      });
    }

    viewerClose.addEventListener("click", closeViewer);
    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));

    document.addEventListener("keydown", (e) => {
      if (!viewer.classList.contains("open")) return;
      if (e.key === "Escape") closeViewer();
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });

    renderList();
  </script>
</body>
</html>
