<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5C June 2026 Part A · Marking</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #fff;
      color: #1f2937;
      line-height: 1.5;
    }

    body.viewer-open { overflow: hidden; }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.35rem;
      font-weight: 650;
      color: #1e3a5f;
    }

    .meta { margin: 0; font-size: 0.9rem; color: #6b7280; }

    .student-list { list-style: none; margin: 0; padding: 0; }

    .student-row { border-bottom: 1px solid #e5e7eb; }

    .student-row:last-child { border-bottom: none; }

    .student-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin: 0;
      padding: 14px 4px;
      border: none;
      background: none;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #1e3a5f;
      text-align: left;
      cursor: pointer;
    }

    .student-btn:hover { color: #2c5282; }

    .student-score {
      font-size: 0.82rem;
      font-weight: 600;
      color: #6b7280;
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #f8fafc;
      z-index: 1000;
    }

    .viewer.open { display: flex; }

    .viewer-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 44px;
      padding: 0 8px 0 12px;
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
      font-size: 0.9rem;
      color: #475569;
    }

    .viewer-bar-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-bar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .text-toggle {
      display: none;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #475569;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .viewer-bar strong { font-weight: 650; color: #1e3a5f; }

    .viewer-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 1.35rem;
      line-height: 1;
      border-radius: 6px;
      cursor: pointer;
    }

    .viewer-close:hover { background: #f1f5f9; color: #1e3a5f; }

    .viewer-content {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 2fr 3fr;
    }

    .viewer-left {
      position: relative;
      min-height: 0;
      height: 100%;
      padding: 12px 52px;
      border-right: 1px solid #e5e7eb;
      background: #eef2f7;
      overflow: hidden;
    }

    .viewer-left img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: 1px solid #e5e7eb;
      background: rgba(255, 255, 255, 0.95);
      color: #1e3a5f;
      font-size: 1.4rem;
      line-height: 1;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav.prev { left: 10px; }
    .nav.next { right: 10px; }
    .nav:disabled { opacity: 0.3; cursor: default; }

    .viewer-right {
      position: relative;
      min-height: 0;
      overflow: auto;
      padding: 16px 20px 28px;
      background: #fff;
    }

    .grade-panel {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    .grade-panel h2 {
      margin: 0 0 10px;
      font-size: 0.92rem;
      font-weight: 650;
      color: #1e3a5f;
    }

    .score-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .score-label {
      font-size: 0.82rem;
      color: #475569;
      line-height: 1.3;
    }

    .score-btns {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }

    .score-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #fff;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
    }

    .score-btn:hover { background: #f1f5f9; }

    .score-btn.selected {
      background: #1e3a5f;
      border-color: #1e3a5f;
      color: #fff;
    }

    .grade-total {
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 650;
      color: #1e3a5f;
    }

    .grade-notes {
      margin: 8px 0 0;
      font-size: 0.82rem;
      color: #6b7280;
      line-height: 1.45;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-bottom: 12px;
      font-size: 0.75rem;
      color: #64748b;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend i {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      font-style: normal;
    }

    .comment-popup {
      display: none;
      position: absolute;
      z-index: 20;
      max-width: min(22rem, calc(100% - 24px));
      padding: 10px 32px 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
      font-size: 0.86rem;
      line-height: 1.5;
      color: #1f2937;
      pointer-events: auto;
    }

    .comment-popup.open { display: block; }

    .comment-popup strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.78rem;
      font-weight: 650;
      color: #1e3a5f;
    }

    .comment-popup-close {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #64748b;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }

    .comment-popup-close:hover {
      background: #f1f5f9;
      color: #1e3a5f;
    }

    .viewer-text-body { margin: 0; max-width: 42rem; }

    .viewer-text-body p {
      margin: 0 0 1.1em;
      white-space: pre-line;
      font-size: 0.97rem;
      line-height: 1.75;
      color: #374151;
    }

    .viewer-text-body p:last-child { margin-bottom: 0; }

    .viewer-text-body mark {
      padding: 0 0.12em;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 600;
    }

    .viewer-text-body mark.active {
      outline: 2px solid #1e3a5f;
      outline-offset: 1px;
    }

    .hl-description { background: #e2e8f0; color: #334155; }
    .hl-analysis { background: #dbeafe; color: #1d4ed8; }
    .hl-interpretation { background: #d1fae5; color: #047857; }
    .hl-judgement { background: #ffe4e6; color: #be123c; }

    @media (max-width: 900px) {
      .text-toggle { display: inline-flex; align-items: center; }

      .viewer-content {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      }

      .viewer.hide-text .viewer-content { grid-template-rows: 1fr; }
      .viewer.hide-text .viewer-right { display: none; }

      .viewer-left {
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 44px;
      }

      .viewer.hide-text .viewer-left { border-bottom: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>5C June 2026 Part A · Marking</h1>
      <p class="meta">Click coloured text for feedback beside the phrase · scores saved in this browser</p>
    </header>
    <ul class="student-list" id="studentList"></ul>
  </main>

  <div class="viewer" id="viewer" aria-hidden="true">
    <div class="viewer-bar">
      <span class="viewer-bar-title"><strong id="viewerName"></strong> · <span id="viewerPage"></span></span>
      <div class="viewer-bar-actions">
        <button type="button" class="text-toggle" id="textToggle" aria-pressed="false">Hide text</button>
        <button type="button" class="viewer-close" id="viewerClose" aria-label="Close">×</button>
      </div>
    </div>
    <div class="viewer-content">
      <div class="viewer-left">
        <button type="button" class="nav prev" id="prevBtn" aria-label="Previous page">‹</button>
        <img id="viewerImage" src="" alt="" />
        <button type="button" class="nav next" id="nextBtn" aria-label="Next page">›</button>
      </div>
      <div class="viewer-right" id="viewerRight">
        <div class="grade-panel" id="gradePanel"></div>
        <div class="legend">
          <span><i class="hl-description"></i> Literal Description</span>
          <span><i class="hl-analysis"></i> Formal Analysis</span>
          <span><i class="hl-interpretation"></i> Interpretation</span>
          <span><i class="hl-judgement"></i> Value Judgement</span>
        </div>
        <div class="comment-popup" id="commentPopup" role="dialog" aria-hidden="true">
          <button type="button" class="comment-popup-close" id="commentPopupClose" aria-label="Close feedback">×</button>
          <strong id="commentPopupLabel"></strong>
          <div id="commentPopupBody"></div>
        </div>
        <div class="viewer-text-body" id="viewerTextBody"></div>
      </div>
    </div>
  </div>

  <script src="students-data.js"></script>
  <script src="marking-data.js"></script>
  <script>
    const IMG_BASE = "";
    const SCORE_KEY = "parta-marking-scores-v2";
    const ORDER = ["Aqsa", "Biraz", "Ibrahim", "Jaylee", "Junaid", "Mandip", "Mhavish", "Nikhil", "Soyal"];
    const CRITERIA = [
      { key: "description", label: "Literal Description" },
      { key: "analysis", label: "Formal Analysis" },
      { key: "interpretation", label: "Interpretation of Meaning" },
      { key: "judgement", label: "Value Judgement" },
    ];

    let students = {};
    let marking = {};
    let savedScores = {};
    let viewName = "";
    let viewIndex = 0;
    let activeMark = null;

    const studentList = document.getElementById("studentList");
    const viewer = document.getElementById("viewer");
    const viewerName = document.getElementById("viewerName");
    const viewerPage = document.getElementById("viewerPage");
    const viewerImage = document.getElementById("viewerImage");
    const viewerClose = document.getElementById("viewerClose");
    const textToggle = document.getElementById("textToggle");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const gradePanel = document.getElementById("gradePanel");
    const viewerRight = document.getElementById("viewerRight");
    const commentPopup = document.getElementById("commentPopup");
    const commentPopupClose = document.getElementById("commentPopupClose");
    const commentPopupLabel = document.getElementById("commentPopupLabel");
    const commentPopupBody = document.getElementById("commentPopupBody");
    const viewerTextBody = document.getElementById("viewerTextBody");

    function loadSavedScores() {
      try {
        savedScores = JSON.parse(localStorage.getItem(SCORE_KEY) || "{}");
      } catch {
        savedScores = {};
      }
    }

    function persistScores() {
      localStorage.setItem(SCORE_KEY, JSON.stringify(savedScores));
    }

    function getScores(name) {
      if (savedScores[name]) return savedScores[name];
      const defaults = marking[name] && marking[name].scores;
      return defaults ? { ...defaults } : { description: null, analysis: null, interpretation: null, judgement: null };
    }

    function totalFor(name) {
      const s = getScores(name);
      const vals = CRITERIA.map((c) => s[c.key]).filter((v) => v !== null && v !== undefined);
      if (vals.length !== 4) return null;
      return vals.reduce((a, b) => a + b, 0);
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/'/g, "&#39;");
    }

    function applyHighlights(text, highlights) {
      let html = escapeHtml(text);
      if (!highlights || !highlights.length) return html;
      const sorted = [...highlights].sort((a, b) => b.text.length - a.text.length);
      for (const h of sorted) {
        const needle = escapeHtml(h.text);
        if (!needle || !html.includes(needle)) continue;
        const mark =
          '<mark class="hl hl-' + h.category + '" data-label="' + escapeAttr(CRITERIA.find((c) => c.key === h.category)?.label || h.category) + '" data-comment="' + escapeAttr(h.comment) + '" tabindex="0">' +
          needle +
          "</mark>";
        html = html.replace(needle, mark);
      }
      return html;
    }

    function renderText(name, text) {
      const highlights = (marking[name] && marking[name].highlights) || [];
      const parts = text.split(/\n\n+/).map((part) => part.trim()).filter(Boolean);
      if (!parts.length) {
        viewerTextBody.innerHTML = "<p><em>No text available.</em></p>";
        return;
      }
      viewerTextBody.innerHTML = parts
        .map((part) => "<p>" + applyHighlights(part, highlights) + "</p>")
        .join("");
      viewerTextBody.querySelectorAll("mark").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          showComment(el);
        });
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            showComment(el);
          }
        });
      });
    }

    function positionCommentPopup() {
      if (!activeMark || !commentPopup.classList.contains("open")) return;

      commentPopup.style.visibility = "hidden";
      commentPopup.style.display = "block";

      const markRect = activeMark.getBoundingClientRect();
      const containerRect = viewerRight.getBoundingClientRect();
      const scrollTop = viewerRight.scrollTop;
      const scrollLeft = viewerRight.scrollLeft;
      const popupH = commentPopup.offsetHeight;
      const popupW = commentPopup.offsetWidth;
      const gap = 8;

      let top = markRect.bottom - containerRect.top + scrollTop + gap;
      let left = markRect.left - containerRect.left + scrollLeft;

      left = Math.max(8, Math.min(left, viewerRight.clientWidth - popupW - 8));

      const visibleBottom = scrollTop + viewerRight.clientHeight;
      if (top + popupH > visibleBottom - 8) {
        top = markRect.top - containerRect.top + scrollTop - popupH - gap;
      }
      top = Math.max(scrollTop + 8, top);

      commentPopup.style.top = top + "px";
      commentPopup.style.left = left + "px";
      commentPopup.style.visibility = "visible";
    }

    function showComment(el) {
      viewerTextBody.querySelectorAll("mark.active").forEach((m) => m.classList.remove("active"));
      el.classList.add("active");
      activeMark = el;
      commentPopupLabel.textContent = el.dataset.label || "Feedback";
      commentPopupBody.textContent = el.dataset.comment || "";
      commentPopup.classList.add("open");
      commentPopup.setAttribute("aria-hidden", "false");
      positionCommentPopup();

      const visibleTop = markRectTop(el) - viewerRight.clientHeight * 0.35;
      viewerRight.scrollTo({ top: Math.max(0, visibleTop), behavior: "smooth" });
    }

    function markRectTop(el) {
      const markRect = el.getBoundingClientRect();
      const containerRect = viewerRight.getBoundingClientRect();
      return markRect.top - containerRect.top + viewerRight.scrollTop;
    }

    function clearComment() {
      activeMark = null;
      commentPopup.classList.remove("open");
      commentPopup.setAttribute("aria-hidden", "true");
      commentPopup.style.display = "";
      commentPopup.style.visibility = "";
      commentPopupLabel.textContent = "";
      commentPopupBody.textContent = "";
      viewerTextBody.querySelectorAll("mark.active").forEach((m) => m.classList.remove("active"));
    }

    function renderGradePanel(name) {
      const scores = getScores(name);
      const notes = (marking[name] && marking[name].notes) || "";
      let html = "<h2>Grades (0–5 each)</h2>";
      CRITERIA.forEach((c) => {
        html += '<div class="score-row"><span class="score-label">' + c.label + '</span><div class="score-btns" data-key="' + c.key + '">';
        for (let n = 0; n <= 5; n++) {
          const sel = scores[c.key] === n ? " selected" : "";
          html += '<button type="button" class="score-btn' + sel + '" data-value="' + n + '">' + n + "</button>";
        }
        html += "</div></div>";
      });
      const total = totalFor(name);
      html += '<div class="grade-total">Total: ' + (total !== null ? total + " / 20" : "— / 20") + "</div>";
      if (notes) html += '<p class="grade-notes">' + escapeHtml(notes) + "</p>";
      gradePanel.innerHTML = html;

      gradePanel.querySelectorAll(".score-btns").forEach((row) => {
        row.addEventListener("click", (e) => {
          const btn = e.target.closest(".score-btn");
          if (!btn) return;
          const key = row.dataset.key;
          const value = Number(btn.dataset.value);
          if (!savedScores[viewName]) savedScores[viewName] = getScores(viewName);
          savedScores[viewName][key] = value;
          persistScores();
          renderGradePanel(viewName);
          updateListScores();
        });
      });
    }

    function updateListScores() {
      ORDER.forEach((name) => {
        const el = document.getElementById("score-" + name);
        if (!el) return;
        const total = totalFor(name);
        el.textContent = total !== null ? total + " / 20" : "";
      });
    }

    function setTextVisible(visible) {
      viewer.classList.toggle("hide-text", !visible);
      textToggle.textContent = visible ? "Hide text" : "Show text";
      textToggle.setAttribute("aria-pressed", String(!visible));
    }

    function openViewer(name, startIndex) {
      viewName = name;
      viewIndex = startIndex || 0;
      const data = students[viewName];
      renderText(viewName, (data.text || "").trim());
      renderGradePanel(viewName);
      clearComment();
      setTextVisible(true);
      updateViewer();
      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");
      document.body.classList.add("viewer-open");
    }

    function closeViewer() {
      viewer.classList.remove("open", "hide-text");
      viewer.setAttribute("aria-hidden", "true");
      document.body.classList.remove("viewer-open");
      viewerImage.removeAttribute("src");
      viewerTextBody.innerHTML = "";
      gradePanel.innerHTML = "";
      clearComment();
    }

    function updateViewer() {
      const data = students[viewName];
      const page = data.pages[viewIndex];
      viewerName.textContent = viewName;
      viewerPage.textContent = "Page " + (viewIndex + 1) + " of " + data.pages.length;
      viewerImage.src = IMG_BASE + page.file;
      viewerImage.alt = viewName + " page " + (viewIndex + 1);
      prevBtn.disabled = viewIndex <= 0;
      nextBtn.disabled = viewIndex >= data.pages.length - 1;
    }

    function step(delta) {
      const next = viewIndex + delta;
      if (next < 0 || next >= students[viewName].pages.length) return;
      viewIndex = next;
      updateViewer();
    }

    function renderList() {
      ORDER.forEach((name) => {
        if (!students[name]) return;
        const li = document.createElement("li");
        li.className = "student-row";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "student-btn";
        const total = totalFor(name);
        btn.innerHTML =
          "<span>" + name + '</span><span class="student-score" id="score-' + name + '">' +
          (total !== null ? total + " / 20" : "") +
          "</span>";
        btn.addEventListener("click", () => openViewer(name, 0));
        li.appendChild(btn);
        studentList.appendChild(li);
      });
    }

    viewerClose.addEventListener("click", closeViewer);
    commentPopupClose.addEventListener("click", clearComment);
    textToggle.addEventListener("click", () => setTextVisible(viewer.classList.contains("hide-text")));
    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));

    viewerRight.addEventListener("scroll", () => {
      if (commentPopup.classList.contains("open")) positionCommentPopup();
    }, { passive: true });

    viewerTextBody.addEventListener("click", (e) => {
      if (!e.target.closest("mark")) clearComment();
    });

    document.addEventListener("keydown", (e) => {
      if (!viewer.classList.contains("open")) return;
      if (e.key === "Escape") {
        if (commentPopup.classList.contains("open")) {
          clearComment();
          return;
        }
        closeViewer();
      }
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });

    window.addEventListener("resize", () => {
      if (window.innerWidth > 900) viewer.classList.remove("hide-text");
      positionCommentPopup();
    });

    loadSavedScores();
    students = window.PARTA_STUDENTS || {};
    marking = window.PARTA_MARKING || {};
    renderList();
  </script>
</body>
</html>
