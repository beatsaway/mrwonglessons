<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5C Part B · Example Improvements</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #f8fafc;
      color: #1f2937;
      line-height: 1.5;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      font-weight: 650;
      color: #1e3a5f;
      letter-spacing: -0.02em;
    }

    .meta {
      margin: 0;
      font-size: 0.9rem;
      color: #64748b;
      max-width: 52rem;
    }

    .macro-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .macro-bar button {
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #475569;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s, color 0.12s;
    }

    .macro-bar button:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    .macro-bar button.active {
      background: #1e4d8c;
      border-color: #1e4d8c;
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 980px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-head {
      padding: 12px 14px 10px;
      border-bottom: 1px solid #f1f5f9;
    }

    .card-head h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      color: #1e3a5f;
    }

    .theme {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .points {
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .points li {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #e2e8f0;
      color: #475569;
    }

    .frame {
      margin: 0 14px 14px;
      min-height: 120px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .frame img {
      display: block;
      object-fit: contain;
    }

    .frame.landscape img {
      width: 100%;
      height: auto;
    }

    .frame.portrait img {
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: min(520px, 72vh);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Part B · Example Improvements</h1>
      <p class="meta">
        Compare each student's final piece with three enhancements by Mr Wong. Each version combines
        several changes.
      </p>
      <ul class="points">
        <li>Stronger mid-tones</li>
        <li>Complementary shades</li>
        <li>Highlights &amp; balance</li>
      </ul>
      <div class="macro-bar" id="macroBar" role="toolbar" aria-label="View all students">
        <button type="button" class="active" data-step="0">Original student work</button>
        <button type="button" data-step="1">Enhance 1</button>
        <button type="button" data-step="2">Enhance 2</button>
        <button type="button" data-step="3">Enhance 3</button>
      </div>
    </header>

    <div class="grid" id="grid"></div>
  </main>

  <script>
    const THEME_TITLES = {
      1: "An Interpretation of a Chair",
      2: "Take a Break",
    };

    const STEPS = [
      { label: "Original student work" },
      { label: "Enhance 1" },
      { label: "Enhance 2" },
      { label: "Enhance 3" },
    ];

    const STUDENTS = [
      { name: "Jaylee", key: "jaylee", theme: 1 },
      { name: "Mandip", key: "mandip", theme: 1 },
      { name: "Aqsa", key: "aqsa", theme: 2 },
      { name: "Biraz", key: "biraz", theme: 2 },
      { name: "Ibrahim", key: "ibrahim", theme: 2 },
      { name: "Junaid", key: "junaid", theme: 2 },
      { name: "Mhavish", key: "mhavish", theme: 2 },
      { name: "Nikhil", key: "nikhil", theme: 2 },
      { name: "Soyal", key: "soyal", theme: 2 },
    ];

    function imagesFor(student) {
      const t = student.theme;
      const original = "../" + encodeURI(student.name + "_theme" + t + ".webp");
      return [
        original,
        student.key + "_v2a.webp",
        student.key + "_v2b.webp",
        student.key + "_v2c.webp",
      ];
    }

    const grid = document.getElementById("grid");
    const macroBar = document.getElementById("macroBar");
    let currentStep = 0;
    const cardRenderers = [];

    function setGlobalStep(step) {
      currentStep = step;
      macroBar.querySelectorAll("button").forEach((btn, i) => {
        btn.classList.toggle("active", i === step);
      });
      cardRenderers.forEach((render) => render(step));
    }

    macroBar.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        setGlobalStep(+btn.dataset.step);
      });
    });

    STUDENTS.forEach((student) => {
      const images = imagesFor(student);

      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML =
        '<div class="card-head">' +
          '<h2>' + student.name + "</h2>" +
          '<p class="theme">Theme ' + student.theme + " · " + THEME_TITLES[student.theme] + "</p>" +
        "</div>" +
        '<div class="frame"><img alt="" loading="lazy" decoding="async"></div>';

      const frameEl = card.querySelector(".frame");
      const imgEl = card.querySelector("img");

      function fitFrame() {
        if (!imgEl.naturalWidth) return;
        const portrait = imgEl.naturalHeight > imgEl.naturalWidth;
        frameEl.classList.toggle("portrait", portrait);
        frameEl.classList.toggle("landscape", !portrait);
      }

      imgEl.addEventListener("load", fitFrame);

      function render(step) {
        const s = STEPS[step];
        frameEl.classList.remove("portrait", "landscape");
        imgEl.src = images[step];
        imgEl.alt = student.name + " · " + s.label;
        if (imgEl.complete) fitFrame();
      }

      cardRenderers.push(render);
      grid.appendChild(card);
    });

    setGlobalStep(0);
  </script>
</body>
</html>
