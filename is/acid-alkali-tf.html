<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>酸與鹼 · True / False</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --green: #22c55e;
      --reveal: #0ea5e9;
      --bg: #fafaf9;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding-top: 24px;
    }
    .progress-track {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 24px;
      background: #e7e5e4;
      z-index: 20;
    }
    .progress-fill {
      height: 100%;
      background: var(--green);
      transform-origin: left center;
      transform: scaleX(1);
    }
    .progress-fill.reveal-phase { background: var(--reveal); }
    header.bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.45rem;
      border-bottom: 1px solid var(--line);
      background: #fff;
      min-height: 1.75rem;
    }
    header.bar a.home,
    header.bar button.lang-btn {
      width: 1.45rem;
      height: 1.45rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      font-size: 0.75rem;
      flex-shrink: 0;
      padding: 0;
      cursor: pointer;
    }
    header.bar a.home { text-decoration: none; }
    header.bar button.lang-btn.active { background: #fef3c7; border-color: #f59e0b; }
    header.bar .meta {
      flex: 1;
      min-width: 0;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    header.bar .timer {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 0.82rem;
      color: #16a34a;
      flex-shrink: 0;
    }
    header.bar .timer.reveal-phase { color: #0369a1; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 1.5rem 1.15rem 2rem;
      max-width: 58rem;
      margin: 0 auto;
      width: 100%;
    }
    .answer-marks {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 0 0 0.85rem;
      font-size: clamp(3rem, 14vw, 5.5rem);
      line-height: 1;
      min-height: 1.05em;
      text-align: center;
    }
    .mark-swap {
      display: inline-block;
      transition: transform 0.08s ease-out;
    }
    .mark-swap.flip { transform: scale(1.08); }
    .mark-swap.locked { transform: scale(1); }
    .content-block {
      margin: 0;
      width: 100%;
      text-align: center;
    }
    .content-line {
      margin: 0;
      font-weight: 600;
      line-height: 1.28;
      text-align: center;
    }
    .content-line.en {
      font-family: "Noto Serif", "Segoe UI", Georgia, serif;
      font-size: clamp(2.25rem, 9vw, 3.5rem);
    }
    .content-line.zh {
      margin-top: 0.65rem;
      font-family: "Noto Serif TC", "Microsoft JhengHei", "PingFang TC", serif;
      font-size: clamp(2.15rem, 8.5vw, 3.35rem);
      font-weight: 700;
      color: #1c1917;
    }
    body.lang-en .content-line.en,
    body.lang-zh .content-line.zh {
      font-size: clamp(2.65rem, 10vw, 4rem);
      line-height: 1.22;
    }
    body.lang-en .content-line.zh,
    body.lang-zh .content-line.en { display: none; }
    .answer-block {
      display: none;
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--line);
    }
    .answer-block.visible { display: block; }
    .content-line .char-tilt {
      display: inline-block;
      transform-origin: 50% 52%;
    }
    .correction .content-line.en {
      font-family: "Noto Serif", "Segoe UI", Georgia, serif;
      font-size: clamp(1.85rem, 7.5vw, 2.65rem);
      font-weight: 500;
      color: var(--muted);
    }
    .correction .content-line.zh {
      font-family: "Noto Serif TC", "Microsoft JhengHei", "PingFang TC", serif;
      font-size: clamp(1.75rem, 7.2vw, 2.55rem);
      font-weight: 600;
      color: #44403c;
    }
    body.lang-en .correction .content-line.en,
    body.lang-zh .correction .content-line.zh {
      font-size: clamp(2.05rem, 8.2vw, 2.85rem);
    }
    .done-msg {
      display: none;
      text-align: center;
      font-size: 1.05rem;
      padding: 1rem 0.5rem;
    }
    .done-msg.visible { display: block; }
    .card { display: block; }
    .card.hidden { display: none; }
  </style>
</head>
<body class="lang-both">
  <div class="progress-track" aria-hidden="true">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <header class="bar">
    <a class="home" href="../index.html" aria-label="Home">🏠</a>
    <button type="button" id="langToggle" class="lang-btn active" aria-label="Language: bilingual (EN + 中文)" title="EN + 中文">📝</button>
    <span class="meta">酸與鹼 · 對/錯 · <span id="counter">1/60</span></span>
    <span class="timer" id="timer" aria-live="polite">15</span>
  </header>

  <main>
    <div class="card" id="card">
      <div class="answer-marks" id="answerMarks" aria-hidden="true">
        <span class="mark-swap" id="markSwap" aria-live="polite">✔️</span>
      </div>
      <div class="content-block">
        <p class="content-line en" id="statementEn"></p>
        <p class="content-line zh" id="statementZh"></p>
      </div>
      <div class="answer-block" id="answerBlock">
        <div class="correction">
          <p class="content-line en" id="correctionEn"></p>
          <p class="content-line zh" id="correctionZh"></p>
        </div>
      </div>
    </div>
    <div class="done-msg" id="doneMsg">
      <p><strong>完成 · Done</strong> — 60 題</p>
      <p style="margin:0.35rem 0 0;font-size:0.9rem;color:var(--muted)"><a href="acid-alkali-tf.html">再玩</a> · <a href="../index.html">主頁</a></p>
    </div>
  </main>

  <script src="acid-alkali-tf-data.js"></script>
  <script>
    (function () {
      var ITEMS = window.IS_ACID_ALKALI_TF || [];
      var QUESTION_MS = 15000;
      var REVEAL_MS = 10000;
      var LANG_CYCLE = ["both", "en", "zh"];
      var LANG_LABELS = {
        both: { aria: "Language: bilingual (EN + 中文)", title: "EN + 中文", body: "lang-both" },
        en: { aria: "Language: English only", title: "EN only", body: "lang-en" },
        zh: { aria: "Language: Chinese only (中文)", title: "中文 only", body: "lang-zh" }
      };

      var langMode = "both";
      var index = 0;
      var phase = "question";
      var phaseEnd = 0;
      var rafId = null;
      var currentItem = null;

      var progressFill = document.getElementById("progressFill");
      var timerEl = document.getElementById("timer");
      var counterEl = document.getElementById("counter");
      var markSwap = document.getElementById("markSwap");
      var statementEn = document.getElementById("statementEn");
      var statementZh = document.getElementById("statementZh");
      var answerBlock = document.getElementById("answerBlock");
      var correctionEn = document.getElementById("correctionEn");
      var correctionZh = document.getElementById("correctionZh");
      var card = document.getElementById("card");
      var doneMsg = document.getElementById("doneMsg");
      var langToggle = document.getElementById("langToggle");

      var markLocked = false;
      var showingTick = true;
      var lastMarkSwap = 0;
      var tiltRefresh = 0;

      function cancelTick() {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      }

      function hashString(text) {
        var h = 2166136261 >>> 0;
        for (var i = 0; i < text.length; i++) {
          h ^= text.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function random01FromSeed(seed) {
        var x = seed >>> 0;
        x ^= x << 13;
        x ^= x >>> 17;
        x ^= x << 5;
        return (x >>> 0) / 4294967295;
      }

      /** Muted per-char tint: varied hue, low saturation & lightness. */
      function colorFromSeed(seed) {
        var h = random01FromSeed((seed + 48271) >>> 0) * 360;
        var s = 10 + random01FromSeed((seed + 91327) >>> 0) * 18;
        var l = 30 + random01FromSeed((seed + 55159) >>> 0) * 12;
        return "hsl(" + h.toFixed(1) + "," + s.toFixed(1) + "%," + l.toFixed(1) + "%)";
      }

      function escapeHtml(ch) {
        if (ch === "&") return "&amp;";
        if (ch === "<") return "&lt;";
        if (ch === ">") return "&gt;";
        return ch;
      }

      /** Per-character slight tilt like 2Aroom (−4° to +4°); optional muted tint. */
      function setRotatedText(el, text, baseSeed, tintChars) {
        if (!el) return;
        if (!text) {
          el.textContent = "";
          return;
        }
        var html = "";
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          if (ch === " ") {
            html += " ";
            continue;
          }
          if (ch === "\n") {
            html += "<br>";
            continue;
          }
          var seed = (baseSeed + i * 2654435761) >>> 0;
          var deg = -4 + random01FromSeed(seed) * 8;
          var style = "transform:rotate(" + deg.toFixed(2) + "deg)";
          if (tintChars) style += ";color:" + colorFromSeed(seed);
          html += '<span class="char-tilt" style="' + style + '">' +
            escapeHtml(ch) + "</span>";
        }
        el.innerHTML = html;
      }

      function renderStatements(item, tiltSalt) {
        var salt = (tiltSalt || 0) * 104729;
        var seed = (hashString(item.statement) + index * 9973 + salt) >>> 0;
        setRotatedText(statementEn, item.statement, seed, true);
        setRotatedText(statementZh, item.statementZh || "", (seed + 7919) >>> 0, true);
      }

      function refreshStatementTilt() {
        if (!currentItem || markLocked || phase !== "question") return;
        tiltRefresh += 1;
        renderStatements(currentItem, tiltRefresh);
      }

      function startMarkSwap() {
        markLocked = false;
        showingTick = true;
        lastMarkSwap = Date.now();
        tiltRefresh = 0;
        markSwap.textContent = "✔️";
        markSwap.classList.remove("locked");
      }

      /**
       * Swap interval eases from MAX toward MIN as countdown elapses.
       * t^5 keeps early swaps slow; urgency ramps only near the end and
       * exp() asymptotes toward MIN (rate ceiling, no overshoot).
       */
      function swapIntervalMs(elapsedFrac) {
        var MIN = 48;
        var MAX = 920;
        var t = Math.max(0, Math.min(0.998, elapsedFrac));
        var delayed = Math.pow(t, 5);
        var urgency = delayed / (1 - t + 0.06);
        return MIN + (MAX - MIN) * Math.exp(-0.38 * urgency);
      }

      function updateMarkSwap() {
        if (markLocked || phase !== "question") return;
        var left = Math.max(0, phaseEnd - Date.now());
        var elapsedFrac = 1 - left / QUESTION_MS;
        var now = Date.now();
        if (now - lastMarkSwap >= swapIntervalMs(elapsedFrac)) {
          showingTick = !showingTick;
          markSwap.textContent = showingTick ? "✔️" : "❌";
          markSwap.classList.add("flip");
          setTimeout(function () { markSwap.classList.remove("flip"); }, 80);
          lastMarkSwap = now;
          refreshStatementTilt();
        }
      }

      function lockMark(isTrue) {
        markLocked = true;
        markSwap.textContent = isTrue ? "✔️" : "❌";
        markSwap.classList.add("locked");
        markSwap.classList.remove("flip");
      }

      function renderCorrections(item) {
        var seed = (hashString(item.correction) + index * 6337) >>> 0;
        setRotatedText(correctionEn, item.correction, seed);
        setRotatedText(correctionZh, item.correctionZh || "", (seed + 7919) >>> 0);
      }

      function applyLangMode() {
        var info = LANG_LABELS[langMode];
        document.body.className = info.body;
        langToggle.setAttribute("aria-label", info.aria);
        langToggle.title = info.title;
      }

      function cycleLang() {
        var i = LANG_CYCLE.indexOf(langMode);
        langMode = LANG_CYCLE[(i + 1) % LANG_CYCLE.length];
        applyLangMode();
      }

      langToggle.addEventListener("click", cycleLang);

      function setBar(frac, isReveal) {
        progressFill.classList.toggle("reveal-phase", isReveal);
        timerEl.classList.toggle("reveal-phase", isReveal);
        progressFill.style.transform = "scaleX(" + Math.max(0, Math.min(1, frac)) + ")";
      }

      function tick() {
        var left = Math.max(0, phaseEnd - Date.now());
        var total = phase === "question" ? QUESTION_MS : REVEAL_MS;
        setBar(left / total, phase === "reveal");
        timerEl.textContent = String(Math.ceil(left / 1000));
        updateMarkSwap();
        if (left <= 0) {
          if (phase === "question") showReveal();
          else nextItem();
          return;
        }
        rafId = requestAnimationFrame(tick);
      }

      function startPhase(nextPhase) {
        phase = nextPhase;
        phaseEnd = Date.now() + (phase === "question" ? QUESTION_MS : REVEAL_MS);
        cancelTick();
        setBar(1, phase === "reveal");
        rafId = requestAnimationFrame(tick);
      }

      function showItem() {
        if (index >= ITEMS.length) {
          card.classList.add("hidden");
          doneMsg.classList.add("visible");
          cancelTick();
          timerEl.textContent = "";
          setBar(0, false);
          currentItem = null;
          return;
        }
        currentItem = ITEMS[index];
        counterEl.textContent = (index + 1) + "/" + ITEMS.length;
        answerBlock.classList.remove("visible");
        startMarkSwap();
        renderStatements(currentItem);
        correctionEn.textContent = "";
        correctionZh.textContent = "";
        startPhase("question");
      }

      function showReveal() {
        phase = "reveal";
        answerBlock.classList.add("visible");
        lockMark(currentItem.answer);
        renderCorrections(currentItem);
        startPhase("reveal");
      }

      function nextItem() {
        if (!ITEMS.length || index >= ITEMS.length) return;
        index += 1;
        showItem();
      }

      function prevItem() {
        if (!ITEMS.length) return;
        if (index >= ITEMS.length) {
          index = ITEMS.length - 1;
        } else if (index > 0) {
          index -= 1;
        } else {
          return;
        }
        card.classList.remove("hidden");
        doneMsg.classList.remove("visible");
        showItem();
      }

      function isTypingTarget(el) {
        if (!el || el === document.body) return false;
        var tag = el.tagName;
        return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || el.isContentEditable;
      }

      document.addEventListener("keydown", function (e) {
        if (isTypingTarget(e.target) || e.altKey || e.ctrlKey || e.metaKey) return;

        if (e.key === "ArrowLeft") {
          e.preventDefault();
          prevItem();
          return;
        }
        if (e.key === "ArrowRight") {
          e.preventDefault();
          nextItem();
          return;
        }
        if (e.key === "m" || e.key === "M") {
          e.preventDefault();
          cycleLang();
        }
      });

      if (!ITEMS.length) {
        statementEn.textContent = "No statements loaded.";
        return;
      }
      applyLangMode();
      showItem();
    })();
  </script>
</body>
</html>
