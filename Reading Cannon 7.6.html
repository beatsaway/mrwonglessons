<!DOCTYPE html>
<!-- saved from url=(0025)https://rcv1.netlify.app/ -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Cannon 7.6</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
        .name-label {
            position: absolute;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5), -2px -2px 4px rgba(0,0,0,0.5);
            text-align: center;
            transition: font-size 0.3s ease;
            pointer-events: none;
            font-size: 14px;
        }
        #tools {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            user-select: none;
            cursor: pointer;
        }
        #starCount, #statsPanel {
            position: absolute;
            top: 50px;
            left: 10px;
            background: white;
            padding: 10px;
            display: none;

        }
        .parachute-emoji {
            position: absolute;
            font-size: 60px;
            transition: opacity 0.5s ease-in-out;
        }
        #countdownDisplay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            font-family: sans-serif;
            color: white;
            text-shadow: 2px 2px 4px black;
            display: none;
            user-select: none;
        }
        #flyingEmoji {
            position: absolute;
            font-size: 72px;
            cursor: pointer;
            display: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="tools">
        <button id="pickRandom">🔮 Pick Random</button>
        <button id="starTool">⭐ Star Count</button>
        <span id="statsTool">🔍</span>
        <span id="saveButton">💾</span>
        <span id="loadButton">📂</span>
        <a href="https://rcv1.netlify.app/pics_lark/pics_lark" style="cursor: pointer; text-decoration: none;" target="_blank" title="Lark by Anthony Mcgowan">📙</a>
        <a href="https://rcv1.netlify.app/lookbothways/2ndbook" style="cursor: pointer; text-decoration: none;" target="_blank" title="Look both ways by Jason Reynolds">📘</a>
        <a href="https://rcv1.netlify.app/" target="_blank" title="next book" style="cursor: pointer; text-decoration: none;">📗</a>
        <a href="https://rcv1.netlify.app/" target="_blank" title="next next book" style="cursor: pointer; text-decoration: none;">📕</a>
        <input type="file" id="fileInput" style="display: none;" accept=".csv">
    </div>

    <div id="starCount">
        <p><span id="characterName"></span>'s Star Count: <span id="starValue"></span></p>
        <input type="number" id="newStarValue" min="0">
        <button id="updateStar">Update</button>
    </div>

    <div id="statsPanel"></div>
    <div id="countdownDisplay"></div>
    <div id="flyingEmoji" style="font-size: 144pt;">🛸</div>

    <script src="./Reading Cannon 7.6_files/three.min.js.下載"></script>
    <script src="./Reading Cannon 7.6_files/OrbitControls.js.下載"></script>
    <script>
        const pickRandomButton = document.getElementById('pickRandom');
        const starToolButton = document.getElementById('starTool');
        const statsToolButton = document.getElementById('statsTool');
        const starCountDiv = document.getElementById('starCount');
        const characterNameSpan = document.getElementById('characterName');
        const starValueSpan = document.getElementById('starValue');
        const newStarValueInput = document.getElementById('newStarValue');
        const updateStarButton = document.getElementById('updateStar');
        const statsPanelDiv = document.getElementById('statsPanel');
        const countdownDisplayDiv = document.getElementById('countdownDisplay');
        const flyingEmojiDiv = document.getElementById('flyingEmoji');
        const saveButton = document.getElementById('saveButton');
        const loadButton = document.getElementById('loadButton');
        const fileInput = document.getElementById('fileInput');

        let isMoving = false;
        let selectedCharacter = null;
        let movingCharacter = null;
        let countdownInterval;
        let ufoClicked = false;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(Math.random(), Math.random(), Math.random());
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const students = [
            'Alisa','Antonia','Argon','Aria', 'Abdullahi',
            'Baris','Dawud','Hassan','Ilinca','Lev','Jasraj',
            'Karim','Katya','Makar','Mapalo','Milli', 'Eleanor',
            'Rikardo','Rohab','Sabina','Zahraa','Zaid'
        ].sort();

        const LEFT_MEADOW_CENTER = { x: -10, z: 0 };
        const RIGHT_MEADOW_CENTER = { x: 10,  z: 0 };
        const MEADOW_SIZE = 20;

        // Create meadows
        const meadowGeometry = new THREE.PlaneGeometry(20, 32);
        const meadow1Material = new THREE.MeshBasicMaterial({ color: new THREE.Color(Math.random(), Math.random(), Math.random()) });
        const meadow2Material = new THREE.MeshBasicMaterial({ color: new THREE.Color(Math.random(), Math.random(), Math.random()) });

        const meadow1 = new THREE.Mesh(meadowGeometry, meadow1Material);
        meadow1.rotation.x = -Math.PI / 2;
        meadow1.position.set(-10, -1, 0);
        scene.add(meadow1);

        const meadow2 = new THREE.Mesh(meadowGeometry, meadow2Material);
        meadow2.rotation.x = -Math.PI / 2;
        meadow2.position.set(10, -1, 0);
        scene.add(meadow2);

        let mainTile = meadow1;
        mainTile.userData.isMainTile = true;
        meadow2.userData.isMainTile = false;

        // Create a cute “Minecraft Villager”
        function createCuteMinecraftVillager() {
            const group = new THREE.Group();

            const skinColor = new THREE.Color(Math.random(), Math.random(), Math.random());
            const clothesColor = new THREE.Color(Math.random(), Math.random(), Math.random());

            // Head
            const headGeometry = new THREE.BoxGeometry(1, 1, 1);
            const headMaterial = new THREE.MeshBasicMaterial({ color: skinColor });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 0.8;
            group.add(head);

            // Body
            const bodyGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.5);
            const bodyMaterial = new THREE.MeshBasicMaterial({ color: clothesColor });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0;
            group.add(body);

            // Arms
            const armGeometry = new THREE.BoxGeometry(0.3, 0.9, 0.3);
            const leftArm = new THREE.Mesh(armGeometry, bodyMaterial);
            leftArm.position.set(-0.55, -0.1, 0);
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeometry, bodyMaterial);
            rightArm.position.set(0.55, -0.1, 0);
            group.add(rightArm);

            // Legs
            const legGeometry = new THREE.BoxGeometry(0.3, 0.5, 0.3);
            const pantsMaterial = new THREE.MeshBasicMaterial({
                color: new THREE.Color(clothesColor).multiplyScalar(0.7)
            });
            const leftLeg = new THREE.Mesh(legGeometry, pantsMaterial);
            leftLeg.position.set(-0.2, -0.65, 0);
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeometry, pantsMaterial);
            rightLeg.position.set(0.2, -0.65, 0);
            group.add(rightLeg);

            // Store references for walking
            group.userData.leftLeg = leftLeg;
            group.userData.rightLeg = rightLeg;
            group.userData.leftArm = leftArm;
            group.userData.rightArm = rightArm;

            return group;
        }

        // Build all characters
        const characters = students.map((name) => {
            const character = createCuteMinecraftVillager();
            // Random start position in LEFT meadow
            character.position.x = Math.random() * 15 - 17;
            character.position.z = Math.random() * 5;
            scene.add(character);

            const nameDiv = document.createElement('div');
            nameDiv.textContent = name;
            nameDiv.className = 'name-label';
            document.body.appendChild(nameDiv);

            return {
                character,
                nameDiv,
                name,
                stars: 0,
                survival: 0,
                atMeadow: 'Left',
                direction: new THREE.Vector2(Math.random() - 0.5, Math.random() - 0.5).normalize(),
                lastDirectionChange: 0,
                movementSpeed: Math.random() * 0.02 + 0.001,
                
                directionChangeInterval: Math.random() * 3000 + 500
            };
        });

        camera.position.set(0, 5, 10);
        controls.update();

        function animate(time) {
            requestAnimationFrame(animate);
            controls.update();

            characters.forEach((cObj) => {
                const { character, nameDiv, direction, movementSpeed, directionChangeInterval, atMeadow } = cObj;

                // If not currently in "moveCharacter" flight
                if (!isMoving || character !== movingCharacter?.character) {
                    if(!isMoving){
                    character.position.x += direction.x * movementSpeed;
                    character.position.z += direction.y * movementSpeed;
                    }else{
                    character.position.x += direction.x * movementSpeed/2;
                    character.position.z += direction.y * movementSpeed/2;
                    character.rotation.y += rotationSpeed/70;
                    }

                    // Walking animation
                    const walkingSpeed = movementSpeed * 100;
                    const legRotation = Math.sin(time * 0.01 * walkingSpeed);
                    const armRotation = Math.sin(time * 0.01 * walkingSpeed) * 0.5;

                    character.userData.leftLeg.rotation.x = legRotation;
                    character.userData.rightLeg.rotation.x = -legRotation;
                    character.userData.leftArm.rotation.x = -armRotation;
                    character.userData.rightArm.rotation.x = armRotation;

                    // Bounds & random direction
                    const meadowCenter = (atMeadow === 'Left') ? LEFT_MEADOW_CENTER : RIGHT_MEADOW_CENTER;
                    if (
                        character.position.x <= meadowCenter.x - MEADOW_SIZE/2 ||
                        character.position.x >= meadowCenter.x + MEADOW_SIZE/2 ||
                        character.position.z <= meadowCenter.z - 16 ||
                        character.position.z >= meadowCenter.z + 16 ||
                        time - cObj.lastDirectionChange > directionChangeInterval
                    ) {
                        direction.set(Math.random() - 0.5, Math.random() - 0.5).normalize();
                        cObj.lastDirectionChange = time;
                    }

                    // Clamp position
                    character.position.x = Math.max(meadowCenter.x - MEADOW_SIZE/2,
                                                    Math.min(meadowCenter.x + MEADOW_SIZE/2, character.position.x));
                    character.position.z = Math.max(meadowCenter.z - 16,
                                                    Math.min(meadowCenter.z + 16, character.position.z));
                }

                // Update label in 2D
                const vector = new THREE.Vector3().setFromMatrixPosition(character.matrixWorld);
                vector.project(camera);

                const widthHalf = window.innerWidth / 2;
                const heightHalf = window.innerHeight / 2;
                const x = (vector.x * widthHalf) + widthHalf;
                const y = -(vector.y * heightHalf) + heightHalf;

                nameDiv.style.left = `${x}px`;
                nameDiv.style.top = `${y + 30}px`;

                const distance = camera.position.distanceTo(character.position);
                const fontSize = Math.max(1, Math.min(36, 200 / distance));
                nameDiv.style.fontSize = `${fontSize}px`;
                nameDiv.style.width = `${fontSize * 5}px`;
                nameDiv.style.marginLeft = `-${fontSize * 2.5}px`;
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        let rotationSpeed = Math.random();
        // ----------------- PICK RANDOM -----------------
        pickRandomButton.addEventListener('click', () => {
            if (isMoving) return;
            rotationSpeed = Math.random();
            const currentMeadowName = (mainTile === meadow1) ? 'Left' : 'Right';
            const charsOnTile = characters.filter(c => c.atMeadow === currentMeadowName);
            if (charsOnTile.length === 0) {
                // Switch meadow if no one is left
                mainTile.userData.isMainTile = false;
                mainTile = (mainTile === meadow1) ? meadow2 : meadow1;
                mainTile.userData.isMainTile = true;
                return;
            }

            const randomCharacter = charsOnTile[Math.floor(Math.random() * charsOnTile.length)];
            moveCharacter(randomCharacter);
        });

        // ----------------- MOVE CHARACTER (TWO STAGES) -----------------
        function moveCharacter(cObj) {
            // Must be on "main tile"
            const currentMeadowName = (mainTile === meadow1) ? 'Left' : 'Right';
            if (cObj.atMeadow !== currentMeadowName) {
                console.log("Character is not on the main tile. Cannot move.");
                return;
            }

            isMoving = true;
            movingCharacter = cObj;
            ufoClicked = false;

            const startY = cObj.character.position.y;
            const targetY = 11;  // rise to y=11
            const duration = 10000; // 10 seconds
            let remainingTime = 10;
            const startTime = Date.now();

            countdownDisplayDiv.style.display = 'block';
            flyingEmojiDiv.style.display = 'block';
            flyingEmojiDiv.textContent = '🛸';
            updateFlyingEmojiPosition(cObj);

            // Show countdown
            countdownDisplayDiv.textContent = `${cObj.name}  ${remainingTime}`;
            countdownInterval = setInterval(() => {
                remainingTime--;
                countdownDisplayDiv.textContent = `${cObj.name}  ${remainingTime}`;
                if (remainingTime <= 0) {
                    clearInterval(countdownInterval);
                }
            }, 1000);

            // --- STAGE 1: Rise up (Y movement only), same as your original code
            function animateRise() {
                const elapsedTime = Date.now() - startTime;
                const progress = Math.min(elapsedTime / duration, 1);

                // Linear or simple interpolation for rising
                cObj.character.position.y = startY + (targetY - startY) * progress;
                updateFlyingEmojiPosition(cObj);

                //rotating
                cObj.character.rotation.y += (rotationSpeed + 1) ** 8 * 0.001;

                // Keep going until UFO clicked or time is up
                if (progress < 1 && !ufoClicked) {
                    requestAnimationFrame(animateRise);
                } else {
                    // Stage 1 complete => proceed to Stage 2 (smooth travel to new meadow)
                    finalizeLiftOff(cObj);
                }
            }
            requestAnimationFrame(animateRise);

            // UFO click => skip the rest of rising and proceed
            flyingEmojiDiv.addEventListener('click', handleUfoClick);

            function handleUfoClick() {
                if (!ufoClicked && movingCharacter) {
                    ufoClicked = true;
                    movingCharacter.survival++;
                    updateStatsPanel();
                }
            }
        }

        // After rising or UFO click => move to the other meadow
        function finalizeLiftOff(cObj) {
            // Clear countdown & UFO
            countdownDisplayDiv.textContent = ' ';
            countdownDisplayDiv.style.display = 'none';
            flyingEmojiDiv.style.display = 'none';
            clearInterval(countdownInterval);

            // Stage 2: smoothly move from current (x, y=~11, z) to new meadow
            cObj.atMeadow = (cObj.atMeadow === 'Left') ? 'Right' : 'Left';
            const targetMeadowCenter = (cObj.atMeadow === 'Left') ? LEFT_MEADOW_CENTER : RIGHT_MEADOW_CENTER;

            const startX = cObj.character.position.x;
            const startY = cObj.character.position.y; // ~11
            const startZ = cObj.character.position.z;

            // Random target in the new meadow (land at y=0)
            const targetX = targetMeadowCenter.x + (Math.random() * MEADOW_SIZE - MEADOW_SIZE / 2);
            const targetZ = targetMeadowCenter.z + (Math.random() * MEADOW_SIZE - MEADOW_SIZE / 2);
            const targetY = 0;

            const moveDuration = 1500; // 1.5 seconds or whichever you like
            const moveStartTime = performance.now();

            function moveToTarget() {
                const elapsed = performance.now() - moveStartTime;
                const progress = Math.min(elapsed / moveDuration, 1);

                // Smooth-step for x, y, z
                const smooth = progress * progress * (3 - 2 * progress);

                cObj.character.position.x = startX + (targetX - startX) * smooth;
                cObj.character.position.z = startZ + (targetZ - startZ) * smooth;
                cObj.character.position.y = startY + (targetY - startY) * smooth;

                if (progress < 1) {
                    requestAnimationFrame(moveToTarget);
                } else {
                    finalizeLanding(cObj);
                }
            }
            requestAnimationFrame(moveToTarget);
        }

        // Final step: character lands in new meadow
        function finalizeLanding(cObj) {
            isMoving = false;
            movingCharacter = null;

            // If UFO was clicked, show parachute
            if (ufoClicked) {
                displayParachuteEmoji(cObj);
            }
            updateStatsPanel();
        }

        // Show parachute emoji if UFO was clicked
        function displayParachuteEmoji(cObj) {
            const parachuteEmoji = document.createElement('div');
            parachuteEmoji.textContent = '🪂';
            parachuteEmoji.className = 'parachute-emoji';
            document.body.appendChild(parachuteEmoji);

            function updateParachutePosition() {
                const vector = new THREE.Vector3().setFromMatrixPosition(cObj.character.matrixWorld);
                vector.project(camera);

                const widthHalf = window.innerWidth / 2;
                const heightHalf = window.innerHeight / 2;

                const x = (vector.x * widthHalf + widthHalf);
                const y = -(vector.y * heightHalf) + heightHalf;

                parachuteEmoji.style.left = `${x}px`;
                parachuteEmoji.style.top = `${y - 60}px`;
            }

            function animateParachute() {
                updateParachutePosition();
                requestAnimationFrame(animateParachute);
            }
            animateParachute();

            // Remove parachute after 10 seconds
            setTimeout(() => {
                parachuteEmoji.style.opacity = '0';
                setTimeout(() => {
                    document.body.removeChild(parachuteEmoji);
                }, 500);
            }, 10000);
        }

        // Keep UFO floating above the character
        function updateFlyingEmojiPosition(cObj) {
            const vector = new THREE.Vector3().setFromMatrixPosition(cObj.character.matrixWorld);
            vector.project(camera);

            const widthHalf = window.innerWidth / 2;
            const x = (vector.x * widthHalf + widthHalf);
            flyingEmojiDiv.style.left = `${x}px`;
            flyingEmojiDiv.style.top = `0px`; // pinned to top
        }

        // ------------- STARS & STATS -------------
        starToolButton.addEventListener('click', () => {
            if (starToolButton.textContent === '⭐ Star Count') {
                starToolButton.textContent = '❌ Cancel';
                renderer.domElement.style.cursor = 'pointer';
            } else {
                starToolButton.textContent = '⭐ Star Count';
                renderer.domElement.style.cursor = 'default';
                starCountDiv.style.display = 'none';
            }
        });

        statsToolButton.addEventListener('click', () => {
            if (statsPanelDiv.style.display === 'none' || !statsPanelDiv.style.display) {
                updateStatsPanel();
                statsPanelDiv.style.display = 'unset';
            } else {
                statsPanelDiv.style.display = 'none';
            }
        });

        function updateStatsPanel() {
            statsPanelDiv.innerHTML = '<h3>Character Stats</h3>';
            const table = document.createElement('table');
            table.innerHTML = `
                <tr>
                    <th>Name</th>
                    <th>⭐Stars</th>
                    <th>🪂Survival</th>
                    <th>📖Meadow</th>
                </tr>
            `;
            characters.forEach(char => {
                const row = table.insertRow();
                row.innerHTML = `
                    <td>${char.name}</td>
                    <td>${char.stars}</td>
                    <td>${char.survival}</td>
                    <td>${char.atMeadow}</td>
                `;
            });
            statsPanelDiv.appendChild(table);
        }

        renderer.domElement.addEventListener('click', (event) => {
            // Only if in Star Count mode
            if (starToolButton.textContent !== '❌ Cancel') return;

            const mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length > 0) {
                const clickedObject = intersects[0].object;
                selectedCharacter = characters.find(c => c.character.id === clickedObject.parent?.id);
                if (selectedCharacter) {
                    characterNameSpan.textContent = selectedCharacter.name;
                    starValueSpan.textContent = selectedCharacter.stars;
                    newStarValueInput.value = selectedCharacter.stars;
                    starCountDiv.style.display = 'block';
                }
            }
        });

        updateStarButton.addEventListener('click', () => {
            if (selectedCharacter) {
                selectedCharacter.stars = parseInt(newStarValueInput.value) || 0;
                starCountDiv.style.display = 'none';
                updateStatsPanel();
            }
        });

        // ----------------- SAVE / LOAD -----------------
        saveButton.addEventListener('click', () => {
            const saveData = {
                characters: characters.map(char => ({
                    name: char.name,
                    stars: char.stars,
                    survival: char.survival,
                    atMeadow: char.atMeadow
                })),
                mainTileIsLeft: mainTile === meadow1  
            };
            const jsonString = JSON.stringify(saveData, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'game_state.json';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        loadButton.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const saveData = JSON.parse(e.target.result);
                        // Load character data
                        saveData.characters.forEach(savedChar => {
                            const character = characters.find(c => c.name === savedChar.name);
                            if (character) {
                                character.stars = savedChar.stars;
                                character.survival = savedChar.survival;
                                character.atMeadow = savedChar.atMeadow;
                                const meadowCenter = (character.atMeadow === 'Left')
                                  ? LEFT_MEADOW_CENTER
                                  : RIGHT_MEADOW_CENTER;
                                character.character.position.set(
                            meadowCenter.x + (Math.random() * 15 - 7.5),  // Random position within meadow
                            0,
                            meadowCenter.z + (Math.random() * 5 - 2.5)
                        );
                            }
                        });
                        // Restore main tile state
                if (typeof saveData.mainTileIsLeft === 'boolean') {
                    mainTile = saveData.mainTileIsLeft ? meadow1 : meadow2;
                    meadow1.userData.isMainTile = saveData.mainTileIsLeft;
                    meadow2.userData.isMainTile = !saveData.mainTileIsLeft;
                }

                        updateStatsPanel();
                    } catch (error) {
                        console.error("Error loading save file:", error);
                        alert("Error loading save file. Please check the file format.");
                    }
                };
                reader.readAsText(file);
