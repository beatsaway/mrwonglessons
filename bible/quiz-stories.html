<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Stories Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #fff;
      color: #0f172a;
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.5;
      margin: 0;
    }

    .bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.28rem 0.65rem;
      border-bottom: 1px solid #e2e8f0;
      background: #fff;
    }

    .bar-text {
      min-width: 0;
      flex: 1;
    }

    .bar-text h1 {
      font-size: 0.78rem;
      font-weight: 650;
      color: #0f172a;
      line-height: 1.2;
      margin: 0;
    }

    .bar-side {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .wrap {
      width: 100%;
      max-width: 34rem;
      margin: 0 auto;
      padding: 0.55rem 0.85rem 1.15rem;
    }

    @media (min-width: 540px) {
      .wrap {
        max-width: 42rem;
      }
    }

    .counter {
      font-size: 0.65rem;
      font-weight: 600;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .lang {
      display: flex;
      gap: 0.1rem;
      padding: 0.06rem;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      background: #f8fafc;
    }

    .lang button {
      border: none;
      background: transparent;
      padding: 0.12rem 0.4rem;
      border-radius: 3px;
      font: inherit;
      font-size: 0.65rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      line-height: 1.1;
    }

    .lang button.active {
      background: #fff;
      color: #0f172a;
      box-shadow: 0 1px 1px rgba(15, 23, 42, 0.06);
    }

    .question {
      font-size: 1.15rem;
      font-weight: 600;
      color: #0f172a;
      line-height: 1.4;
      margin-bottom: 0.85rem;
      min-height: 2.6rem;
    }

    .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    @media (min-width: 540px) {
      .opts {
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
      }
    }

    .opt {
      width: 100%;
      min-height: 3.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 0.9rem;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
      font: inherit;
      font-size: 0.98rem;
      font-weight: 500;
      color: #0f172a;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }

    @media (min-width: 540px) {
      .opt {
        min-height: 4.5rem;
        padding: 0.85rem 1rem;
        font-size: 1.05rem;
      }
    }

    .opt .tag {
      flex: none;
      width: 1.65rem;
      height: 1.65rem;
      border-radius: 8px;
      background: #f1f5f9;
      color: #475569;
      font-size: 0.78rem;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    @media (min-width: 540px) {
      .opt .tag {
        width: 2rem;
        height: 2rem;
        font-size: 0.9rem;
        border-radius: 9px;
      }

      .opt[data-choice="A"] .tag { background: #fee2e2; color: #b91c1c; }
      .opt[data-choice="B"] .tag { background: #dbeafe; color: #1d4ed8; }
      .opt[data-choice="C"] .tag { background: #fef9c3; color: #a16207; }
      .opt[data-choice="D"] .tag { background: #dcfce7; color: #15803d; }
    }

    .opt:hover:not(.blocked) {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    .opt.correct {
      border-color: #16a34a;
      background: #f0fdf4;
    }

    .opt.correct .tag {
      background: #dcfce7;
      color: #15803d;
    }

    .opt.wrong {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .opt.wrong .tag {
      background: #fee2e2;
      color: #b91c1c;
    }

    .opt.blocked {
      pointer-events: none;
      opacity: 0.55;
    }

    .opt.correct.blocked,
    .opt.wrong.blocked {
      opacity: 1;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 1rem;
      border-top: 1px solid #e2e8f0;
    }

    .fb {
      font-size: 0.9rem;
      font-weight: 500;
      color: #64748b;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #334155;
      border-radius: 8px;
      padding: 0.5rem 0.9rem;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .btn-primary {
      background: #0f172a;
      border-color: #0f172a;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1e293b;
      border-color: #1e293b;
    }

    .ctx {
      display: none;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      font-size: 0.88rem;
      color: #334155;
      line-height: 1.55;
    }

    .ctx.show { display: block; }

    .ctx-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      margin-bottom: 0.35rem;
    }

    @media (max-width: 480px) {
      .wrap { padding: 0.55rem 0.85rem 1rem; }
      .question { font-size: 1.05rem; }
      .footer { flex-direction: column; align-items: stretch; }
      .actions { width: 100%; }
      .btn { flex: 1; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="bar-text">
      <h1 id="barTitle">Bible Stories</h1>
    </div>
    <div class="bar-side">
      <span class="counter" id="counter">1 / 12</span>
      <div class="lang">
        <button type="button" id="langEn" class="active">EN</button>
        <button type="button" id="langZh">中</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="question" id="qText"></div>
    <div class="opts" id="opts"></div>

    <div class="footer">
      <span class="fb" id="fb">Choose an answer</span>
      <div class="actions">
        <button type="button" class="btn" id="hintBtn" disabled>Reference</button>
        <button type="button" class="btn btn-primary" id="nextBtn" disabled>Next</button>
      </div>
    </div>

    <div class="ctx" id="ctx">
      <span class="ctx-label" id="ctxLabel">Scripture</span>
      <span id="ctxContent"></span>
    </div>
  </div>

  <script>
    (function () {
      const qs = [
        { en: { q: "Who built the ark to save the animals from the flood?", opts: ["Noah", "Moses", "David", "Abraham"], ans: 0, ctx: "Genesis 6–9 — God told Noah to build the ark." },
          zh: { q: "誰建造方舟拯救動物脫離洪水？", opts: ["挪亞", "摩西", "大衛", "亞伯拉罕"], ans: 0, ctx: "創世記 6–9 章 — 上帝吩咐挪亞建造方舟。" } },
        { en: { q: "Who was thrown into a lions' den but God kept him safe?", opts: ["Daniel", "Samson", "Joseph", "Elijah"], ans: 0, ctx: "Daniel 6 — Daniel prayed to God and was protected." },
          zh: { q: "誰被扔進獅子坑，但上帝保守他平安？", opts: ["但以理", "參孫", "約瑟", "以利亞"], ans: 0, ctx: "但以理書 6 章 — 但以理禱告上帝，便得蒙保守。" } },
        { en: { q: "Where was baby Jesus born?", opts: ["Jerusalem", "Bethlehem", "Nazareth", "Egypt"], ans: 1, ctx: "Luke 2:4-7 — Jesus was born in Bethlehem." },
          zh: { q: "嬰孩耶穌在哪裡出生？", opts: ["耶路撒冷", "伯利恆", "拿撒勒", "埃及"], ans: 1, ctx: "路加福音 2:4-7 — 耶穌在伯利恆出生。" } },
        { en: { q: "Who fought the giant Goliath?", opts: ["Saul", "Samuel", "David", "Jonathan"], ans: 2, ctx: "1 Samuel 17 — young David trusted God and won." },
          zh: { q: "誰與巨人歌利亞作戰？", opts: ["掃羅", "撒母耳", "大衛", "約拿單"], ans: 2, ctx: "撒母耳記上 17 章 — 少年大衛倚靠上帝得勝。" } },
        { en: { q: "Who was the first woman God created?", opts: ["Sarah", "Ruth", "Mary", "Eve"], ans: 3, ctx: "Genesis 2 — Eve was made to be Adam's wife." },
          zh: { q: "上帝創造的第一個女人是誰？", opts: ["撒拉", "路得", "馬利亞", "夏娃"], ans: 3, ctx: "創世記 2 章 — 夏娃成為亞當的妻子。" } },
        { en: { q: "Who led God's people out of Egypt?", opts: ["Joshua", "Moses", "Aaron", "Joseph"], ans: 1, ctx: "Exodus 14 — Moses led Israel through the Red Sea." },
          zh: { q: "誰帶領上帝的子民離開埃及？", opts: ["約書亞", "摩西", "亞倫", "約瑟"], ans: 1, ctx: "出埃及記 14 章 — 摩西帶領以色列人過紅海。" } },
        { en: { q: "Who was swallowed by a big fish?", opts: ["Peter", "Jonah", "Paul", "John"], ans: 1, ctx: "Jonah 1–2 — Jonah ran away, but God sent the fish." },
          zh: { q: "誰被大魚吞了？", opts: ["彼得", "約拿", "保羅", "約翰"], ans: 1, ctx: "約拿書 1–2 章 — 約拿逃走，上帝卻派大魚留住他。" } },
        { en: { q: "Who had a colourful coat and could explain dreams?", opts: ["Jacob", "Joseph", "Benjamin", "Isaac"], ans: 1, ctx: "Genesis 37 — Joseph's brothers were jealous of him." },
          zh: { q: "誰有彩衣，又能解夢？", opts: ["雅各", "約瑟", "便雅憫", "以撒"], ans: 1, ctx: "創世記 37 章 — 約瑟的兄弟嫉妒他。" } },
        { en: { q: "In which garden did Adam and Eve live?", opts: ["Garden of Gethsemane", "Garden of Eden", "Garden of Solomon", "Garden of Bethlehem"], ans: 1, ctx: "Genesis 2 — God placed them in Eden." },
          zh: { q: "亞當和夏娃住在哪個園子？", opts: ["客西馬尼園", "伊甸園", "所羅門園", "伯利恆園"], ans: 1, ctx: "創世記 2 章 — 上帝把牠們安置在伊甸園。" } },
        { en: { q: "Who denied knowing Jesus three times?", opts: ["Judas", "Thomas", "Peter", "John"], ans: 2, ctx: "Matthew 26:69-75 — Peter was sorry and wept." },
          zh: { q: "誰三次不認識耶穌？", opts: ["猶大", "多馬", "彼得", "約翰"], ans: 2, ctx: "馬太福音 26:69-75 — 彼得後來懊悔哭泣。" } },
        { en: { q: "Who baptized Jesus in the Jordan River?", opts: ["Peter", "John the Baptist", "Andrew", "James"], ans: 1, ctx: "Matthew 3:13-17 — the Spirit came like a dove." },
          zh: { q: "誰在約旦河為耶穌施洗？", opts: ["彼得", "施洗約翰", "安得烈", "雅各"], ans: 1, ctx: "馬太福音 3:13-17 — 聖靈好像鴿子降下。" } },
        { en: { q: "What did God use to feed the Israelites in the desert?", opts: ["Bread from heaven", "Fish and chips", "Rice cakes", "Chocolate"], ans: 0, ctx: "Exodus 16 — God sent manna each morning." },
          zh: { q: "上帝在曠野用什麼餵飽以色列人？", opts: ["從天降下的食物", "炸魚和薯條", "米餅", "巧克力"], ans: 0, ctx: "出埃及記 16 章 — 上帝每天早晨賜下嗎哪。" } }
      ];

      const UI = {
        en: {
          title: "Bible Stories",
          choose: "Choose an answer",
          correct: "Correct",
          tryAgain: "Try again",
          reference: "Reference",
          next: "Next",
          scripture: "Scripture",
          done: "All done!",
          great: "Well done!",
        },
        zh: {
          title: "聖經故事小測驗",
          choose: "選一個答案",
          correct: "答對了",
          tryAgain: "再試一次",
          reference: "經文",
          next: "下一題",
          scripture: "經文",
          done: "全部完成！",
          great: "做得好！",
        },
      };

      let idx = 0;
      let lang = "en";
      let locked = false;
      let done = false;

      const counter = document.getElementById("counter");
      const barTitle = document.getElementById("barTitle");
      const qText = document.getElementById("qText");
      const opts = document.getElementById("opts");
      const fb = document.getElementById("fb");
      const hintBtn = document.getElementById("hintBtn");
      const nextBtn = document.getElementById("nextBtn");
      const ctx = document.getElementById("ctx");
      const ctxLabel = document.getElementById("ctxLabel");
      const ctxContent = document.getElementById("ctxContent");
      const langEn = document.getElementById("langEn");
      const langZh = document.getElementById("langZh");

      function t() { return UI[lang]; }
      function getQ() { return qs[idx][lang]; }

      function syncUiText() {
        const u = t();
        barTitle.textContent = u.title;
        hintBtn.textContent = u.reference;
        nextBtn.textContent = u.next;
        ctxLabel.textContent = u.scripture;
      }

      function render() {
        const q = getQ();
        const u = t();
        locked = false;
        done = false;
        ctx.classList.remove("show");
        hintBtn.disabled = true;
        nextBtn.disabled = true;
        fb.textContent = u.choose;
        fb.style.color = "#64748b";
        counter.textContent = (idx + 1) + " / " + qs.length;
        qText.textContent = q.q;

        opts.innerHTML = "";
        const tags = ["A", "B", "C", "D"];
        q.opts.forEach(function (txt, i) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "opt";
          btn.dataset.choice = tags[i];
          btn.innerHTML = '<span class="tag">' + tags[i] + "</span>" + txt;
          btn.addEventListener("click", function () { clickOpt(btn, i, q); });
          opts.appendChild(btn);
        });
      }

      function clickOpt(btn, i, q) {
        if (locked) return;
        const all = document.querySelectorAll(".opt");
        const correct = i === q.ans;
        const u = t();

        if (correct) {
          locked = true;
          done = true;
          all.forEach(function (el, j) {
            el.classList.add("blocked");
            if (j === q.ans) el.classList.add("correct");
          });
          fb.textContent = u.correct;
          fb.style.color = "#15803d";
          hintBtn.disabled = false;
          nextBtn.disabled = false;
        } else {
          btn.classList.add("wrong", "blocked");
          fb.textContent = u.tryAgain;
          fb.style.color = "#b91c1c";
        }
      }

      function showCtx() {
        if (!done) return;
        ctxContent.textContent = getQ().ctx;
        ctx.classList.add("show");
      }

      function next() {
        if (!done) return;
        const u = t();
        if (idx < qs.length - 1) {
          idx += 1;
          render();
        } else {
          qText.textContent = u.done;
          opts.innerHTML = "";
          counter.textContent = qs.length + " / " + qs.length;
          fb.textContent = u.great;
          fb.style.color = "#15803d";
          ctx.classList.remove("show");
          hintBtn.disabled = true;
          nextBtn.disabled = true;
        }
      }

      function setLang(l) {
        if (l === lang) return;
        lang = l;
        langEn.classList.toggle("active", l === "en");
        langZh.classList.toggle("active", l === "zh");
        syncUiText();
        render();
        if (ctx.classList.contains("show")) {
          ctxContent.textContent = getQ().ctx;
        }
      }

      hintBtn.addEventListener("click", showCtx);
      nextBtn.addEventListener("click", next);
      langEn.addEventListener("click", function () { setLang("en"); });
      langZh.addEventListener("click", function () { setLang("zh"); });

      syncUiText();
      render();
    })();
  </script>
</body>
</html>
