<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #fff;
      color: #1e293b;
      line-height: 1.5;
    }
    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: 0.85rem 1rem 2rem;
    }
    h1 {
      margin: 0 0 0.2rem;
      font-size: 1.25rem;
      font-weight: 650;
      color: #0f172a;
    }
    .meta {
      margin: 0 0 1rem;
      color: #64748b;
      font-size: 0.88rem;
    }
    a.card {
      display: block;
      padding: 1rem 1.1rem;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
      color: #0f172a;
      text-decoration: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    a.card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    a.card strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 0.2rem;
    }
    a.card span {
      font-size: 0.88rem;
      color: #64748b;
    }

    a.card + a.card {
      margin-top: 0.65rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bible</h1>
    <p class="meta">Quizzes and revision.</p>
    <a class="card" href="quiz.html">
      <strong>Bible Numbers Quiz</strong>
      <span>12 multiple-choice questions · English / 中文</span>
    </a>
    <a class="card" href="quiz-stories.html">
      <strong>Bible Stories Quiz</strong>
      <span>People, places and stories · English / 中文</span>
    </a>
  </main>
</body>
</html>
