<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>2A · 操行紀錄</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #fff;
      --text: #1a2332;
      --muted: #6b7785;
      --accent: #1e4d8c;
      --accent-soft: #e8eef7;
      --border: #e2e8f0;
      --warn: #b45309;
      --warn-soft: #fff7ed;
      --serious: #b91c1c;
      --serious-soft: #fef2f2;
      --good: #15803d;
      --good-soft: #f0fdf4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: .5rem;
      min-height: 36px;
      padding: max(.35rem, env(safe-area-inset-top)) .75rem .35rem;
      background: var(--accent);
      color: #fff;
      font-size: .85rem;
      font-weight: 600;
      border-bottom: 1px solid #163a6b;
    }

    .header a {
      color: rgba(255, 255, 255, .85);
      text-decoration: none;
      font-weight: 500;
    }

    .header a:hover { color: #fff; }

    main {
      padding: .75rem .75rem 2rem;
      max-width: 640px;
      margin: 0 auto;
    }

    .summary {
      margin: 0 0 .75rem;
      font-size: .85rem;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: .75rem;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font: inherit;
      font-size: .78rem;
      font-weight: 600;
      padding: .35rem .65rem;
      border-radius: 999px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .search {
      flex: 1 1 160px;
      min-width: 0;
      padding: .4rem .65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      font-size: .85rem;
      background: var(--card);
    }

    .search:focus {
      outline: none;
      border-color: #94a3b8;
    }

    .student {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: .65rem;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
    }

    .student.hidden { display: none; }

    .student-head {
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .75rem .85rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #fafbfd 0%, #fff 100%);
    }

    .no {
      flex: none;
      width: 2.1rem;
      height: 2.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: .9rem;
      border-radius: 8px;
    }

    .name {
      font-size: 1.05rem;
      font-weight: 600;
      flex: 1;
      min-width: 4rem;
    }

    .head-summaries {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: .45rem .65rem;
      align-items: center;
      justify-content: flex-end;
    }

    .head-totals {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
    }

    .section-label {
      margin: 0;
      padding: .45rem .85rem 0;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .section-label.demerit { color: var(--serious); }
    .section-label.merit { color: var(--good); }

    .records {
      list-style: none;
      margin: 0;
      padding: .35rem .85rem .65rem;
    }

    .records + .section-label {
      border-top: 1px solid var(--border);
      padding-top: .55rem;
    }

    .record {
      padding: .6rem 0;
      border-bottom: 1px solid var(--border);
    }

    .record:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .record-top {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: .35rem .55rem;
      margin-bottom: .3rem;
    }

    .date {
      font-size: .82rem;
      font-weight: 600;
      color: var(--accent);
    }

    .event {
      font-size: .93rem;
      font-weight: 600;
    }

    .event.minor { color: var(--warn); }
    .event.major { color: var(--serious); }
    .event.merit { color: var(--good); }

    .meta {
      display: grid;
      gap: .2rem;
      font-size: .82rem;
      color: var(--muted);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: .25rem .5rem;
    }

    .meta-label {
      flex: none;
      font-weight: 600;
      color: var(--text);
    }

    .dates {
      display: flex;
      flex-wrap: wrap;
      gap: .25rem;
    }

    .date-tag {
      background: var(--warn-soft);
      color: var(--warn);
      padding: .05rem .35rem;
      border-radius: 4px;
      font-size: .78rem;
      font-weight: 600;
    }

    .record.major-record {
      background: var(--serious-soft);
      margin: 0 -.85rem;
      padding: .6rem .85rem;
    }

    .record.merit-record {
      background: var(--good-soft);
      margin: 0 -.85rem;
      padding: .6rem .85rem;
    }

    .counts {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
    }

    .count-tag {
      font-size: .75rem;
      font-weight: 600;
      padding: .1rem .4rem;
      border-radius: 4px;
      background: #f1f5f9;
      color: var(--muted);
    }

    .count-tag.on {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .count-tag.on.good {
      background: var(--good-soft);
      color: var(--good);
    }

    .empty, .error {
      padding: 1.5rem 1rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: var(--card);
    }

    .error { color: var(--serious); }
  </style>
</head>

    function num(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    }

    function parseDemeritRow(line) {
      const parts = line.split(",");
      const staff = (parts.pop() || "").trim();
      const demerit = parts.pop();
      const minorOffence = parts.pop();
      const majorOffence = parts.pop();
      const followUp = parts.pop();
      const klass = parts.shift();
      const no = parts.shift();
      const name = parts.shift();
      const date = parts.shift();
      const event = parts.shift();
      const notes = parts.filter((p) => p && p !== "-");

      return {
        type: "demerit",
        klass,
        no: Number(no),
        name,
        date,
        event,
        notes,
        followUp: followUp === "-" ? "" : followUp,
        majorOffence: num(majorOffence),
        minorOffence: num(minorOffence),
        demerit: num(demerit),
        staff,
        isMajor: event.includes("小過"),
      };
    }

    function parseMeritRow(line) {
      const parts = line.split(",");
      const staff = (parts.pop() || "").trim();
      const merit = parts.pop();
      const minorMerit = parts.pop();
      const majorMerit = parts.pop();
      const category = parts.pop();
      const source = parts.pop();
      const postNote = parts.pop();
      const content = parts.pop();
      const preNote = parts.pop();
      const date = parts.pop();
      const name = parts.pop();
      const no = parts.pop();
      const klass = parts.pop();
      parts.shift();

      return {
        type: "merit",
        klass,
        no: Number(no),
        name,
        date,
        content,
        preNote: preNote === "-" ? "" : preNote,
        postNote: postNote === "-" ? "" : postNote,
        source: source === "-" ? "" : source,
        category: category === "-" ? "" : category,
        majorMerit: num(majorMerit),
        minorMerit: num(minorMerit),
        merit: num(merit),
        staff,
      };
    }

    function parseRaw(text) {
      const demerits = [];
      const merits = [];
      let mode = null;

      for (const line of text.trim().split(/\r?\n/)) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        if (trimmed.startsWith("班別,班號,姓名,日期,事件")) {
          mode = "demerit";
          continue;
        }
        if (trimmed.startsWith("頁碼,班別,班號,姓名")) {
          mode = "merit";
          continue;
        }

        if (mode === "demerit") demerits.push(parseDemeritRow(trimmed));
        else if (mode === "merit") merits.push(parseMeritRow(trimmed));
      }

      return { demerits, merits };
    }

    function groupByStudent(demerits, merits) {
      const map = new Map();

      function ensure(row) {
        const key = row.no + "|" + row.name;
        if (!map.has(key)) {
          map.set(key, {
            no: row.no,
            name: row.name,
            klass: row.klass,
            demerits: [],
            merits: [],
          });
        }
        return map.get(key);
      }

      demerits.forEach((row) => ensure(row).demerits.push(row));
      merits.forEach((row) => ensure(row).merits.push(row));

      return [...map.values()].sort((a, b) => a.no - b.no);
    }

    function renderCount(label, value, good) {
      return `<span class="count-tag${value ? " on" + (good ? " good" : "") : ""}">${label} ${value}</span>`;
    }

    function sumDemeritTotals(records) {
      return records.reduce(
        (t, r) => ({
          majorOffence: t.majorOffence + r.majorOffence,
          minorOffence: t.minorOffence + r.minorOffence,
          demerit: t.demerit + r.demerit,
        }),
        { majorOffence: 0, minorOffence: 0, demerit: 0 }
      );
    }

    function sumMeritTotals(records) {
      return records.reduce(
        (t, r) => ({
          majorMerit: t.majorMerit + r.majorMerit,
          minorMerit: t.minorMerit + r.minorMerit,
          merit: t.merit + r.merit,
        }),
        { majorMerit: 0, minorMerit: 0, merit: 0 }
      );
    }

    function renderDemeritTotals(records) {
      const t = sumDemeritTotals(records);
      return `<div class="head-totals demerit">${renderCount("大過", t.majorOffence)}${renderCount("小過", t.minorOffence)}${renderCount("缺點", t.demerit)}</div>`;
    }

    function renderMeritTotals(records) {
      const t = sumMeritTotals(records);
      return `<div class="head-totals merit">${renderCount("大功", t.majorMerit, true)}${renderCount("小功", t.minorMerit, true)}${renderCount("優點", t.merit, true)}</div>`;
    }

    function renderStudentHeadTotals(student) {
      const parts = [
        student.demerits.length ? renderDemeritTotals(student.demerits) : "",
        student.merits.length ? renderMeritTotals(student.merits) : "",
      ].filter(Boolean).join("");
      return parts ? `<div class="head-summaries">${parts}</div>` : "";
    }

    function renderRowCounts(label, items, good) {
      const parts = items
        .filter((item) => item.value > 0)
        .map((item) => renderCount(item.label, item.value, good));
      if (!parts.length) return "";
      return `<div class="meta-row"><span class="meta-label">${label}</span><span class="counts">${parts.join("")}</span></div>`;
    }

    function renderDemerit(row) {
      const notesHtml = row.notes.length
        ? `<div class="meta-row"><span class="meta-label">相關日期</span><span class="dates">${row.notes.map((d) => `<span class="date-tag">${d}</span>`).join("")}</span></div>`
        : "";

      const followHtml = row.followUp
        ? `<div class="meta-row"><span class="meta-label">其他跟進</span><span>${row.followUp}</span></div>`
        : "";

      const staffHtml = row.staff
        ? `<div class="meta-row"><span class="meta-label">負責人</span><span>${row.staff}</span></div>`
        : "";

      const awardHtml = renderRowCounts("處分", [
        { label: "大過", value: row.majorOffence },
        { label: "小過", value: row.minorOffence },
        { label: "缺點", value: row.demerit },
      ], false);

      return `<li class="record${row.isMajor ? " major-record" : ""}">
        <div class="record-top">
          <span class="date">${row.date}</span>
          <span class="event ${row.isMajor ? "major" : "minor"}">${row.event}</span>
        </div>
        <div class="meta">${awardHtml}${notesHtml}${followHtml}${staffHtml}</div>
      </li>`;
    }

    function renderMerit(row) {
      const extra = [
        row.preNote && `<div class="meta-row"><span class="meta-label">前置</span><span>${row.preNote}</span></div>`,
        row.postNote && `<div class="meta-row"><span class="meta-label">後置</span><span>${row.postNote}</span></div>`,
        row.source && `<div class="meta-row"><span class="meta-label">出處</span><span>${row.source}</span></div>`,
        row.category && `<div class="meta-row"><span class="meta-label">類別</span><span>${row.category}</span></div>`,
      ].filter(Boolean).join("");

      const staffHtml = row.staff
        ? `<div class="meta-row"><span class="meta-label">負責人</span><span>${row.staff}</span></div>`
        : "";

      const awardHtml = renderRowCounts("獎勵", [
        { label: "大功", value: row.majorMerit },
        { label: "小功", value: row.minorMerit },
        { label: "優點", value: row.merit },
      ], true);

      const meta = [awardHtml, extra, staffHtml].filter(Boolean).join("");
      return `<li class="record merit-record">
        <div class="record-top">
          <span class="date">${row.date}</span>
          <span class="event merit">${row.content}</span>
        </div>
        ${meta ? `<div class="meta">${meta}</div>` : ""}
      </li>`;
    }

    function renderStudent(student) {
      const div = document.createElement("div");
      div.className = "student";
      div.dataset.no = student.no;
      div.dataset.name = student.name;
      div.dataset.hasDemerit = student.demerits.length ? "1" : "0";
      div.dataset.hasMerit = student.merits.length ? "1" : "0";

      const demeritSection = student.demerits.length
        ? `<p class="section-label demerit">懲罰</p><ul class="records">${student.demerits.map(renderDemerit).join("")}</ul>`
        : "";

      const meritSection = student.merits.length
        ? `<p class="section-label merit">優點</p><ul class="records">${student.merits.map(renderMerit).join("")}</ul>`
        : "";

      div.innerHTML = `
        <div class="student-head">
          <span class="no">${student.no}</span>
          <span class="name">${student.name}</span>
          ${renderStudentHeadTotals(student)}
        </div>
        ${demeritSection}
        ${meritSection}
      `;
      return div;
    }

    function applyFilters() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      let shown = 0;

      document.querySelectorAll(".student").forEach((el) => {
        const matchSearch = !q
          || el.dataset.name.toLowerCase().includes(q)
          || el.dataset.no.includes(q);
        const matchFilter = activeFilter === "all"
          || (activeFilter === "demerit" && el.dataset.hasDemerit === "1")
          || (activeFilter === "merit" && el.dataset.hasMerit === "1");
        const visible = matchSearch && matchFilter;
        el.classList.toggle("hidden", !visible);
        if (visible) shown += 1;
      });

      const total = allStudents.length;
      document.getElementById("summary").textContent = shown === total
        ? document.getElementById("summary").dataset.full
        : `${shown} / ${total} 位學生 · ${document.getElementById("summary").dataset.full}`;
    }

    function render(students, demeritCount, meritCount) {
      allStudents = students;
      const container = document.getElementById("students");
      container.innerHTML = "";

      students.forEach((student) => {
        container.appendChild(renderStudent(student));
      });

      const summary = `${students.length} 位學生 · ${demeritCount} 項懲罰 · ${meritCount} 項優點`;
      const summaryEl = document.getElementById("summary");
      summaryEl.textContent = summary;
      summaryEl.dataset.full = summary;
    }

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        applyFilters();
      });
    });

    document.getElementById("search").addEventListener("input", applyFilters);

    const { demerits, merits } = parseRaw(RAW);
    render(groupByStudent(demerits, merits), demerits.length, merits.length);
  </script>
