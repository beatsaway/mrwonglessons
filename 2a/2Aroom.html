<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2A Classroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #0b1020;
    }

    canvas {
      display: block;
    }

    .name-label {
      position: fixed;
      color: #ffffff;
      font-weight: 600;
      font-size: 11px;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      z-index: 10;
      user-select: none;
      cursor: pointer;
    }

    .star-panel {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 25;
      width: 100vw;
      max-height: 38vh;
      overflow: auto;
      padding: 8px 10px 10px;
      color: #f8fafc;
      background: rgba(2, 6, 23, 0.72);
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
      backdrop-filter: blur(2px);
    }

    .star-panel[hidden] {
      display: none;
    }

    .name-list-panel {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 35;
      width: min(420px, calc(100vw - 24px));
      max-height: 52vh;
      overflow: auto;
      padding: 10px 12px;
      color: #f8fafc;
      background: rgba(2, 6, 23, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 10px;
      backdrop-filter: blur(2px);
      user-select: text;
    }

    .name-list-panel[hidden] {
      display: none;
    }

    .name-list-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      align-items: center;
    }

    .name-list-item {
      display: inline-block;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.35;
      padding: 2px 4px;
      border-radius: 6px;
      color: #e2e8f0;
    }

    .name-list-item:hover {
      background: rgba(51, 65, 85, 0.9);
    }

    .star-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
    }

    .star-chip {
      display: inline-flex;
      align-items: center;
      gap: 0;
      min-height: 20px;
      font-size: 17px;
      line-height: 1.3;
      white-space: nowrap;
      padding: 1px 0;
    }

    .star-name {
      cursor: default;
      user-select: text;
      opacity: 0.95;
      font: inherit;
      line-height: inherit;
    }

    .star-name:hover {
      opacity: 0.95;
    }

    .star-bucket {
      display: inline;
      min-height: auto;
    }

    .star {
      cursor: pointer;
      user-select: text;
      line-height: inherit;
      display: inline;
      vertical-align: baseline;
      color: inherit;
      font: inherit;
    }

    .emoji-picker {
      position: fixed;
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: min(92vw, 420px);
      padding: 6px;
      background: rgba(2, 6, 23, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
    }

    .emoji-picker[hidden] {
      display: none;
    }

    .emoji-option {
      cursor: pointer;
      user-select: none;
      font-size: 16px;
      line-height: 1;
      padding: 3px 4px;
      border-radius: 6px;
    }

    .emoji-option:hover {
      background: rgba(51, 65, 85, 0.95);
    }

    .speed-panel {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 70;
      min-width: 260px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(2, 6, 23, 0.9);
      color: #e2e8f0;
      font-size: 14px;
      line-height: 1.35;
      backdrop-filter: blur(2px);
    }

    .speed-panel[hidden] {
      display: none;
    }

    .speed-panel .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .speed-panel .hint {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .speed-panel input[type="range"] {
      width: 100%;
    }

    .mc-popup {
      position: fixed;
      inset: 0;
      z-index: 55;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      background: rgba(2, 6, 23, 0.94);
      color: #f1f5f9;
      pointer-events: auto;
    }

    .mc-popup[hidden] {
      display: none;
    }

    .mc-popup__bar {
      flex-shrink: 0;
      width: 100%;
      height: 3px;
      background: rgba(148, 163, 184, 0.22);
    }

    .mc-popup__bar-fill {
      display: block;
      height: 100%;
      width: 100%;
      background: #fbbf24;
      transform-origin: left center;
      transition: width 0.12s linear;
    }

    .mc-popup--reveal .mc-popup__bar-fill {
      background: #86efac;
    }

    .mc-popup__main {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.35rem;
      width: min(56rem, 96vw);
      margin: 0 auto;
      min-height: 0;
      padding: 0.5rem 1rem 0.65rem;
      box-sizing: border-box;
      overflow: hidden;
    }

    .mc-popup__q-zh {
      margin: 0;
      font-size: clamp(1.65rem, 4.8vw, 2.4rem);
      font-weight: 700;
      line-height: 1.22;
    }

    .mc-popup__q-en {
      margin: 0 0 0.2rem;
      font-size: clamp(0.9rem, 2.1vw, 1.05rem);
      line-height: 1.25;
      color: #94a3b8;
    }

    .mc-choices {
      display: grid;
      gap: 0.32rem;
      margin-top: 0.15rem;
    }

    .mc-choice {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.42rem 0.65rem;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(30, 41, 59, 0.65);
      color: #f8fafc;
      font: inherit;
      font-size: clamp(1.12rem, 3.1vw, 1.55rem);
      font-weight: 550;
      line-height: 1.28;
      cursor: default;
      white-space: normal;
      word-break: break-word;
    }

    .mc-choice__en {
      display: block;
      margin-top: 0.08rem;
      font-size: 0.68em;
      font-weight: 400;
      line-height: 1.2;
      color: #94a3b8;
    }

    .mc-choice--correct {
      border: 2px solid #86efac;
      background: rgba(30, 41, 59, 0.65);
      color: #e2e8f0;
      box-shadow: 0 0 0 1px rgba(134, 239, 172, 0.35);
    }

    .mc-choice--correct .mc-choice__en {
      color: #94a3b8;
    }

  </style>
</head>
<body>
<div id="starPanel" class="star-panel" hidden>
  <div id="starGrid" class="star-grid"></div>
</div>
<div id="nameListPanel" class="name-list-panel" hidden>
  <div id="nameListGrid" class="name-list-grid"></div>
</div>
<div id="emojiPicker" class="emoji-picker" hidden></div>
<div id="speedPanel" class="speed-panel" hidden>
  <div class="row">
    <span>內容主題</span>
    <select id="readSetSelect" style="min-width:120px;"></select>
  </div>
  <div class="row" style="margin-top:10px;">
    <span>顯示語言順序</span>
    <select id="langOrderSelect" style="min-width:120px;">
      <option value="zh-first">中文先</option>
      <option value="en-first">English first</option>
    </select>
  </div>
  <div class="row">
    <span>文字顯示速度</span>
    <strong id="speedValue">120ms</strong>
  </div>
  <input id="speedSlider" type="range" min="30" max="300" step="1" value="120" />
  <div class="row" style="margin-top:10px;">
    <span>理解題時間</span>
    <strong id="mcQuizValue">20s</strong>
  </div>
  <input id="mcQuizSlider" type="range" min="20" max="60" step="1" value="20" />
  <div class="row" style="margin-top:10px;">
    <span>解說閱讀時間</span>
    <strong id="holdValue">10s</strong>
  </div>
  <input id="holdSlider" type="range" min="5" max="60" step="1" value="10" />
  <div class="row" style="margin-top:10px;">
    <span>字元旋轉效果</span>
    <input id="charRotateToggle" type="checkbox" checked />
  </div>
  <div class="row" style="margin-top:10px;">
    <span>連續旋轉動畫</span>
    <input id="rotateAnimToggle" type="checkbox" checked />
  </div>
  <div class="row" style="margin-top:10px;">
    <span>顯示牆上標語</span>
    <input id="sloganToggle" type="checkbox" checked />
  </div>
  <div class="hint">按 M。理解題 20–60s（預設 20s）→ 答案 5s → 板書解說 5–60s（預設 10s）</div>
</div>
<div id="mcPopup" class="mc-popup" hidden>
  <div class="mc-popup__bar" aria-hidden="true"><span id="mcCountdownBar" class="mc-popup__bar-fill"></span></div>
  <div class="mc-popup__main">
    <p id="mcQuestionZh" class="mc-popup__q-zh"></p>
    <p id="mcQuestionEn" class="mc-popup__q-en"></p>
    <div id="mcChoices" class="mc-choices"></div>
  </div>
</div>
<script src="./dailyread/dailyread.js"></script>
<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.183.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.183.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const DEFAULT_SEATING = [
      ["6 郭君鵬", "", "14 李一航", "11 簡愷佑", "", "35 蔡子萱", "7 何天恩", "", "36 方紫瑜", "30 張梓萱"],
      ["33 和仟惠", "", "9 黃詩茹", "4 莊曼妮", "", "15 李一鳴", "10 蔣少涵", "", "21 吴浣瑩", "28 余嘉浠"],
      ["12 梁柏宇", "", "22 肖辰臻", "29 曾嘉欣", "", "24 許學臻", "23 許繼耿", "", "5 封采", "37 邱若曦"],
      ["19 王復生", "", "17 蘇紫瑜", "27 易容妃", "", "26 姚銘", "16 呂錦峰", "", "1 陳政延", "31 鄭敬熹"],
      ["8 黃嘉樂", "", "3 陳思涵", "20 吳國豪", "", "2 陳錦賢", "13 李狄達", "", "34 林煜翔", "25 楊星睿"]
    ];

    const DESK_COLS = 10;
    const DESK_ROWS = 5;
    const SEAT_COUNT = DESK_COLS * DESK_ROWS;
    const studentNames = DEFAULT_SEATING.flat().map((s) => (s ?? "").trim());

    /** 0 = hide name tags (default), 1 = short labels, 2 = full names. Cycle with N. */
    let nameTagMode = 0;

    function rosterShortName(fullName) {
      const t = fullName.trim();
      const m = t.match(/^(\d+)\s+(.*)$/);
      if (!m) return t;
      const num = m[1];
      const after = m[2].replace(/\s/g, "");
      const han = after.match(/[\u4e00-\u9fff]/u);
      const surname = han ? han[0] : "";
      return surname ? `${num}${surname}同學` : `${num}同學`;
    }

    function rosterDisplayLabel(fullName) {
      const t = fullName.trim();
      if (!t) return "";
      if (nameTagMode === 0) return "";
      if (nameTagMode === 2) return t;
      return rosterShortName(t);
    }

    function panelDisplayLabel(fullName) {
      const shown = rosterDisplayLabel(fullName);
      if (shown) return shown;
      // Keep panel readable even when name labels are hidden (mode 0).
      return rosterShortName(fullName) || fullName.trim();
    }

    const tableColours = [
      "#b38653", "#ff8080", "#ffff80", "#ffc080", "#80ff80", "#8080ff", "#2b64f9"
    ];

    const SEAT_SPACING = { x: 1.51, z: 1.22 };
    const FRONT_ROW_Z = -0.5;
    const SEATING_Z_PUSH = 0.92;
    const avatarRelDesk = { x: 0, y: 0.07, z: 0.4 };

    const rosterNames = studentNames.filter((s) => s.trim().length > 0);
    const emojiOptions = ["⭐", "🔴", "🟢", "💬", "🤳", "👄", "🔇", "🚻", "📵", "🚫", "❓", "🔰"];
    const emojiMarks = new Map(rosterNames.map((name) => [name, []]));
    const SELECT_HIGHLIGHT = 0xfde047;
    const MIN_TYPE_DELAY_MS = 30;
    const MAX_TYPE_DELAY_MS = 300;
    const MIN_HOLD_SEC = 5;
    const MAX_HOLD_SEC = 60;
    const MIN_MC_QUIZ_SEC = 20;
    const MAX_MC_QUIZ_SEC = 60;
    const MC_REVEAL_MS = 5000;
    let typeDelayMs = 120;
    let holdDurationMs = 10000;
    let mcQuizDurationMs = 20000;
    let mcQuizUnlocked = false;
    let languageOrderMode = "en-first";
    let enableCharRotate = true;
    let enableRotateAnimation = true;
    const DEFAULT_DAILY_READ_TITLE = "你知道嗎？";
    const DEFAULT_DAILY_READ_TITLE_EN = "Did You Know?";
    const availableDailyReadSets =
      window.DAILY_READ_SETS && typeof window.DAILY_READ_SETS === "object"
        ? window.DAILY_READ_SETS
        : {};

    function normalizeDailyReadEntries(rawEntries, fallbackTitle, fallbackTitleEn) {
      return (Array.isArray(rawEntries) ? rawEntries : [])
        .map((entry) => {
          if (entry && typeof entry === "object") {
            return {
              title: String(entry.title || fallbackTitle).trim() || fallbackTitle,
              titleEn: String(entry.titleEn || fallbackTitleEn).trim() || fallbackTitleEn,
              answer: String(entry.answer || "").trim(),
              answerEn: String(entry.answerEn || "").trim(),
              explain: String(entry.explain || entry.fact || "").trim(),
              explainEn: String(entry.explainEn || entry.factEn || "").trim(),
              fact: String(entry.explain || entry.fact || "").trim(),
              factEn: String(entry.explainEn || entry.factEn || "").trim(),
              mc: entry.mc && typeof entry.mc === "object" ? entry.mc : null
            };
          }
          if (typeof entry === "string") {
            return {
              title: fallbackTitle,
              titleEn: fallbackTitleEn,
              fact: entry.trim(),
              factEn: ""
            };
          }
          return null;
        })
        .filter((entry) => entry && (entry.explain || entry.fact).length > 0);
    }

    function entriesFromSetKey(setKey) {
      const set = availableDailyReadSets[setKey];
      if (set && typeof set === "object") {
        const fallbackTitle =
          String(set.title || DEFAULT_DAILY_READ_TITLE).trim() || DEFAULT_DAILY_READ_TITLE;
        const fallbackTitleEn =
          String(set.titleEn || DEFAULT_DAILY_READ_TITLE_EN).trim() || DEFAULT_DAILY_READ_TITLE_EN;
        const sourceEntries = Array.isArray(set.entries)
          ? set.entries
          : (Array.isArray(set.facts) ? set.facts : []).map((fact) => ({
              title: fallbackTitle,
              titleEn: fallbackTitleEn,
              fact
            }));
        return normalizeDailyReadEntries(sourceEntries, fallbackTitle, fallbackTitleEn);
      }

      if (Array.isArray(window.DAILY_READ_ENTRIES) && window.DAILY_READ_ENTRIES.length) {
        return normalizeDailyReadEntries(
          window.DAILY_READ_ENTRIES,
          DEFAULT_DAILY_READ_TITLE,
          DEFAULT_DAILY_READ_TITLE_EN
        );
      }

      const fallbackTitle =
        typeof window.DAILY_READ_TITLE === "string" && window.DAILY_READ_TITLE.trim()
          ? window.DAILY_READ_TITLE.trim()
          : DEFAULT_DAILY_READ_TITLE;
      const fallbackFacts = Array.isArray(window.DAILY_READ_FACTS) ? window.DAILY_READ_FACTS : [];
      return fallbackFacts
        .map((fact) => String(fact || "").trim())
        .filter((fact) => fact.length > 0)
        .map((fact) => ({
          title: fallbackTitle,
          titleEn: DEFAULT_DAILY_READ_TITLE_EN,
          fact,
          factEn: ""
        }));
    }

    const defaultDailyReadSetKey =
      (typeof window.DAILY_READ_ACTIVE_SET === "string" && window.DAILY_READ_ACTIVE_SET) ||
      Object.keys(availableDailyReadSets)[0] ||
      "living_f2";
    let currentDailyReadSetKey = defaultDailyReadSetKey;

    function enrichDailyReadEntries(entries) {
      let list = Array.isArray(entries) ? entries : [];
      if (typeof window.prepareDailyReadEntriesForReading === "function") {
        list = window.prepareDailyReadEntriesForReading(list);
      } else if (typeof window.standardizeDailyReadEntriesForReading === "function") {
        list = window.standardizeDailyReadEntriesForReading(list);
      }
      if (typeof window.enrichDailyReadEntriesWithMc === "function") {
        list = window.enrichDailyReadEntriesWithMc(list);
      }
      return list;
    }

    let dailyReadEntries = enrichDailyReadEntries(entriesFromSetKey(currentDailyReadSetKey));

    function randomBrightColor() {
      return new THREE.Color(Math.random(), Math.random(), Math.random());
    }

    function colorDistance(a, b) {
      const dr = a.r - b.r;
      const dg = a.g - b.g;
      const db = a.b - b.b;
      return Math.sqrt(dr * dr + dg * dg + db * db);
    }

    function randomDistinctColor(baseColor, minDistance = 0.45) {
      let next = randomBrightColor();
      let tries = 0;
      while (colorDistance(next, baseColor) < minDistance && tries < 20) {
        next = randomBrightColor();
        tries += 1;
      }
      return next;
    }

    function createDeskAndChair(colourHex) {
      const root = new THREE.Group();
      const wood = new THREE.MeshLambertMaterial({
        color: new THREE.Color(colourHex)
      });
      const darkWood = new THREE.MeshLambertMaterial({ color: 0x5c4033 });

      const top = new THREE.Mesh(
        new THREE.BoxGeometry(1.15, 0.09, 0.62),
        wood
      );
      top.position.y = 0.72;
      top.castShadow = true;
      root.add(top);

      const legGeom = new THREE.BoxGeometry(0.07, 0.62, 0.07);
      const legPositions = [
        { x: -0.5, z: 0.26 },
        { x: -0.5, z: -0.26 },
        { x: 0.5, z: 0.26 },
        { x: 0.5, z: -0.26 }
      ];
      for (const pos of legPositions) {
        const leg = new THREE.Mesh(legGeom, darkWood);
        leg.position.set(pos.x, 0.36, pos.z);
        leg.castShadow = true;
        root.add(leg);
      }

      const chairSeat = new THREE.Mesh(
        new THREE.BoxGeometry(0.52, 0.08, 0.48),
        wood
      );
      chairSeat.position.set(0, 0.42, 0.52);
      chairSeat.castShadow = true;
      root.add(chairSeat);

      const chairBack = new THREE.Mesh(
        new THREE.BoxGeometry(0.52, 0.55, 0.07),
        wood
      );
      chairBack.position.set(0, 0.72, 0.78);
      chairBack.castShadow = true;
      root.add(chairBack);

      const cLegGeom = new THREE.BoxGeometry(0.06, 0.38, 0.06);
      const cLegPos = [
        { x: -0.2, z: 0.35 },
        { x: 0.2, z: 0.35 },
        { x: -0.2, z: 0.68 },
        { x: 0.2, z: 0.68 }
      ];
      for (const pos of cLegPos) {
        const cl = new THREE.Mesh(cLegGeom, darkWood);
        cl.position.set(pos.x, 0.21, pos.z);
        cl.castShadow = true;
        root.add(cl);
      }

      return root;
    }

    function addOpenBookOnDesk(furnitureRoot) {
      const t = 0.014;
      const y = 0.72 + 0.09 / 2 + t / 2;
      const paper = new THREE.MeshLambertMaterial({ color: 0xfff8f0 });
      const spineMat = new THREE.MeshLambertMaterial({ color: 0x4a3728 });
      const pageW = 0.44;
      const pageD = 0.56;
      const g = 0.018;

      const book = new THREE.Group();
      book.position.set(0, y, -0.06);

      const L = new THREE.Mesh(new THREE.BoxGeometry(pageW, t, pageD), paper);
      L.position.set(-pageW / 2 - g / 2, 0, 0);
      const R = new THREE.Mesh(new THREE.BoxGeometry(pageW, t, pageD), paper);
      R.position.set(pageW / 2 + g / 2, 0, 0);
      const mid = new THREE.Mesh(
        new THREE.BoxGeometry(g + 0.02, t * 1.15, pageD * 0.96),
        spineMat
      );

      book.add(L, R, mid);
      furnitureRoot.add(book);
    }

    function createSeatedAvatar() {
      const group = new THREE.Group();
      const skin = randomBrightColor();
      const outfit = randomBrightColor();
      const pants = outfit.clone().multiplyScalar(0.72);

      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.72, 0.72, 0.72),
        new THREE.MeshLambertMaterial({ color: skin })
      );
      head.position.set(0, 1.14, -0.1);
      head.castShadow = true;
      head.userData.baseColorHex = head.material.color.getHex();
      group.add(head);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.62, 0.52, 0.42),
        new THREE.MeshLambertMaterial({ color: outfit })
      );
      body.position.set(0, 0.72, -0.04);
      body.rotation.x = THREE.MathUtils.degToRad(-16);
      body.castShadow = true;
      group.add(body);

      const armGeom = new THREE.BoxGeometry(0.2, 0.4, 0.22);
      const armMat = body.material;
      const armPitch = THREE.MathUtils.degToRad(-128);

      function addArm(side) {
        const armGroup = new THREE.Group();
        armGroup.position.set(side * 0.42, 0.66, 0.08);
        armGroup.rotation.x = armPitch;

        const arm = new THREE.Mesh(armGeom, armMat);
        arm.position.set(0, -0.2, 0);

    function createWhiteboardTexture() {

      function wrapTextByChars(text, charsPerLine, maxLines) {
        const lines = [];
        let i = 0;
        while (i < text.length && lines.length < maxLines) {
          const end = Math.min(text.length, i + charsPerLine);
          lines.push({ text: text.slice(i, end), start: i });
          i = end;
        }
        return lines;
      }

      function wrapTextByWords(text, charsPerLine, maxLines) {
        const words = Array.from(text.matchAll(/\S+/g)).map((m) => ({
          word: m[0],
          start: m.index || 0
        }));
        const lines = [];
        let line = "";
        let lineStart = 0;
        for (const item of words) {
          const word = item.word;
          if (!line) {
            line = word;
            lineStart = item.start;
            continue;
          }
          if (line.length >= charsPerLine) {
            lines.push({ text: line, start: lineStart });
            line = word;
            lineStart = item.start;
            if (lines.length >= maxLines) break;
          } else {
            line = line ? `${line} ${word}` : word;
          }
        }
        if (line && lines.length < maxLines) {
          lines.push({ text: line, start: lineStart });
        }
        return lines;
      }

      function hashString(text) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < text.length; i += 1) {
          h ^= text.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function random01FromSeed(seed) {
        let x = seed >>> 0;
        x ^= x << 13;
        x ^= x >>> 17;
        x ^= x << 5;
        return (x >>> 0) / 4294967295;
      }

      function currentFontPx() {
        const match = String(ctx.font || "").match(/(\d+(?:\.\d+)?)px/);
        return match ? Number(match[1]) : 48;
      }

      function drawTextLineWithOptionalRotation(
        text,
        x,
        y,
        sourceHash,
        startIndex = 0,
        options = {}
      ) {
        const hueByChar = !!options.hueByChar;
        const dynamicRotate = !!options.dynamicRotate && enableRotateAnimation;
        const rotateRateMs = Math.max(1, Number(options.rotateRateMs) || 90);
        if (!enableCharRotate && !hueByChar) {
          ctx.fillText(text, x, y);
          return;
        }

        const fontPx = currentFontPx();
        const pivotY = fontPx * 0.52;
        const timeBucket = dynamicRotate ? Math.floor(performance.now() / rotateRateMs) : 0;
        let cursorX = x;
        for (let i = 0; i < text.length; i += 1) {
          const ch = text[i];
          const w = Math.max(1, ctx.measureText(ch).width);
          if (ch === " ") {
            cursorX += w;
            continue;
          }
          const absoluteIndex = startIndex + i;
          const staticSeed = sourceHash + absoluteIndex * 2654435761;
          const animatedSeed = staticSeed + timeBucket * 1013904223;
          const rRotate = random01FromSeed(animatedSeed);
          const deg = -4 + rRotate * 8;
          const rad = (deg * Math.PI) / 180;
          const baseFill = ctx.fillStyle;
          if (hueByChar) {
            const rHue = random01FromSeed(staticSeed);
            const hue = Math.round(rHue * 360);
            // Keep saturation/lightness fixed so brightness stays consistent.
            ctx.fillStyle = `hsla(${hue}, 95%, 30%, 0.92)`;
          }
          ctx.save();
          ctx.translate(cursorX + w / 2, y + pivotY);
          ctx.rotate(rad);
          ctx.fillText(ch, -w / 2, -pivotY);
          ctx.restore();
          if (hueByChar) {
            ctx.fillStyle = baseFill;
          }
          cursorX += w;
        }
      }

      function draw(

          const lineHZh = 74;

      function refillDeck() {
        state.deck = Array.from({ length: dailyReadEntries.length }, (_, i) => i);

        const next = dailyReadEntries[idx] || {};
        state.currentEntryIndex = idx;
        state.currentTitle = String(next.title || DEFAULT_DAILY_READ_TITLE);
        state.currentTitleEn = String(next.titleEn || DEFAULT_DAILY_READ_TITLE_EN);
        state.currentFact = String(next.explain || next.fact || "");
        state.currentFactEn = String(next.explainEn || next.factEn || "");
        state.shownTitleChars = 0;
        state.shownTitleEnChars = 0;
        state.shownChars = 0;
        state.shownCharsEn = 0;
        state.lastStepAtMs = nowMs;
        state.lastStepAtMsEn = nowMs;
        startEntryFlow(nowMs);
      }

      function pushHistoryIndex(idx) {
        if (state.historyCursor < state.history.length - 1) {
          state.history = state.history.slice(0, state.historyCursor + 1);
        }
        state.history.push(idx);
        state.historyCursor = state.history.length - 1;
      }

      function pickNextFact(nowMs) {
        if (!dailyReadEntries.length) {
          state.currentTitle = DEFAULT_DAILY_READ_TITLE;
          state.currentTitleEn = DEFAULT_DAILY_READ_TITLE_EN;
          state.currentFact = "";
          state.currentFactEn = "";
          state.shownTitleChars = 0;
          state.shownTitleEnChars = 0;
          state.shownChars = 0;
          state.shownCharsEn = 0;
          state.lastStepAtMs = nowMs;
          state.lastStepAtMsEn = nowMs;
          startTitleFlow(nowMs);
          return;
        }
        if (!state.deck.length) refillDeck();
        const idx = state.deck.pop();
        applyEntryByIndex(idx, nowMs);
        pushHistoryIndex(idx);
      }

      state.advance = (elapsedSec) => {
        const nowMs = elapsedSec * 1000;

        if (!state.initialized) {
          pickNextFact(nowMs);
          state.initialized = true;
        }

        if (state.segmentUntilMs > 0 && nowMs >= state.segmentUntilMs) {
          advancePhase(nowMs);
        } else if (
          state.phase === "titleZh" ||
          state.phase === "titleEn" ||
          state.phase === "factZh" ||
          state.phase === "factEn"
        ) {
          const titleText = String(state.currentTitle || "").trim();
          const titleEnText = String(state.currentTitleEn || "").trim();
          const factText = String(state.currentFact || "").replace(/\s+/g, " ").trim();
          const factEnText = String(state.currentFactEn || "").replace(/\s+/g, " ").trim();
          const stepMsZh = typeDelayMs;
          const stepMsEn = Math.max(1, Math.round(typeDelayMs / 2));

          if (state.phase === "titleZh") {
            if (!titleText.length) {
              state.phase = languageOrderMode === "en-first" ? "factEn" : "titleEn";
              if (state.phase === "titleEn") state.lastStepAtMsEn = nowMs;
              if (state.phase === "factEn") state.lastStepAtMsEn = nowMs;
            } else if (state.shownTitleChars >= titleText.length) {
              state.phase = languageOrderMode === "en-first" ? "factEn" : "titleEn";
              if (state.phase === "titleEn") state.lastStepAtMsEn = nowMs;
              if (state.phase === "factEn") state.lastStepAtMsEn = nowMs;
            } else if (nowMs - state.lastStepAtMs >= stepMsZh) {
              const steps = Math.floor((nowMs - state.lastStepAtMs) / stepMsZh);
              state.shownTitleChars = Math.min(titleText.length, state.shownTitleChars + steps);
              state.lastStepAtMs += steps * stepMsZh;
              if (state.shownTitleChars >= titleText.length) {
                state.phase = languageOrderMode === "en-first" ? "factEn" : "titleEn";
                if (state.phase === "titleEn") state.lastStepAtMsEn = nowMs;
                if (state.phase === "factEn") state.lastStepAtMsEn = nowMs;
              }
            }
          } else if (state.phase === "titleEn") {
            if (!titleEnText.length) {
              state.phase = languageOrderMode === "en-first" ? "titleZh" : "factZh";
              if (state.phase === "titleZh") state.lastStepAtMs = nowMs;
              if (state.phase === "factZh") state.lastStepAtMs = nowMs;
            } else if (state.shownTitleEnChars >= titleEnText.length) {
              state.phase = languageOrderMode === "en-first" ? "titleZh" : "factZh";
              if (state.phase === "titleZh") state.lastStepAtMs = nowMs;
              if (state.phase === "factZh") state.lastStepAtMs = nowMs;
            } else if (nowMs - state.lastStepAtMsEn >= stepMsEn) {
              const steps = Math.floor((nowMs - state.lastStepAtMsEn) / stepMsEn);
              state.shownTitleEnChars = Math.min(titleEnText.length, state.shownTitleEnChars + steps);
              state.lastStepAtMsEn += steps * stepMsEn;
              if (state.shownTitleEnChars >= titleEnText.length) {
                state.phase = languageOrderMode === "en-first" ? "titleZh" : "factZh";
                if (state.phase === "titleZh") state.lastStepAtMs = nowMs;
                if (state.phase === "factZh") state.lastStepAtMs = nowMs;
              }
            }
          } else if (state.phase === "factZh") {
            if (!factText.length) {
              state.phase = languageOrderMode === "en-first" ? "explainDwell" : "factEn";
              if (state.phase === "factEn") state.lastStepAtMsEn = nowMs;
              if (state.phase === "explainDwell") startExplainDwell(nowMs);
            } else if (nowMs - state.lastStepAtMs >= stepMsZh) {
              const steps = Math.floor((nowMs - state.lastStepAtMs) / stepMsZh);
              state.shownChars = Math.min(factText.length, state.shownChars + steps);
              state.lastStepAtMs += steps * stepMsZh;
              if (state.shownChars >= factText.length) {
                state.phase = languageOrderMode === "en-first" ? "explainDwell" : "factEn";
                if (state.phase === "factEn") state.lastStepAtMsEn = nowMs;
                if (state.phase === "explainDwell") startExplainDwell(nowMs);
              }
            }
          } else if (state.phase === "factEn") {
            if (!factEnText.length) {
              state.phase = languageOrderMode === "en-first" ? "factZh" : "explainDwell";
              if (state.phase === "factZh") state.lastStepAtMs = nowMs;
              if (state.phase === "explainDwell") startExplainDwell(nowMs);
            } else if (nowMs - state.lastStepAtMsEn >= stepMsEn) {
              const steps = Math.floor((nowMs - state.lastStepAtMsEn) / stepMsEn);
              state.shownCharsEn = Math.min(factEnText.length, state.shownCharsEn + steps);
              state.lastStepAtMsEn += steps * stepMsEn;
              if (state.shownCharsEn >= factEnText.length) {
                state.phase = languageOrderMode === "en-first" ? "factZh" : "explainDwell";
                if (state.phase === "factZh") state.lastStepAtMs = nowMs;
                if (state.phase === "explainDwell") startExplainDwell(nowMs);
              }
            }
          }
        }

        const showFactBody =
          state.phase === "factZh" ||
          state.phase === "factEn" ||
          state.phase === "explainDwell";

        draw(
          state.currentTitle,
          state.currentTitleEn,
          state.currentFact,
          state.currentFactEn,
          state.shownTitleChars,
          state.shownTitleEnChars,
          state.shownChars,
          state.shownCharsEn,
          showFactBody
        );
      };

      state.restartNow = (elapsedSec = 0) => {
        const nowMs = Math.max(0, elapsedSec * 1000);
        state.initialized = false;
        state.deck = [];
        state.history = [];
        state.historyCursor = -1;
        state.segmentUntilMs = 0;
        pickNextFact(nowMs);
        state.initialized = true;
      };

      state.nextEntry = (elapsedSec = 0) => {
        const nowMs = Math.max(0, elapsedSec * 1000);
        if (!dailyReadEntries.length) return;
        if (state.historyCursor < state.history.length - 1) {
          state.historyCursor += 1;
          const idx = state.history[state.historyCursor];
          applyEntryByIndex(idx, nowMs);
          return;
        }
        pickNextFact(nowMs);
      };

      state.prevEntry = (elapsedSec = 0) => {
        const nowMs = Math.max(0, elapsedSec * 1000);
        if (!dailyReadEntries.length) return;
        if (state.historyCursor <= 0) return;
        state.historyCursor -= 1;
        const idx = state.history[state.historyCursor];
        applyEntryByIndex(idx, nowMs);
      };

      state.getFlowState = () => ({
        phase: state.phase,
        segmentUntilMs: state.segmentUntilMs,
        entryIndex: state.currentEntryIndex,
        inMcPopup: state.phase === "mcQuiz" || state.phase === "mcReveal"
      });

      state.syncMcQuizTimer = (nowMs) => {
        if (state.phase === "mcQuiz") {
          state.segmentUntilMs = nowMs + mcQuizDurationMs;
        }
      };

      state.toggleMcQuiz = (elapsedSec = 0) => {
        const nowMs = Math.max(0, elapsedSec * 1000);
        mcQuizUnlocked = !mcQuizUnlocked;
        if (state.currentEntryIndex < 0) return mcQuizUnlocked;
        if (!mcQuizUnlocked) {
          if (state.phase === "mcQuiz" || state.phase === "mcReveal") {
            startTitleFlow(nowMs);
          }
          return mcQuizUnlocked;
        }

        const entry = dailyReadEntries[state.currentEntryIndex];
        const mc = entry?.mc;
        const hasMcChoices = !!(mc && Array.isArray(mc.choices) && mc.choices.length);
        if (hasMcChoices) startMcQuiz(nowMs);
        return mcQuizUnlocked;
      };

      draw(DEFAULT_DAILY_READ_TITLE, DEFAULT_DAILY_READ_TITLE_EN, "", "", null, null, null, null);
      return state;
    }

    const whiteboardRotator = createWhiteboardTexture();
    const mcPopup = document.getElementById("mcPopup");
    const mcQuestionZh = document.getElementById("mcQuestionZh");

    function updateMcPopup(elapsed) {
      if (!mcPopup || !whiteboardRotator?.getFlowState) {
        if (mcPopup) mcPopup.hidden = true;
        return;
      }

      const nowMs = elapsed * 1000;
      const flow = whiteboardRotator.getFlowState();
      if (!flow.inMcPopup || flow.entryIndex < 0) {
        mcPopup.hidden = true;
        mcRenderedEntryIndex = -1;
        return;
      }

      const entry = dailyReadEntries[flow.entryIndex];
      const mc = entry?.mc;
      if (!mc || !Array.isArray(mc.choices) || !mc.choices.length) {
        mcPopup.hidden = true;
        return;
      }

      mcPopup.hidden = false;
      const reveal = flow.phase === "mcReveal";
      mcPopup.classList.toggle("mc-popup--reveal", reveal);

      if (mcRenderedEntryIndex !== flow.entryIndex) {
        mcRenderedEntryIndex = flow.entryIndex;
        if (mcQuestionZh) mcQuestionZh.textContent = mc.question || "";
        if (mcQuestionEn) mcQuestionEn.textContent = mc.questionEn || "";
        if (mcChoices) {
          mcChoices.replaceChildren();
          mc.choices.forEach((choice, choiceIndex) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "mc-choice";
            btn.dataset.index = String(choiceIndex);
            const zh = document.createElement("span");
            zh.textContent = choice.zh || "";
            const en = document.createElement("span");
            en.className = "mc-choice__en";
            en.textContent = choice.en || "";
            btn.append(zh, en);
            mcChoices.appendChild(btn);
          });
        }
      }

      const segmentMs = reveal ? MC_REVEAL_MS : mcQuizDurationMs;
      const remainingMs = Math.max(0, flow.segmentUntilMs - nowMs);
      const pct = segmentMs > 0 ? (remainingMs / segmentMs) * 100 : 0;
      if (mcCountdownBar) mcCountdownBar.style.width = `${pct}%`;

      const buttons = mcChoices ? mcChoices.querySelectorAll(".mc-choice") : [];
      buttons.forEach((btn, choiceIndex) => {
        btn.classList.toggle("mc-choice--correct", reveal && choiceIndex === mc.correctIndex);
      });
    }

    function buildBookshelfWithSign() {
      const group = new THREE.Group();
      const W = 2.48;
      const D = 0.78;
      const H = 3.48;
      const thick = 0.055;
      const wood = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
      const woodDark = new THREE.MeshLambertMaterial({ color: 0x3d2814 });

      const leftSide = new THREE.Mesh(
        new THREE.BoxGeometry(thick, H, D),
        wood
      );
      leftSide.position.set(-W / 2 + thick / 2, H / 2, 0);
      leftSide.castShadow = true;
      const rightSide = new THREE.Mesh(
        new THREE.BoxGeometry(thick, H, D),
        wood
      );
      rightSide.position.set(W / 2 - thick / 2, H / 2, 0);
      rightSide.castShadow = true;
      const backPanel = new THREE.Mesh(
        new THREE.BoxGeometry(W, H, thick),
        woodDark
      );
      backPanel.position.set(0, H / 2, -D / 2 + thick / 2);
      backPanel.castShadow = true;
      group.add(leftSide, rightSide, backPanel);

      const shelfLevels = 5;
      const shelfGeom = new THREE.BoxGeometry(W - thick * 2.2, thick, D - 0.05);
      for (let i = 0; i < shelfLevels; i += 1) {
        const y = ((i + 1) / (shelfLevels + 1)) * H;
        const shelf = new THREE.Mesh(shelfGeom, wood);
        shelf.position.set(0, y, 0);
        shelf.castShadow = true;
        group.add(shelf);
      }

      const paperMat = new THREE.MeshLambertMaterial({ color: 0xede8dc });
      const paperEdgeMat = new THREE.MeshLambertMaterial({ color: 0xd4ccc0 });

      function createRealisticBook(baseHex, thickX, h, depthZ) {
        const book = new THREE.Group();
        const base = new THREE.Color(baseHex);
        base.offsetHSL(
          (Math.random() - 0.5) * 0.14,
          (Math.random() - 0.5) * 0.18,
          (Math.random() - 0.5) * 0.1
        );
        const colSpine = base.clone().multiplyScalar(0.85 + Math.random() * 0.12);
        const colCoverA = base.clone();
        colCoverA.offsetHSL(0, 0.06, 0.04);
        const colCoverB = base.clone().multiplyScalar(0.78 + Math.random() * 0.12);
        colCoverB.offsetHSL((Math.random() - 0.5) * 0.04, 0, -0.05);

        const spineMat = new THREE.MeshLambertMaterial({ color: colSpine });
        const coverMatA = new THREE.MeshLambertMaterial({ color: colCoverA });
        const coverMatB = new THREE.MeshLambertMaterial({ color: colCoverB });

        const coverThick = 0.022;
        const spineDepth = 0.02;

        const pageBlock = new THREE.Mesh(
          new THREE.BoxGeometry(thickX * 0.52, h * 0.84, depthZ * 0.66),
          paperMat
        );
        pageBlock.position.set(0, 0, -depthZ * 0.04);
        pageBlock.castShadow = true;

        const spine = new THREE.Mesh(
          new THREE.BoxGeometry(thickX * 0.96, h * 0.99, spineDepth),
          spineMat
        );
        spine.position.set(0, 0, depthZ / 2 - spineDepth / 2);
        spine.castShadow = true;

        const leftCover = new THREE.Mesh(
          new THREE.BoxGeometry(coverThick, h * 0.98, depthZ * 0.94),
          coverMatA
        );
        leftCover.position.set(-thickX / 2 + coverThick / 2, 0, 0);
        leftCover.castShadow = true;

        const rightCover = new THREE.Mesh(
          new THREE.BoxGeometry(coverThick, h * 0.98, depthZ * 0.94),
          coverMatB
        );
        rightCover.position.set(thickX / 2 - coverThick / 2, 0, 0);
        rightCover.castShadow = true;

        const topSheets = new THREE.Mesh(
          new THREE.BoxGeometry(thickX * 0.48, 0.024, depthZ * 0.58),
          paperEdgeMat
        );
        topSheets.position.set(0, h * 0.47, -depthZ * 0.04);
        topSheets.castShadow = true;

        book.add(pageBlock, spine, leftCover, rightCover, topSheets);
        return book;
      }

      const bookCols = [
        0x1e40af, 0x166534, 0x9a3412, 0x6b21a8, 0xb45309, 0x0f766e, 0x991b1b,
        0x0e7490, 0x4c1d95, 0x115e59, 0x7c2d12
      ];
      const booksPerRow = 12;
      const startX = -W / 2 + 0.18;
      const maxX = W / 2 - 0.14;
      for (let row = 0; row < shelfLevels; row += 1) {
        const shelfY = ((row + 1) / (shelfLevels + 1)) * H;
        let xCursor = startX;
        for (let k = 0; k < booksPerRow; k += 1) {
          const thickX = 0.038 + Math.random() * 0.032;
          const h = 0.27 + Math.random() * 0.16;
          const depthZ = 0.24 + Math.random() * 0.11;
          if (xCursor + thickX > maxX) break;

          const palette = bookCols[Math.floor(Math.random() * bookCols.length)];
          const book = createRealisticBook(palette, thickX, h, depthZ);
          book.position.set(
            xCursor + thickX / 2,
            shelfY + thick / 2 + h / 2,
            0.1
          );
          book.rotation.y = (Math.random() - 0.5) * 0.18;
          book.rotation.z = (Math.random() - 0.5) * 0.06;
          book.rotation.x = (Math.random() - 0.5) * 0.04;
          group.add(book);

          xCursor += thickX + 0.008 + Math.random() * 0.01;
        }
      }

      const signCanvas = document.createElement("canvas");
      signCanvas.width = 3200;
      signCanvas.height = 900;
      const sctx = signCanvas.getContext("2d");
      const signLine = "自助借還書";
      const pad = 32;
      const innerW = signCanvas.width - pad * 2;
      const innerH = signCanvas.height - pad * 2;
      const fontStack = '"Huninn", "Microsoft JhengHei", "PingFang TC", "Segoe UI", sans-serif';
      sctx.textAlign = "center";
      sctx.textBaseline = "middle";

      function drawShelfSign() {
        sctx.clearRect(0, 0, signCanvas.width, signCanvas.height);
        sctx.fillStyle = "#fffbeb";
        sctx.fillRect(0, 0, signCanvas.width, signCanvas.height);
        sctx.strokeStyle = "#a16207";
        sctx.lineWidth = 10;
        sctx.strokeRect(6, 6, signCanvas.width - 12, signCanvas.height - 12);

        function textFits(px) {
          sctx.font = `400 ${px}px ${fontStack}`;
          const m = sctx.measureText(signLine);
          const tw = m.width;
          const asc = m.actualBoundingBoxAscent ?? px * 0.55;
          const desc = m.actualBoundingBoxDescent ?? px * 0.45;
          return tw <= innerW && asc + desc <= innerH;
        }

        let lo = 64;
        let hi = Math.min(1600, innerH, Math.floor(innerW * 0.35));
        let fontPx = lo;
        while (lo <= hi) {
          const mid = Math.floor((lo + hi) / 2);
          if (textFits(mid)) {
            fontPx = mid;
            lo = mid + 1;
          } else {
            hi = mid - 1;
          }
        }

        sctx.font = `400 ${fontPx}px ${fontStack}`;
        sctx.fillStyle = "#422006";
        sctx.fillText(signLine, signCanvas.width / 2, signCanvas.height / 2);
      }

      drawShelfSign();

      const signTex = new THREE.CanvasTexture(signCanvas);
      signTex.colorSpace = THREE.SRGBColorSpace;
      signTex.needsUpdate = true;

      if (document.fonts && typeof document.fonts.load === "function") {
        document.fonts
          .load(`400 160px "Huninn"`)
          .then(() => {
            drawShelfSign();
            signTex.needsUpdate = true;
          })
          .catch(() => {});
      }

      const sign = new THREE.Mesh(
        new THREE.PlaneGeometry(5.15, 1.45),
        new THREE.MeshLambertMaterial({ map: signTex })
      );
      sign.scale.set(0.62, 0.62, 1);
      sign.position.set(-0.28, H + 0.58, D / 2 + 0.08);
      sign.rotation.x = THREE.MathUtils.degToRad(-16);
      group.add(sign);

      return group;
    }

        label.addEventListener("click", (e) => {
          e.stopPropagation();
          const slot = avatars[idx];
          const currentName = (slot?.name ?? "").trim();
          if (!currentName) return;
          showEmojiPicker(currentName, label);
        });
        document.body.appendChild(label);

        avatars.push({
          id: idx,
          col,
          row,
          name,
          furnitureRoot,
          avatarRoot,
          avatarMesh,
          headMesh,
          label,
          seatPick,
          home: { x, y: 0, z, rotationY: 0 }
        });
      }
    }

    const pickMeshes = avatars.map((a) => a.seatPick);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const selectedSlots = [];
    const starPanel = document.getElementById("starPanel");
    const starGrid = document.getElementById("starGrid");
    const nameListPanel = document.getElementById("nameListPanel");
    const nameListGrid = document.getElementById("nameListGrid");
    const emojiPicker = document.getElementById("emojiPicker");
    const speedPanel = document.getElementById("speedPanel");
    const readSetSelect = document.getElementById("readSetSelect");
    const speedSlider = document.getElementById("speedSlider");
    const speedValue = document.getElementById("speedValue");
    const mcQuizSlider = document.getElementById("mcQuizSlider");
    const mcQuizValue = document.getElementById("mcQuizValue");
    const holdSlider = document.getElementById("holdSlider");
    const holdValue = document.getElementById("holdValue");
    const charRotateToggle = document.getElementById("charRotateToggle");
    const rotateAnimToggle = document.getElementById("rotateAnimToggle");
    const sloganToggle = document.getElementById("sloganToggle");
    const langOrderSelect = document.getElementById("langOrderSelect");
    let starPanelVisible = false;
    let nameListPanelVisible = false;
    let pickerTargetName = "";

    function setTypeDelay(ms) {
      const n = Math.max(MIN_TYPE_DELAY_MS, Math.min(MAX_TYPE_DELAY_MS, Math.round(Number(ms) || 200)));
      typeDelayMs = n;
      if (speedSlider && Number(speedSlider.value) !== n) {
        speedSlider.value = String(n);
      }
      if (speedValue) {
        speedValue.textContent = `${n}ms`;
      }
    }

    function setMcQuizSeconds(sec) {
      const n = Math.max(MIN_MC_QUIZ_SEC, Math.min(MAX_MC_QUIZ_SEC, Math.round(Number(sec) || 20)));
      mcQuizDurationMs = n * 1000;
      if (mcQuizSlider && Number(mcQuizSlider.value) !== n) {
        mcQuizSlider.value = String(n);
      }
      if (mcQuizValue) {
        mcQuizValue.textContent = `${n}s`;
      }
      if (typeof whiteboardRotator?.syncMcQuizTimer === "function") {
        whiteboardRotator.syncMcQuizTimer(animClock.elapsedTime * 1000);
      }
    }

    function setHoldSeconds(sec) {
      const n = Math.max(MIN_HOLD_SEC, Math.min(MAX_HOLD_SEC, Math.round(Number(sec) || 10)));
      holdDurationMs = n * 1000;
      if (holdSlider && Number(holdSlider.value) !== n) {
        holdSlider.value = String(n);
      }
      if (holdValue) {
        holdValue.textContent = `${n}s`;
      }
    }

    function setCharRotateEnabled(enabled) {
      enableCharRotate = !!enabled;
      if (charRotateToggle) {
        charRotateToggle.checked = enableCharRotate;
      }
    }

    function setRotateAnimationEnabled(enabled) {
      enableRotateAnimation = !!enabled;
      if (rotateAnimToggle) {
        rotateAnimToggle.checked = enableRotateAnimation;
      }
    }

    function setLanguageOrder(mode) {
      languageOrderMode = mode === "en-first" ? "en-first" : "zh-first";
      if (langOrderSelect) {
        langOrderSelect.value = languageOrderMode;
      }
      if (whiteboardRotator && typeof whiteboardRotator.restartNow === "function") {
        whiteboardRotator.restartNow(animClock.elapsedTime);
      }
    }

    function setWallSloganVisible(visible) {
      wallSlogan.visible = !!visible;
      if (sloganToggle) {
        sloganToggle.checked = wallSlogan.visible;
      }
    }

    function toggleSpeedPanel() {
      if (!speedPanel) return;
      speedPanel.hidden = !speedPanel.hidden;
    }

    function setDailyReadSet(setKey) {
      const key = (setKey && availableDailyReadSets[setKey]) ? setKey : defaultDailyReadSetKey;
      currentDailyReadSetKey = key;
      dailyReadEntries = enrichDailyReadEntries(entriesFromSetKey(key));
      window.DAILY_READ_ACTIVE_SET = key;
      if (readSetSelect && readSetSelect.value !== key) {
        readSetSelect.value = key;
      }
      if (whiteboardRotator && typeof whiteboardRotator.restartNow === "function") {
        whiteboardRotator.restartNow(animClock.elapsedTime);
      }
    }

    function setupReadSetSelect() {
      if (!readSetSelect) return;
      const keys = Object.keys(availableDailyReadSets);
      if (!keys.length) {
        readSetSelect.hidden = true;
        return;
      }
      readSetSelect.replaceChildren();
      for (const key of keys) {
        const option = document.createElement("option");
        const set = availableDailyReadSets[key];
        option.value = key;
        option.textContent =
          (set && typeof set.title === "string" && set.title.trim()) || key;
        readSetSelect.appendChild(option);
      }
      readSetSelect.addEventListener("change", (event) => {
        setDailyReadSet(event.target.value);
      });
      setDailyReadSet(currentDailyReadSetKey);
    }

    if (speedSlider) {
      speedSlider.addEventListener("input", (event) => {
        setTypeDelay(event.target.value);
      });
    }
    if (mcQuizSlider) {
      mcQuizSlider.addEventListener("input", (event) => {
        setMcQuizSeconds(event.target.value);
      });
    }
    if (holdSlider) {
      holdSlider.addEventListener("input", (event) => {
        setHoldSeconds(event.target.value);
      });
    }
    if (charRotateToggle) {
      charRotateToggle.addEventListener("change", (event) => {
        setCharRotateEnabled(event.target.checked);
      });
    }
    if (rotateAnimToggle) {
      rotateAnimToggle.addEventListener("change", (event) => {
        setRotateAnimationEnabled(event.target.checked);
      });
    }
    if (langOrderSelect) {
      langOrderSelect.addEventListener("change", (event) => {
        setLanguageOrder(event.target.value);
      });
    }
    if (sloganToggle) {
      sloganToggle.addEventListener("change", (event) => {
        setWallSloganVisible(event.target.checked);
      });
    }
    setupReadSetSelect();
    setTypeDelay(typeDelayMs);
    setMcQuizSeconds(mcQuizDurationMs / 1000);
    setHoldSeconds(holdDurationMs / 1000);
    setCharRotateEnabled(enableCharRotate);
    setRotateAnimationEnabled(enableRotateAnimation);
    setWallSloganVisible(true);
    setLanguageOrder(languageOrderMode);

    function hideEmojiPicker() {
      pickerTargetName = "";
      if (emojiPicker) emojiPicker.hidden = true;
    }

    function ensureEmojiPickerContent() {
      if (!emojiPicker || emojiPicker.childElementCount > 0) return;
      for (const emoji of emojiOptions) {
        const option = document.createElement("span");
        option.className = "emoji-option";
        option.textContent = emoji;
        option.title = `Add ${emoji}`;
        option.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!pickerTargetName) return;
          const marks = emojiMarks.get(pickerTargetName) || [];
          marks.push(emoji);
          emojiMarks.set(pickerTargetName, marks);
          renderStarPanel();
          hideEmojiPicker();
        });
        emojiPicker.appendChild(option);
      }
    }

    function showEmojiPicker(name, anchorEl) {
      if (!emojiPicker || !anchorEl) return;
      pickerTargetName = name;
      ensureEmojiPickerContent();
      emojiPicker.hidden = false;
      const rect = anchorEl.getBoundingClientRect();
      const pickerW = Math.min(window.innerWidth - 12, 420);
      let left = rect.left;
      let top = rect.bottom + 6;
      if (left + pickerW > window.innerWidth - 8) left = window.innerWidth - pickerW - 8;
      if (left < 8) left = 8;
      if (top > window.innerHeight - 48) top = Math.max(8, rect.top - 54);
      emojiPicker.style.left = `${Math.round(left)}px`;
      emojiPicker.style.top = `${Math.round(top)}px`;
    }

    function slotFromObject3D(obj) {
      let o = obj;
      while (o) {
        if (typeof o.userData?.slotIndex === "number") {
          return avatars[o.userData.slotIndex];
        }
        o = o.parent;
      }
      return null;
    }

    function setAvatarSelectTint(slot, on) {
      if (!slot?.avatarMesh) return;
      slot.avatarMesh.traverse((node) => {
        if (!node.isMesh || !node.material) return;
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        for (const mat of mats) {
          if (!mat || !mat.color || typeof mat.color.getHex !== "function") continue;
          mat.userData = mat.userData || {};
          if (mat.userData.baseColorHex === undefined) {
            mat.userData.baseColorHex = mat.color.getHex();
          }
          mat.color.setHex(on ? SELECT_HIGHLIGHT : mat.userData.baseColorHex);
        }
      });
    }

    function setSlotSelectVisual(slot, on) {
      if (!slot) return;
      if (slot.avatarMesh) {
        setAvatarSelectTint(slot, on);
      } else {
        const s = on ? 1.07 : 1;
        slot.seatPick.scale.setScalar(s);
      }
    }

    function renderStarPanel() {
      if (!starGrid) return;
      starGrid.replaceChildren();
      const taggedNames = rosterNames.filter((name) => (emojiMarks.get(name) || []).length > 0);
      for (const name of taggedNames) {
        const chip = document.createElement("span");
        chip.className = "star-chip";

        const nameEl = document.createElement("span");
        nameEl.className = "star-name";
        nameEl.textContent = panelDisplayLabel(name);

        const bucket = document.createElement("span");
        bucket.className = "star-bucket";
        bucket.title = "Click an emoji to remove it";
        const marks = emojiMarks.get(name) || [];
        marks.forEach((emoji, idx) => {
          const star = document.createElement("span");
          star.className = "star";
          star.textContent = emoji;
          star.addEventListener("click", (e) => {
            e.stopPropagation();
            const next = (emojiMarks.get(name) || []).slice();
            next.splice(idx, 1);
            emojiMarks.set(name, next);
            renderStarPanel();
          });
          bucket.appendChild(star);
        });

        chip.append(nameEl, bucket);
        starGrid.appendChild(chip);
      }
    }

    function setStarPanelVisible(show) {
      starPanelVisible = show;
      if (starPanel) {
        starPanel.hidden = !show;
      }
      if (!show) {
        hideEmojiPicker();
      }
      if (show) renderStarPanel();
    }

    function renderNameListPanel() {
      if (!nameListGrid) return;
      nameListGrid.replaceChildren();
      for (const name of rosterNames) {
        const nameEl = document.createElement("span");
        nameEl.className = "name-list-item";
        nameEl.textContent = panelDisplayLabel(name);
        nameEl.title = "Click to choose emoji";
        nameEl.addEventListener("click", (event) => {
          event.stopPropagation();
          showEmojiPicker(name, nameEl);
        });
        nameListGrid.appendChild(nameEl);
      }
    }

    function setNameListPanelVisible(show) {
      nameListPanelVisible = show;
      if (nameListPanel) {
        nameListPanel.hidden = !show;
      }
      if (show) {
        renderNameListPanel();
      } else {
        hideEmojiPicker();
      }
    }

    function syncSlotOccupancyVisual(slot) {
      const occ = slot.name.trim().length > 0;
      slot.furnitureRoot.visible = occ;
    }

    function syncSlotLabel(slot) {
      const occupied = slot.name.trim().length > 0;
      slot.label.textContent = occupied ? rosterDisplayLabel(slot.name) : "";
      slot.label.style.display = occupied && nameTagMode !== 0 ? "block" : "none";
    }

    function toggleOrCommitSelection(slot) {
      if (!slot) {
        return;
      }

      const i = selectedSlots.indexOf(slot);
      if (i !== -1) {
        setSlotSelectVisual(slot, false);
        selectedSlots.splice(i, 1);
        return;
      }

      selectedSlots.push(slot);
      setSlotSelectVisual(slot, true);

      if (selectedSlots.length === 2) {
        const a = selectedSlots[0];
        const b = selectedSlots[1];
        setSlotSelectVisual(a, false);
        setSlotSelectVisual(b, false);
        selectedSlots.length = 0;
        swapSeats(a, b);
      }
    }

    function swapSeats(slotA, slotB) {
      if (!slotA || !slotB || slotA === slotB) return;

      const tName = slotA.name;
      slotA.name = slotB.name;
      slotB.name = tName;

      const meshA = slotA.avatarMesh;
      const meshB = slotB.avatarMesh;

      if (meshA) slotA.avatarRoot.remove(meshA);
      if (meshB) slotB.avatarRoot.remove(meshB);
      if (meshB) slotA.avatarRoot.add(meshB);
      if (meshA) slotB.avatarRoot.add(meshA);

      const headA = slotA.headMesh;
      const headB = slotB.headMesh;

      slotA.avatarMesh = meshB;
      slotB.avatarMesh = meshA;
      slotA.headMesh = headB;
      slotB.headMesh = headA;

      if (slotA.avatarMesh) slotA.avatarMesh.rotation.y = Math.PI;
      if (slotB.avatarMesh) slotB.avatarMesh.rotation.y = Math.PI;

      syncSlotLabel(slotA);
      syncSlotLabel(slotB);
      syncSlotOccupancyVisual(slotA);
      syncSlotOccupancyVisual(slotB);
    }

    function resetSeatsToDefault() {
      for (const s of selectedSlots) {
        setSlotSelectVisual(s, false);
      }
      selectedSlots.length = 0;

      const byName = new Map();
      for (const slot of avatars) {
        const name = slot.name.trim();
        if (name && slot.avatarMesh) {
          byName.set(name, { mesh: slot.avatarMesh, head: slot.headMesh });
          slot.avatarRoot.remove(slot.avatarMesh);
        }
        slot.avatarMesh = null;
        slot.headMesh = null;
      }

      for (let idx = 0; idx < avatars.length; idx += 1) {
        const slot = avatars[idx];
        const defaultName = (studentNames[idx] ?? "").trim();
        slot.name = defaultName;

        if (defaultName) {
          let pair = byName.get(defaultName);
          if (!pair) {
            const seated = createSeatedAvatar();
            pair = { mesh: seated.group, head: seated.head };
          }
          slot.avatarMesh = pair.mesh;
          slot.headMesh = pair.head;
          slot.avatarRoot.add(slot.avatarMesh);
          slot.avatarMesh.rotation.y = Math.PI;
        }

        syncSlotLabel(slot);
        syncSlotOccupancyVisual(slot);
      }
    }

    function roundSeat(n) {
      return Math.round(n * 1000) / 1000;
    }

    function logAvatarSeating() {
      const rows = avatars.map((a) => ({
        id: a.id,
        col: a.col,
        row: a.row,
        name: a.name.trim() || "(empty)",
        x: roundSeat(a.avatarRoot.position.x),
        y: roundSeat(a.avatarRoot.position.y),
        z: roundSeat(a.avatarRoot.position.z)
      }));
      console.table(rows);
      console.log("avatar seating (JSON)", rows);
    }

    function logCameraSettings() {
      const p = camera.position;
      const t = controls.target;
      const snapshot = {
        position: {
          x: roundSeat(p.x),
          y: roundSeat(p.y),
          z: roundSeat(p.z)
        },
        target: {
          x: roundSeat(t.x),
          y: roundSeat(t.y),
          z: roundSeat(t.z)
        },
        fov: roundSeat(camera.fov),
        near: roundSeat(camera.near),
        far: roundSeat(camera.far)
      };
      console.log("camera settings", snapshot);
      return snapshot;
    }

    function onCanvasClick(event) {
      if (event.button !== undefined && event.button !== 0) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(pickMeshes, false);
      if (hits.length === 0) {
        return;
      }

      const slot = slotFromObject3D(hits[0].object);
      if (slot) {
        toggleOrCommitSelection(slot);
      }
    }

    renderer.domElement.addEventListener("click", onCanvasClick);

    document.addEventListener("keydown", (event) => {
      if (event.target.closest("input, textarea, select")) return;
      if (event.key === "c" || event.key === "C") {
        logAvatarSeating();
        logCameraSettings();
      }
      if (event.key === "n" || event.key === "N") {
        nameTagMode = (nameTagMode + 1) % 3;
        for (const a of avatars) {
          syncSlotLabel(a);
        }
        if (starPanelVisible) {
          renderStarPanel();
        }
      }
      if (event.key === "t" || event.key === "T") {
        setStarPanelVisible(!starPanelVisible);
      }
      if (event.key === "Enter") {
        event.preventDefault();
        setNameListPanelVisible(!nameListPanelVisible);
      }
      if (event.key === "r" || event.key === "R") {
        resetSeatsToDefault();
      }
      if (event.key === "Escape") {
        hideEmojiPicker();
        if (speedPanel && !speedPanel.hidden) speedPanel.hidden = true;
        if (nameListPanelVisible) setNameListPanelVisible(false);
      }
      if (event.key === "m" || event.key === "M") {
        toggleSpeedPanel();
      }
      if (event.key === "g" || event.key === "G") {
        if (whiteboardRotator && typeof whiteboardRotator.toggleMcQuiz === "function") {
          whiteboardRotator.toggleMcQuiz(animClock.elapsedTime);
        }
      }
      if (event.code === "Space") {
        event.preventDefault();
        toggleCameraView();
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        if (whiteboardRotator && typeof whiteboardRotator.nextEntry === "function") {
          whiteboardRotator.nextEntry(animClock.elapsedTime);
        }
      }
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        if (whiteboardRotator && typeof whiteboardRotator.prevEntry === "function") {
          whiteboardRotator.prevEntry(animClock.elapsedTime);
        }
      }
    });

    document.addEventListener("click", (event) => {
      const target = event.target;
      if (!target) return;
      if (
        emojiPicker &&
        !emojiPicker.hidden &&
        target !== emojiPicker &&
        !emojiPicker.contains(target)
      ) {
        hideEmojiPicker();
      }
    });

    function updateLabel(avatarObj) {
      if (nameTagMode === 0 || !avatarObj.name.trim()) {
        avatarObj.label.style.display = "none";
        return;
      }

      const root = avatarObj.avatarRoot;
      const pos = new THREE.Vector3(root.position.x, root.position.y + 1.48, root.position.z);
      pos.project(camera);

      if (pos.z > 1) {
        avatarObj.label.style.display = "none";
        return;
      }

      avatarObj.label.style.display = "block";
      avatarObj.label.style.left = `${(pos.x * 0.5 + 0.5) * window.innerWidth}px`;
      avatarObj.label.style.top = `${(-pos.y * 0.5 + 0.5) * window.innerHeight}px`;

      const distance = camera.position.distanceTo(root.position);
      const size = THREE.MathUtils.clamp(120 / distance, 6, 14);
      avatarObj.label.style.fontSize = `${size}px`;
      avatarObj.label.style.opacity = "0.6";
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function updateHeadIdle(slot, dt, elapsed) {
      if (!slot.headMesh) return;
      const h = slot.headMesh;
      let s = h.userData.nodState;
      if (!s) {
        s = {
          swayPhase: Math.random() * Math.PI * 2,
          swayHz: 0.07 + Math.random() * 0.07,
          nextNodAt: elapsed + 2 + Math.random() * 8,
          nodT: 0,
          nodDur: 0,
          nodAmp: 0,
          inNod: false
        };
        h.userData.nodState = s;
      }

      let rx = Math.sin(elapsed * s.swayHz + s.swayPhase) * 0.03;
      if (!s.inNod) {
        if (elapsed >= s.nextNodAt) {
          s.inNod = true;
          s.nodT = 0;
          s.nodDur = 0.32 + Math.random() * 0.38;
          s.nodAmp = THREE.MathUtils.degToRad(5 + Math.random() * 9);
        }
      } else {
        s.nodT += dt;
        const u = Math.min(1, s.nodT / s.nodDur);
        rx += Math.sin(u * Math.PI) * s.nodAmp;
        if (u >= 1) {
          s.inNod = false;
          s.nextNodAt = elapsed + 3 + Math.random() * 14;
        }
      }
      h.rotation.x = rx;
    }

    function tick() {
      const dt = animClock.getDelta();
      const elapsed = animClock.elapsedTime;
      controls.update();
      whiteboardRotator.advance(elapsed);
      updateMcPopup(elapsed);
      for (const a of avatars) {
        updateLabel(a);
        updateHeadIdle(a, dt, elapsed);
      }
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
