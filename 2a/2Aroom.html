<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2A Classroom</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #0b1020;
    }

    canvas {
      display: block;
    }

    .name-label {
      position: fixed;
      color: #ffffff;
      font-weight: 600;
      font-size: 11px;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      z-index: 10;
      user-select: none;
      cursor: pointer;
    }

    .star-panel {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 25;
      width: 100vw;
      max-height: 38vh;
      overflow: auto;
      padding: 8px 10px 10px;
      color: #f8fafc;
      background: rgba(2, 6, 23, 0.72);
      border-bottom: 1px solid rgba(148, 163, 184, 0.35);
      backdrop-filter: blur(2px);
    }

    .star-panel[hidden] {
      display: none;
    }

    .star-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
    }

    .star-chip {
      display: inline-flex;
      align-items: center;
      gap: 0;
      min-height: 20px;
      font-size: 17px;
      line-height: 1.3;
      white-space: nowrap;
      padding: 1px 0;
    }

    .star-name {
      cursor: default;
      user-select: text;
      opacity: 0.95;
      font: inherit;
      line-height: inherit;
    }

    .star-name:hover {
      opacity: 0.95;
    }

    .star-bucket {
      display: inline;
      min-height: auto;
    }

    .star {
      cursor: pointer;
      user-select: text;
      line-height: inherit;
      display: inline;
      vertical-align: baseline;
      color: inherit;
      font: inherit;
    }

    .emoji-picker {
      position: fixed;
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: min(92vw, 420px);
      padding: 6px;
      background: rgba(2, 6, 23, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
    }

    .emoji-picker[hidden] {
      display: none;
    }

    .emoji-option {
      cursor: pointer;
      user-select: none;
      font-size: 16px;
      line-height: 1;
      padding: 3px 4px;
      border-radius: 6px;
    }

    .emoji-option:hover {
      background: rgba(51, 65, 85, 0.95);
    }

  </style>
</head>
<body>
<div id="starPanel" class="star-panel" hidden>
  <div id="starGrid" class="star-grid"></div>
</div>
<div id="emojiPicker" class="emoji-picker" hidden></div>
<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.183.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.183.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    const DEFAULT_SEATING = [
      ["6 郭君鵬", "", "14 李一航", "11 簡愷佑", "", "35 蔡子萱", "7 何天恩", "", "36 方紫瑜", "30 張梓萱"],
      ["33 和仟惠", "", "9 黃詩茹", "4 莊曼妮", "", "15 李一鳴", "10 蔣少涵", "", "21 吴浣瑩", "28 余嘉浠"],
      ["12 梁柏宇", "", "22 肖辰臻", "29 曾嘉欣", "", "24 許學臻", "23 許繼耿", "", "5 封采", "37 邱若曦"],
      ["19 王復生", "", "17 蘇紫瑜", "27 易容妃", "", "26 姚銘", "16 呂錦峰", "", "1 陳政延", "31 鄭敬熹"],
      ["8 黃嘉樂", "", "3 陳思涵", "20 吳國豪", "", "2 陳錦賢", "13 李狄達", "", "34 林煜翔", "25 楊星睿"]
    ];

    const DESK_COLS = 10;
    const DESK_ROWS = 5;
    const SEAT_COUNT = DESK_COLS * DESK_ROWS;
    const studentNames = DEFAULT_SEATING.flat().map((s) => (s ?? "").trim());

    /** 0 = hide name tags (default), 1 = short labels, 2 = full names. Cycle with N. */
    let nameTagMode = 0;

    function rosterShortName(fullName) {
      const t = fullName.trim();
      const m = t.match(/^(\d+)\s+(.*)$/);
      if (!m) return t;
      const num = m[1];
      const after = m[2].replace(/\s/g, "");
      const han = after.match(/[\u4e00-\u9fff]/u);
      const surname = han ? han[0] : "";
      return surname ? `${num}${surname}同學` : `${num}同學`;
    }

    function rosterDisplayLabel(fullName) {
      const t = fullName.trim();
      if (!t) return "";
      if (nameTagMode === 0) return "";
      if (nameTagMode === 2) return t;
      return rosterShortName(t);
    }

    function panelDisplayLabel(fullName) {
      const shown = rosterDisplayLabel(fullName);
      if (shown) return shown;
      // Keep panel readable even when name labels are hidden (mode 0).
      return rosterShortName(fullName) || fullName.trim();
    }

    const tableColours = [
      "#b38653", "#ff8080", "#ffff80", "#ffc080", "#80ff80", "#8080ff", "#2b64f9"
    ];

    const SEAT_SPACING = { x: 1.51, z: 1.22 };
    const FRONT_ROW_Z = -0.5;
    const SEATING_Z_PUSH = 0.92;
    const avatarRelDesk = { x: 0, y: 0.07, z: 0.4 };

    const rosterNames = studentNames.filter((s) => s.trim().length > 0);
    const emojiOptions = ["⭐", "🔴", "🟢", "💬", "🤳", "👄", "🔇", "🚻", "⚠", "📵", "🚫", "❓", "🔰"];
    const emojiMarks = new Map(rosterNames.map((name) => [name, []]));
    const SELECT_HIGHLIGHT = 0xfde047; 
    const sportsDayFacts = [
  "馬拉松的起源其實是一場美麗的誤會。馬拉松項目源自公元前490年的馬拉松戰役。雅典軍隊擊敗波斯後，士兵菲迪皮德斯從馬拉松跑回雅典報捷，大喊「我們勝利了！」後隨即倒地身亡。然而，歷史學家考證指出，他當時跑的路程約為40公里，而非現今標準的42.195公里。現代馬拉松距離之所以定為42.195公里，是在1908年倫敦奧運會上，為配合英國皇室成員在溫莎城堡觀看比賽而特意延長的。",
  "古希臘的運動員曾經裸體參加跑步訓練與比賽。在古希臘，裸體運動被視為對神靈的致敬，也是展示人體之美的方式。希臘文中的「健身房」一詞正源於gymnos，意即「裸體」。運動員會在身上塗抹橄欖油，然後用金屬刮刀清除污垢與汗水，這既能減少衣物摩擦與悶熱不適，也被認為是對宙斯等神明的崇敬表現，體現了當時身心靈和諧的競技精神。",
  "中國古代曾經存在專門的「跑步郵差」。在周朝至清朝的驛站系統中，除了騎馬快遞外，也有徒步傳遞緊急文書的步遞人員。根據《宋史》記載，宋代步遞士兵每日可奔跑約50公里，沿途設有換班點與補給站，腰繫鈴鐺以警示路人讓道。這套人力網絡不僅是古代資訊傳遞的重要力量，也展現了當時對於耐力與效率的高度組織能力。",
  "維多利亞時代曾掀起「步行狂熱」。十九世紀英美流行職業步行競賽，選手需在室內六天內走完500英里，觀眾買票入場、下注觀賽，熱度堪比今日職業球賽。頂尖選手如愛德華・佩森・威斯頓備受崇拜，他們在鋪著軟墊的室內賽道連續奮戰近一週，睡眠與進食都壓縮到極限，這種賽事後來成為超耐力運動的重要前身。",
  "女性曾被田徑組織禁止參加長跑。1967年波士頓馬拉松上，凱瑟琳・斯威策以縮寫報名參賽，起跑後不久，主辦方人員試圖強行將她拉出賽道，這張對抗的畫面成為女性運動平權的經典影像。當時的輿論普遍認為女子長跑會損害生育健康，直到1984年女子馬拉松才正式進入奧運，標誌著運動場上的性別偏見逐步被打破。",
  "史上最長的耐力跑賽之一發生在十九世紀紐約六日賽。選手需在室內連續繞圈六天，睡眠與補給都被壓縮到極限，總距離可達500英里以上。觀眾購票入場，近距離觀察選手因極度疲勞而出現的幻覺、嘔吐與足部潰傷，這類賽事後來被視為現代超級馬拉松的雛形，說明人類對耐力極限有著長期的探索傳統。",
  "跑步曾是古埃及法老的重要儀式。法老要在特定節慶中奔跑一段固定路線，象徵對疆域的掌控與神授權力。考古浮雕顯示，這不只宗教象徵，也是一種對外展示「統治者依然強健」的政治表演。如果法老無法完成全程，便可能動搖臣民對其統治正當性的信任，可見跑步在當時已具備權力鞏固的功能。",
  "第一次世界大戰聖誕停火期間，前線士兵不只踢足球，還舉行短跑比賽。1914年平安夜，部分西歐戰場上的英德士兵自發停火，在無人地帶交換食物與香菸，並進行了簡易的短跑競賽。這段戰史常被引用來說明：即使在極端衝突與壕溝僵局下，體育仍可能成為人與人重新建立連結的語言，短暫喚回共同的人性。",
  "肯亞高地跑者的優勢不只來自基因。研究指出，高海拔生活提升了攜氧能力與紅血球數量，自幼長距離步行與跑步通學也建立了耐力基礎；再加上訓練文化中強調團體節奏跑、低強度恢復與社群支持，才形成穩定且長期的人才輸出。單純歸因於遺傳，往往忽略了社會支持與環境適應的關鍵角色。",
  "奧運火炬接力看似古老，其現代形式其實在1936年柏林奧運才首次出現。當時納粹政權為宣傳其意識形態，設計了從奧林匹亞傳遞至柏林的儀式。之後國際奧委會沿用並重新詮釋其象徵意義，加入和平、團結與傳承的價值，讓它逐漸脫離原始政治宣傳背景，成為全球共享的儀式，可見同一活動在不同時代可被賦予截然不同的內涵。",
  "日本驛傳文化重視接力與責任。箱根驛傳每年吸引數百萬觀眾，每位跑者承受的不只是體能壓力，還有「把接力帶交給下一棒」的心理使命感。掉帶、提前起跑或無法完成區段，都可能被視為對全隊的辜負。這種將個人榮辱與集體成敗緊密結合的精神，深刻影響了日本長跑文化，也解釋了為何驛傳在該國擁有超越一般體育賽事的社會地位。",
  "「四分鐘英里」曾被視為不可能突破的生理屏障。1954年班尼斯特以3分59.4秒完成後，僅僅46天後另一選手也成功突破，此後數年間超過十位跑者接連達標。這顯示心理門檻被打破後，訓練策略與信念會快速提升群體表現，也成為運動心理學中「自我設限」與「信念效應」的經典案例。",
  "印加帝國的查斯基信使依靠接力奔跑傳遞軍政情報。他們在安地斯山脈的驛站系統中分段接力，據記載甚至能在數日內將鮮魚從沿海送到內陸高地皇宮。這種高效率人力網絡在沒有現代交通、車輪與文字系統的條件下，僅靠記憶與體能便維繫了龐大帝國的訊息流通，展現了驚人的組織能力與社會分工。",
  "十九世紀的耐力賽常在室內繞圈進行，觀眾可近距離觀察選手疲勞、補給與策略。這類比賽沒有固定距離上限，而是以「誰能堅持最久」或「六日總距離最長」定勝負。它們為現代賽事的補給節奏、配速管理與恢復科學提供了早期經驗，也意外催生了運動營養學的初步探索，例如選手嘗試咖啡因、肉湯與按摩的效果記錄。",
  "「跑步高潮」在二十世紀末才被科學更完整解釋。長時間有氧運動可促使大腦釋放內啡肽與內源性大麻素，帶來愉悅感、焦慮下降與輕度鎮痛效果。但每個人出現門檻與強度反應並不相同，有些人從未體驗過，有些人在中等強度下便能進入這種狀態。研究也發現，群體跑步時社交互動可能進一步強化此效應。",
  "南極馬拉松顯示了極端環境對跑步策略的影響。地表摩擦低、氣溫常低於零下20度、強風與補給間隔過長，都與一般道路賽截然不同。參賽者需穿著防寒裝備與雪地專用鞋釘，調整步幅以避免滑倒，同時管理面罩結冰與飲水不凍結問題。完成比賽需要裝備管理、步態調整與心理韌性的綜合能力，也成為極限運動生理學的重要研究場域。",
  "「喪屍路跑」等趣味賽揭示了情境對運動表現的影響。參賽者需在被裝扮成喪屍的演員追逐下完成賽道，當人感受到後方壓力時，心率與爆發力可能瞬間提升，但也更容易出現前段過快、後段崩潰的配速錯誤。這類賽事間接印證了啟動反射與恐懼對運動輸出的雙面刃效應，同時也提醒跑者：情緒興奮時更需要守住既定節奏。",
  "跑鞋科技從帆布鞋走到碳板中底，關鍵在於能量回饋與步態穩定。早期帆布跑鞋僅提供極簡防護，1970年代起EVA中底與氣墊陸續出現，近年碳纖維板加上高回彈泡棉則能減少每一步的蹠屈耗能。新材料可改善跑步經濟性約2-4%，但真正成績提升仍需配合訓練量、恢復品質與技術動作，並非單純換鞋便能大幅進步。",
  "跑道材質也改寫了成績歷史。煤渣跑道時代，路面軟硬不均且雨天易積水，選手更重抓地與穩定，釘鞋長度可達15毫米以上。現代合成跑道（如蒙多跑道）提供一致反彈與排水，使短跑與中距離比賽表現更穩定、極端天氣影響較小，也間接推動了世界紀錄頻繁更迭，從設備面說明了為何不同時代的成績難以直接比較。",
  "接力賽最容易失誤的不是速度，而是交接節奏。視覺訊號、口令節拍與手部路徑若不一致，再快的個人能力也可能在接棒區流失甚至掉棒。頂尖接力隊透過反覆練習，建立固定的「預備—送出」口號與標誌物啟動點，使交接流程在壓力下依然自動化。這說明團隊運動中的流暢性，往往比單純的個人極速更能決定最終名次。",
  "4x100公尺接力的棒次安排是一門精密科學。第一棒通常選起跑反應最快、彎道技術穩定的選手，因為起跑與第一個彎道是建立節奏的關鍵。第二棒跑直線距離最長，需要具備絕對速度與維持速度的能力；第三棒是第二個彎道，要求彎道跑技術最好、能在彎道加速的選手；第四棒則交給心理素質最強、衝線能力最佳的選手，因為最後一棒常面臨被追趕或追趕對手的壓力，決勝時刻的心理穩定度往往比純粹的速度更重要。",
  "4x400公尺接力的棒次策略與短距離截然不同。第一棒需要速度與節奏感兼具的選手，因為要跑完整一圈且沒有領先參考點；第二棒通常是全隊實力最強的一棒，肩負拉開差距或追回劣勢的任務；第三棒常安排戰術執行力高的選手，能在最混亂的中段穩住局面；第四棒則由意志力最堅韌、能在疲勞下維持技術的選手擔任，因為400公尺後的疲勞會嚴重影響跑姿，最後200公尺往往是意志力而非速度的對決。",
  "接力賽中的接棒區長度僅有20公尺（從預跑標記到接力區末端），選手必須在30公尺的加速區內判斷啟動時機。如果前一棒過早到達，接棒者可能被迫在區外接棒而失格；如果啟動太晚，則可能在區內追不到而損失時間。頂尖隊伍將此誤差控制在0.1秒內，這需要數百次反覆練習建立的肌肉記憶與彼此信任，也解釋了為何更換任何一棒選手都可能需要重新磨合整套節奏。",
  "人類演化中的長距離奔跑能力，與散熱與步態穩定密切相關。汗腺散熱系統使人類可以在日間持續追逐獵物，足弓結構、跟腱彈性與頸韌帶穩定則提供了高效儲能與頭部減震。這些特徵在其他靈長類中並不完整，顯示耐力跑在狩採生活中扮演了關鍵角色，也是為何現代人類能在高溫下進行長時間中等強度移動的核心原因。",
  "與多數哺乳動物相比，人類在短距離爆發並不佔優，但在長時間中等強度移動上具有優勢。例如羚羊或兔子可輕易衝刺脫逃，但數公里後便需停下來散熱；人類則透過持續追蹤迫使獵物過熱衰竭。這也是為何耐力賽事更能體現人類的節奏控制與意志力，而非單純仰賴肌力或瞬發力。",
  "獵豹速度極快卻只能短時間維持，體溫急升後必須停止；狼與馬則具備較好耐力。不同動物的肌纖維比例（快縮 vs. 慢縮）與散熱系統（汗腺、喘氣方式）差異，正好對應短跑與耐力跑的生理分工概念。人類雖然絕對速度遠遜於獵豹，但在夏季午後的持續移動能力上反而能勝過許多更大型的哺乳類。",
  "乳酸不是單純「疲勞廢物」，它也是可再利用的能量中介。高強度跑步時乳酸堆積反映代謝壓力，但部分乳酸可經由血液運送至肝臟與心臟轉換為能量。透過間歇訓練可提升身體對乳酸的清除與再利用效率，這也是為何頂尖選手在高輸出下仍能維持穩定配速，而不是被「乳酸閾值」硬性限制。",
  "VO2max 代表最大攝氧能力，但比賽成績還受跑步經濟性與乳酸閾值影響。許多頂尖選手並非VO2max最高的運動員，卻能在高強度下維持更久，關鍵在於單位耗氧產生的速度與較高的乳酸清除效率。因此訓練除了提升攝氧峰值，更應重視長時間維持次高強度的能力，這也是中長跑訓練週期中的核心原則。",
  "步頻與步幅沒有絕對標準，最佳組合取決於身高、肌力與速度目標。常見建議步頻落在每分鐘170-190之間，但個別差異很大。訓練中常透過節拍器提示改善步頻，減少過大步幅帶來的煞車效應與衝擊負荷。關鍵不是追求某個固定數字，而是找到個人落地輕盈、重心穩定且髖關節伸展完整的經濟組合。",
  "穿戴裝置可追蹤心率、步頻、觸地時間與垂直振幅，讓跑者用數據調整訓練強度。重點不是追求「漂亮數字」，而是看長期趨勢與疲勞反應。例如垂直振幅過高（超過8-10公分）可能代表核心穩定不足，觸地時間過長則暗示發力效率下降。但這些指標應結合主觀疲勞感受，避免陷入僅以數據好壞論斷訓練成效的盲區。",
  "GPS手錶在高樓林立地區可能出現飄移，導致配速判斷誤差。常見情況是即時配速忽快忽慢，影響節奏穩定。高階訓練常結合跑道計時、功率計或心率區間，避免單一數據來源誤導。有些跑者會關閉即時配速，改以每公里分段檢視，減少數字波動造成的心理干擾。",
  "碳板跑鞋可提升推進效率，但也可能改變小腿與足底受力分配。剛性碳板與高回彈中底會減少腳踝蹠屈的需求，使負荷轉移至膝關節與髖屈肌。使用新鞋應循序適應，先從短距離或節奏跑開始，避免在高里程週突然更換造成過度使用傷害，例如脛後肌肌腱炎或足底筋膜不適。",
  "跑前動態暖身比靜態拉筋更能提升神經活化與關節活動。靜態拉筋反而可能暫時降低肌肉爆發力。短跑前常加入高抬腿、後踢腿與加速跑，讓身體逐步進入比賽節奏。一般長跑者也可進行馬克操或開合跳等動作，提升核心溫度與本體感覺，降低起跑後肌肉拉傷的風險。",
  "跑後恢復包含補水、醣原補充與低強度放鬆。研究顯示，運動後30至60分鐘內補充碳水與蛋白質（如3:1至4:1比例），可更有效支持肌肉修復與肝醣再合成。同時進行5-10分鐘極慢跑或步行，有助清除代謝廢物、逐步降低心率，避免突然靜止造成血液滯留與頭暈。",
  "睡眠是最被低估的訓練增益。深層睡眠期間，生長激素分泌有助組織修復與免疫調節；長期睡眠不足（少於6小時）會降低反應速度、增加主觀疲勞並提升受傷風險。許多頂尖耐力選手將每日8-10小時睡眠視為週期計畫的核心環節，其重要性不亞於里程與強度安排。",
  "青少年運動員的訓練重點應是動作質量與規律習慣，不宜只追求高強度。過早專項化（如全年僅練中長跑）可能提高過度使用傷害機率，並削弱長期運動動機。專家建議青少年時期應接觸多種運動，建立多元動作庫與協調能力，專項高強度訓練最好延至16歲後逐漸加重，以確保持續發展與降低早退率。",
  "比賽焦慮會影響呼吸節奏與肌肉張力，進而干擾配速。透過可重複的賽前流程，如固定熱身順序、口令與呼吸節拍（例如四步吸、兩步吐），可有效穩定心理狀態。認知重構技巧（將心跳加速解讀為「準備就緒」而非「緊張」）也被證實能降低焦慮對表現的負面影響。",
  "接力隊的默契可透過固定口令和視覺標記建立。例如接棒區前設置標誌點，待前一棒到達時接棒者才起跑。當交接流程足夠自動化，選手在壓力情境下也更能維持穩定表現，減少因回頭、猶豫或過早啟動造成的違規與時間損失。",
  "鞋底抓地紋路會影響彎道穩定與濕地表現。運動會遇到雨後場地時，鞋款與釘長選擇往往直接影響起跑與轉彎安全。短跑釘鞋常採用較尖的針釘以切入跑道，長跑釘鞋則多用餅乾釘或較短齒紋。一般路跑鞋的橡膠分佈與溝槽設計，也會大幅改變濕滑路面的信任感與落腳信心。",
  "運動科技中的影像分析可拆解跑姿細節。透過側面與後方慢動作錄影，教練能逐一檢視骨盆穩定、足部落點與擺臂角度，從「感覺」走向可驗證的技術修正。例如過度跨步往往伴隨明顯的煞車波與垂直振幅增加，調整後可降低膝關節衝擊並提升經濟性。",
  "群體競賽中的社會促進效應會提升輸出。身旁有人並肩或追趕時，跑者通常比單獨訓練更快，這與競爭激發、分散疲勞知覺有關。但也更需要配速紀律，否則容易被拉高至超出體能區間，導致後半段嚴重掉速。成熟跑者會選擇實力相近的集團，並守住預定配速而非盲目跟隨。",
  "歷史上許多校運會口號都圍繞紀律、尊重與合作。體育課的真正價值不只在名次或獎牌，而是把規則意識、勝不驕敗不餒與團隊責任帶回日常生活。從接力賽中的信任、長跑中的堅持到裁判判決的服從，這些經驗比單一項目的成績更能長久影響人格發展。",
  "現代恢復科技如冷熱交替、壓縮裝備與心率變異監測，可幫助掌握疲勞狀態。冷熱交替浴（如冷水10-15°C搭配溫水）能降低發炎反應，壓縮腿套則可促進靜脈回流。但最核心仍是訓練負荷管理與穩定作息，再先進的設備也無法取代合理訓練週期與充足的睡眠恢復。",
  "從生物力學角度看，落地時膝踝協調吸收衝擊可降低受傷風險。強化臀肌與核心（如橋式、鳥狗式、棒式）往往比單純增加跑量更能提升穩定性。常見的跑步相關傷害（髕骨股骨疼痛、脛骨內側壓力症候群）多與骨盆控制不足或髖外展肌無力有關，因此輔助肌力訓練應被視為耐力跑者的必要環節，而非可有可無的附加選項。"
];

    function randomBrightColor() {
      return new THREE.Color(Math.random(), Math.random(), Math.random());
    }

    function colorDistance(a, b) {
      const dr = a.r - b.r;
      const dg = a.g - b.g;
      const db = a.b - b.b;
      return Math.sqrt(dr * dr + dg * dg + db * db);
    }

    function randomDistinctColor(baseColor, minDistance = 0.45) {
      let next = randomBrightColor();
      let tries = 0;
      while (colorDistance(next, baseColor) < minDistance && tries < 20) {
        next = randomBrightColor();
        tries += 1;
      }
      return next;
    }

    function createSeatedAvatar() {
      const group = new THREE.Group();
      const skin = randomBrightColor();
      const outfit = randomBrightColor();
      const pants = outfit.clone().multiplyScalar(0.72);

      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.72, 0.72, 0.72),

      head.position.set(0, 1.14, -0.1);

      group.add(head);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.62, 0.52, 0.42),

      );
      body.position.set(0, 0.72, -0.04);
      body.rotation.x = THREE.MathUtils.degToRad(-16);
      body.castShadow = true;
      group.add(body);

      const armGeom = new THREE.BoxGeometry(0.2, 0.4, 0.22);
      const armMat = body.material;
      const armPitch = THREE.MathUtils.degToRad(-128);

      function addArm(side) {
        const armGroup = new THREE.Group();
        armGroup.position.set(side * 0.42, 0.66, 0.08);
        armGroup.rotation.x = armPitch;

        const arm = new THREE.Mesh(armGeom, armMat);
        arm.position.set(0, -0.2, 0);
        arm.castShadow = true;
        armGroup.add(arm);

        group.add(armGroup);
      }

      addArm(-1);
      addArm(1);

      const legGeom = new THREE.BoxGeometry(0.26, 0.36, 0.26);
      const legMat = new THREE.MeshLambertMaterial({ color: pants });
      const leftLeg = new THREE.Mesh(legGeom, legMat);
      const rightLeg = new THREE.Mesh(legGeom, legMat);
      leftLeg.position.set(-0.18, 0.44, 0.4);
      rightLeg.position.set(0.18, 0.44, 0.4);
      leftLeg.rotation.x = THREE.MathUtils.degToRad(-92);
      rightLeg.rotation.x = THREE.MathUtils.degToRad(-92);
      leftLeg.castShadow = true;
      rightLeg.castShadow = true;
      group.add(leftLeg, rightLeg);

      group.rotation.y = Math.PI;
      group.position.set(0, 0.04, 0.14);
      group.scale.setScalar(0.88);

      return { group, head };
    }

    function createWhiteboardTexture() {
      const canvas = document.createElement("canvas");
      const planeW = 18.9;
      const planeH = 4.2;
      const aspect = planeW / planeH;
      canvas.height = 640;
      canvas.width = Math.round(canvas.height * aspect);
      const ctx = canvas.getContext("2d");
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      const state = {
        texture: tex,
        deck: [],
        currentFact: "",
        shownChars: 0,
        lastStepAtMs: 0,
        holdUntilMs: 0,
        initialized: false
      };

      function draw(fullFact, shownChars = null) {
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#1e293b";
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";

        if (fullFact) {
          const charsPerLine = 38;
          const maxLines = 8;
          const compact = fullFact.replace(/\s+/g, " ").trim();
          const visibleCompact =
            shownChars == null ? compact : compact.slice(0, Math.max(0, shownChars));
          const title = "你知道嗎？";
          const lines = [];
          let i = 0;
          while (i < visibleCompact.length && lines.length < maxLines) {
            let end = Math.min(visibleCompact.length, i + charsPerLine);
            if (end < visibleCompact.length) {
              const nearPunc = visibleCompact.slice(i, end).search(/[，。；：！？]/g);
              if (nearPunc >= 0 && i + nearPunc + 1 > i + charsPerLine - 8) {
                end = i + nearPunc + 1;
              }
            }
            lines.push(visibleCompact.slice(i, end));
            i = end;
          }
          ctx.fillStyle = "#334155";
          ctx.font = '800 74px "Microsoft JhengHei", "PingFang TC", "Segoe UI", sans-serif';
          const x = canvas.width * 0.06;
          ctx.fillText(title, x, canvas.height * 0.24);

          ctx.font = '600 52px "Microsoft JhengHei", "PingFang TC", "Segoe UI", sans-serif';
          const lineH = 60;
          let y = canvas.height * 0.36;
          for (const line of lines) {
            ctx.fillText(line, x, y);
            y += lineH;
          }
        }
        tex.needsUpdate = true;
      }

      function refillDeck() {
        state.deck = Array.from({ length: sportsDayFacts.length }, (_, i) => i);
        for (let i = state.deck.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = state.deck[i];
          state.deck[i] = state.deck[j];
          state.deck[j] = t;
        }
      }

      function pickNextFact(nowMs) {
        if (!state.deck.length) refillDeck();
        const idx = state.deck.pop();
        state.currentFact = sportsDayFacts[idx] || "";
        state.shownChars = 0;
        state.lastStepAtMs = nowMs;
        state.holdUntilMs = 0;
      }

      state.advance = (elapsedSec) => {
        const nowMs = elapsedSec * 1000;

        if (!state.initialized) {
          pickNextFact(nowMs);
          state.initialized = true;
        }

        if (state.holdUntilMs > 0) {
          if (nowMs >= state.holdUntilMs) {
            pickNextFact(nowMs);
          }
        } else if (state.currentFact) {
          if (state.shownChars < state.currentFact.length && nowMs - state.lastStepAtMs >= 200) {
            const steps = Math.floor((nowMs - state.lastStepAtMs) / 200);
            state.shownChars = Math.min(state.currentFact.length, state.shownChars + steps);
            state.lastStepAtMs += steps * 200;
          }
          if (state.shownChars >= state.currentFact.length) {
            state.holdUntilMs = nowMs + 15000;
          }
        }

        draw(state.currentFact, state.shownChars);
      };

      draw("");
      return state;
    }

      function createRealisticBook(baseHex, thickX, h, depthZ) {

        colCoverB.offsetHSL((Math.random() - 0.5) * 0.04, 0, -0.05);

        const coverMatA = new THREE.MeshLambertMaterial({ color: colCoverA });

      const bookCols = [

      const signCanvas = document.createElement("canvas");

      const sctx = signCanvas.getContext("2d");

      sctx.fillRect(0, 0, signCanvas.width, signCanvas.height);

      sctx.lineWidth = 10;

      const signLine = "自助借還書";

      const fontStack = '"Microsoft JhengHei", "PingFang TC", "Segoe UI", sans-serif';
      sctx.textAlign = "center";
      sctx.textBaseline = "middle";

      function textFits(px) {
        sctx.font = `bold ${px}px ${fontStack}`;
        const m = sctx.measureText(signLine);
        const tw = m.width;
        const asc = m.actualBoundingBoxAscent ?? px * 0.55;
        const desc = m.actualBoundingBoxDescent ?? px * 0.45;
        return tw <= innerW && asc + desc <= innerH;

      let lo = 64;

      if (!slotA || !slotB || slotA === slotB) return;

      const tName = slotA.name;
      slotA.name = slotB.name;
      slotB.name = tName;

      const meshA = slotA.avatarMesh;
      const meshB = slotB.avatarMesh;

      if (meshA) slotA.avatarRoot.remove(meshA);
      if (meshB) slotB.avatarRoot.remove(meshB);
      if (meshB) slotA.avatarRoot.add(meshB);
      if (meshA) slotB.avatarRoot.add(meshA);

      const headA = slotA.headMesh;
      const headB = slotB.headMesh;

      slotA.avatarMesh = meshB;
      slotB.avatarMesh = meshA;
      slotA.headMesh = headB;
      slotB.headMesh = headA;

      if (slotA.avatarMesh) slotA.avatarMesh.rotation.y = Math.PI;
      if (slotB.avatarMesh) slotB.avatarMesh.rotation.y = Math.PI;

      syncSlotLabel(slotA);
      syncSlotLabel(slotB);
      syncSlotOccupancyVisual(slotA);
      syncSlotOccupancyVisual(slotB);
    }

    function resetSeatsToDefault() {
      for (const s of selectedSlots) {
        setSlotSelectVisual(s, false);
      }
      selectedSlots.length = 0;

      const byName = new Map();
      for (const slot of avatars) {
        const name = slot.name.trim();
        if (name && slot.avatarMesh) {
          byName.set(name, { mesh: slot.avatarMesh, head: slot.headMesh });
          slot.avatarRoot.remove(slot.avatarMesh);
        }
        slot.avatarMesh = null;
        slot.headMesh = null;
      }

      for (let idx = 0; idx < avatars.length; idx += 1) {
        const slot = avatars[idx];
        const defaultName = (studentNames[idx] ?? "").trim();
        slot.name = defaultName;

        if (defaultName) {
          let pair = byName.get(defaultName);
          if (!pair) {
            const seated = createSeatedAvatar();
            pair = { mesh: seated.group, head: seated.head };
          }
          slot.avatarMesh = pair.mesh;
          slot.headMesh = pair.head;
          slot.avatarRoot.add(slot.avatarMesh);
          slot.avatarMesh.rotation.y = Math.PI;
        }

        syncSlotLabel(slot);
        syncSlotOccupancyVisual(slot);
      }
    }

    function roundSeat(n) {
      return Math.round(n * 1000) / 1000;
    }

    function logAvatarSeating() {
      const rows = avatars.map((a) => ({
        id: a.id,
        col: a.col,
        row: a.row,
        name: a.name.trim() || "(empty)",
        x: roundSeat(a.avatarRoot.position.x),
        y: roundSeat(a.avatarRoot.position.y),
        z: roundSeat(a.avatarRoot.position.z)
      }));
      console.table(rows);
      console.log("avatar seating (JSON)", rows);
    }

    function logCameraSettings() {
      const p = camera.position;
      const t = controls.target;
      const snapshot = {
        position: {
          x: roundSeat(p.x),
          y: roundSeat(p.y),
          z: roundSeat(p.z)
        },
        target: {
          x: roundSeat(t.x),
          y: roundSeat(t.y),
          z: roundSeat(t.z)
        },
        fov: roundSeat(camera.fov),
        near: roundSeat(camera.near),
        far: roundSeat(camera.far)
      };
      console.log("camera settings", snapshot);
      return snapshot;
    }

    function onCanvasClick(event) {
      if (event.button !== undefined && event.button !== 0) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(pickMeshes, false);
      if (hits.length === 0) {
        return;
      }

      const slot = slotFromObject3D(hits[0].object);
      if (slot) {
        toggleOrCommitSelection(slot);
      }
    }

    renderer.domElement.addEventListener("click", onCanvasClick);

    document.addEventListener("keydown", (event) => {
      if (event.target.closest("input, textarea, select")) return;
      if (event.key === "c" || event.key === "C") {
        logAvatarSeating();
        logCameraSettings();
      }
      if (event.key === "n" || event.key === "N") {
        nameTagMode = (nameTagMode + 1) % 3;
        for (const a of avatars) {
          syncSlotLabel(a);
        }
        if (starPanelVisible) {
          renderStarPanel();
        }
      }
      if (event.key === "t" || event.key === "T") {
        setStarPanelVisible(!starPanelVisible);
      }
      if (event.key === "r" || event.key === "R") {
        resetSeatsToDefault();
      }
      if (event.key === "Escape") {
        hideEmojiPicker();
      }
    });

    document.addEventListener("click", (event) => {
      const target = event.target;
      if (!target) return;
      if (
        emojiPicker &&
        !emojiPicker.hidden &&
        target !== emojiPicker &&
        !emojiPicker.contains(target)
      ) {
        hideEmojiPicker();
      }
    });

    function updateLabel(avatarObj) {
      if (nameTagMode === 0 || !avatarObj.name.trim()) {
        avatarObj.label.style.display = "none";
        return;
      }

      const root = avatarObj.avatarRoot;
      const pos = new THREE.Vector3(root.position.x, root.position.y + 1.48, root.position.z);
      pos.project(camera);

      if (pos.z > 1) {
        avatarObj.label.style.display = "none";
        return;
      }

      avatarObj.label.style.display = "block";
      avatarObj.label.style.left = `${(pos.x * 0.5 + 0.5) * window.innerWidth}px`;
      avatarObj.label.style.top = `${(-pos.y * 0.5 + 0.5) * window.innerHeight}px`;

      const distance = camera.position.distanceTo(root.position);
      const size = THREE.MathUtils.clamp(120 / distance, 6, 14);
      avatarObj.label.style.fontSize = `${size}px`;
      avatarObj.label.style.opacity = "0.6";
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function updateHeadIdle(slot, dt, elapsed) {
      if (!slot.headMesh) return;
      const h = slot.headMesh;
      let s = h.userData.nodState;
      if (!s) {
        s = {
          swayPhase: Math.random() * Math.PI * 2,
          swayHz: 0.07 + Math.random() * 0.07,
          nextNodAt: elapsed + 2 + Math.random() * 8,
          nodT: 0,
          nodDur: 0,
          nodAmp: 0,
          inNod: false
        };
        h.userData.nodState = s;
      }

      let rx = Math.sin(elapsed * s.swayHz + s.swayPhase) * 0.03;
      if (!s.inNod) {
        if (elapsed >= s.nextNodAt) {
          s.inNod = true;
          s.nodT = 0;
          s.nodDur = 0.32 + Math.random() * 0.38;
          s.nodAmp = THREE.MathUtils.degToRad(5 + Math.random() * 9);
        }
      } else {
        s.nodT += dt;
        const u = Math.min(1, s.nodT / s.nodDur);
        rx += Math.sin(u * Math.PI) * s.nodAmp;
        if (u >= 1) {
          s.inNod = false;
          s.nextNodAt = elapsed + 3 + Math.random() * 14;
        }
      }
      h.rotation.x = rx;
    }

    function tick() {
      const dt = animClock.getDelta();
      const elapsed = animClock.elapsedTime;
      controls.update();
      whiteboardRotator.advance(elapsed);
      for (const a of avatars) {
        updateLabel(a);
        updateHeadIdle(a, dt, elapsed);
      }
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
