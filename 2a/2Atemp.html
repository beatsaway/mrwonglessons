<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2A 優點名單 by 代課黃老師</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #f7f9fc;
      color: #1f2937;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding-left: 8px;
      padding-right: 8px;
      padding-top: 44px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      padding: 6px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(4px);
      margin-bottom: 8px;
      font-size: 0.88rem;
      line-height: 1.2;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      border-radius: 0;
      margin: 0;
    }

    .title {
      font-weight: 700;
      color: #1e3a5f;
    }

    select {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 3px 6px;
      background: #fff;
      color: #1f2937;
      font: inherit;
    }

    #studentList {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    #studentList li {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.92rem;
      line-height: 1.4;
    }

    #studentList li.has-point {
      border-color: #f59e0b;
      background: #fff7e6;
    }

    .student-name {
      display: block;
    }

    .student-points {
      display: block;
      margin-top: 2px;
      font-size: 0.85rem;
      color: #6b7280;
    }

    #listMeta {
      margin-top: 8px;
      font-size: 0.88rem;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <main>
    <p class="topbar">
      <span class="title">2A 優點名單 by 代課黃老師</span>
      <label><input id="pointsOnlyCheckbox" type="checkbox" /> 只顯示有優點學生</label>
      <label>原因
        <select id="reasonFilter">
          <option value="">全部</option>
        </select>
      </label>
      <label>排序
        <select id="sortModeFilter">
          <option value="seats">按座位</option>
          <option value="points-asc">按優點(少至多)</option>
        </select>
      </label>
    </p>
    <ul id="studentList"></ul>
    <p id="listMeta"></p>
  </main>

  <script>
    const students = [
      "6 郭君鵬", "14 李一航", "11 簡愷佑", "35 蔡子萱", "7 何天恩", "36 方紫瑜", "30 張梓萱",
      "33 和仟惠", "9 黃詩茹", "4 莊曼妮", "15 李一鳴", "10 蔣少涵", "21 吴浣瑩", "28 余嘉浠",
      "12 梁柏宇", "22 肖辰臻", "29 曾嘉欣", "24 許學臻", "23 許繼耿", "5 封采", "37 邱若曦",
      "19 王復生", "17 蘇紫瑜", "27 易容妃", "26 姚銘", "16 呂錦峰", "1 陳政延", "31 鄭敬熹",
      "8 黃嘉樂", "3 陳思涵", "20 吳國豪", "2 陳錦賢", "13 李狄達", "34 林煜翔", "25 楊星睿"
    ];

    // 每一點都獨立存一筆，方便之後加入不同原因或時間。
    const achievementPoints = [
      { owner: 1, reason: "飛躍卡" },
      { owner: 2, reason: "飛躍卡" },
      { owner: 2, reason: "飛躍卡" },
      { owner: 3, reason: "飛躍卡" },
      { owner: 3, reason: "飛躍卡" },
      { owner: 4, reason: "飛躍卡" },

      { owner: 10, reason: "飛躍卡" },

      { owner: 25, reason: "飛躍卡" },

      { owner: 20, reason: "飛躍卡" },
      { owner: 20, reason: "飛躍卡" },

      { owner: 21, reason: "飛躍卡" },
      { owner: 27, reason: "飛躍卡" },
      { owner: 27, reason: "飛躍卡" },
      { owner: 27, reason: "飛躍卡" },
      { owner: 28, reason: "飛躍卡" },
      { owner: 28, reason: "飛躍卡" },
      { owner: 28, reason: "飛躍卡" },
      { owner: 28, reason: "飛躍卡" },
      { owner: 29, reason: "飛躍卡" },
      { owner: 29, reason: "飛躍卡" },
      { owner: 29, reason: "飛躍卡" },

      { owner: 35, reason: "飛躍卡" },
      { owner: 36, reason: "飛躍卡" },
      { owner: 16, reason: "其他" },
      { owner: 34, reason: "飛躍計劃" },

      { owner: 31, reason: "飛躍計劃" },
      { owner: 14, reason: "飛躍計劃" },
      { owner: 2, reason: "飛躍計劃" },
      { owner: 37, reason: "飛躍計劃" },
      { owner: 27, reason: "飛躍計劃" },
      { owner: 12, reason: "飛躍計劃" },
      { owner: 22, reason: "飛躍計劃" },
      { owner: 22, reason: "飛躍計劃" },
      { owner: 1, reason: "飛躍計劃" },

      { owner: 23, reason: "飛躍計劃" },
      { owner: 23, reason: "飛躍計劃" },
      { owner: 33, reason: "飛躍計劃" },
      { owner: 26, reason: "飛躍計劃" },
      { owner: 6, reason: "飛躍計劃" },
      { owner: 7, reason: "飛躍計劃" },
      { owner: 24, reason: "飛躍計劃" },
      { owner: 8, reason: "班長" },
      { owner: 28, reason: "班長" },
      { owner: 3, reason: "運動會接力裁判" },
      { owner: 5, reason: "運動會接力裁判" },
      { owner: 31, reason: "運動會接力裁判" },
      { owner: 12, reason: "運動會接力裁判" },
      { owner: 13, reason: "運動會接力裁判" },
      { owner: 13, reason: "運動會接力裁判" }
    ];

    const studentList = document.getElementById("studentList");
    const listMeta = document.getElementById("listMeta");
    const pointsOnlyCheckbox = document.getElementById("pointsOnlyCheckbox");
    const reasonFilter = document.getElementById("reasonFilter");
    const sortModeFilter = document.getElementById("sortModeFilter");

    function buildReasonOptions() {
      const reasonSet = new Set(achievementPoints.map((point) => point.reason));
      Array.from(reasonSet)
        .sort((a, b) => a.localeCompare(b, "zh-HK"))
        .forEach((reason) => {
          const option = document.createElement("option");
          option.value = reason;
          option.textContent = reason;
          reasonFilter.appendChild(option);
        });
    }

    function countPointsByOwner(selectedReason) {
      return achievementPoints.reduce((map, point) => {
        if (selectedReason && point.reason !== selectedReason) return map;
        map[point.owner] = (map[point.owner] || 0) + 1;
        return map;
      }, {});
    }

    function getStudentNumber(studentLabel) {
      const match = studentLabel.match(/^(\d+)/);
      return match ? Number(match[1]) : null;
    }

    function formatStudentDisplay(studentLabel) {
      const match = studentLabel.match(/^(\d+)\s*(.*)$/);
      if (!match) return studentLabel.replace(/\s+/g, "");
      const studentNo = match[1];
      const name = String(match[2] || "").replace(/\s+/g, "");
      return `${studentNo}${name}`;
    }

    function renderList() {
      const showPointsOnly = pointsOnlyCheckbox.checked;
      const selectedReason = reasonFilter.value;
      const sortMode = sortModeFilter ? sortModeFilter.value : "seats";
      const pointsByOwner = countPointsByOwner(selectedReason);
      const selectedPoints = achievementPoints.filter(
        (point) => !selectedReason || point.reason === selectedReason
      );
      const filtered = students.filter((student) => {
        if (!showPointsOnly) return true;
        const studentNumber = getStudentNumber(student);
        return studentNumber !== null && (pointsByOwner[studentNumber] || 0) > 0;
      });

      const displayStudents = filtered.slice();
      if (sortMode === "points-asc") {
        displayStudents.sort((a, b) => {
          const aNo = getStudentNumber(a) || 0;
          const bNo = getStudentNumber(b) || 0;
          const aPoints = pointsByOwner[aNo] || 0;
          const bPoints = pointsByOwner[bNo] || 0;
          if (aPoints !== bPoints) return aPoints - bPoints;
          return aNo - bNo;
        });
      }

      studentList.innerHTML = "";
      displayStudents.forEach((student) => {
        const studentNumber = getStudentNumber(student);
        const pointCount = studentNumber !== null ? (pointsByOwner[studentNumber] || 0) : 0;
        const item = document.createElement("li");
        const nameEl = document.createElement("span");
        nameEl.className = "student-name";
        nameEl.textContent = formatStudentDisplay(student);
        const pointsEl = document.createElement("span");
        pointsEl.className = "student-points";
        pointsEl.textContent = `${pointCount} 優點`;
        item.append(nameEl, pointsEl);
        if (pointCount > 0) item.classList.add("has-point");
        studentList.appendChild(item);
      });

      const reasonText = selectedReason || "全部";
      const sortText = sortMode === "points-asc" ? "優點少至多" : "座位";
      listMeta.textContent = `顯示 ${displayStudents.length} / ${students.length} 人（原因：${reasonText}，排序：${sortText}，總優點：${selectedPoints.length}）`;
    }

    buildReasonOptions();
    pointsOnlyCheckbox.addEventListener("change", renderList);
    reasonFilter.addEventListener("change", renderList);
    sortModeFilter.addEventListener("change", renderList);
    renderList();
  </script>
</body>
</html>
